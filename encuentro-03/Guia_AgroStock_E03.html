<script>
/* ===== datos: archivos reales del proyecto AgroStock.E03 (con comentarios didácticos) ===== */
const FILES = {"AgroStock.E03.slnx":{"lang":"xml","src":"<Solution>\n  <!-- Una solución con UN solo proyecto: en E03 ya no existe DemoHilos. -->\n  <Project Path=\"AgroStock.E03.csproj\" />\n</Solution>\n"},"Program.cs":{"lang":"cs","src":"// Único cambio respecto a E02: el espacio de nombres ahora es AgroStock.E03.\nusing AgroStock.E03.Data;\n\nnamespace AgroStock.E03;\n\ninternal static class Program\n{\n    [STAThread]\n    private static void Main()\n    {\n        ApplicationConfiguration.Initialize();\n\n        try\n        {\n            // Igual que en v2, pero ahora Inicializar() le pide al ORM que cree la base (ya no ejecuta un script SQL).\n            Db.Inicializar();\n        }\n        catch (Exception ex)\n        {\n            MessageBox.Show(\"No se pudo abrir la base de datos:\\n\" + ex.Message, \"AgroStock\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n            return;\n        }\n\n        Application.Run(new Forms.FrmPrincipal());\n    }\n}\n"},"AgroStock.E03.csproj":{"lang":"xml","src":"<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n    <OutputType>WinExe</OutputType>\n    <TargetFramework>net8.0-windows</TargetFramework>\n    <Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>\n    <UseWindowsForms>true</UseWindowsForms>\n  </PropertyGroup>\n\n  <ItemGroup>\n    <!-- ClosedXML: crea archivos .xlsx (Excel) sin necesitar Excel instalado. -->\n    <PackageReference Include=\"ClosedXML\" Version=\"0.104.2\" />\n    <!-- Entity Framework Core con SQLite: el ORM. Trae consigo Microsoft.Data.Sqlite y el motor nativo, por eso ya no se instala aparte. -->\n    <PackageReference Include=\"Microsoft.EntityFrameworkCore.Sqlite\" Version=\"8.0.10\" />\n    <!-- QuestPDF: genera documentos PDF desde C#. Licencia Community, gratuita para estudiantes y proyectos pequeños. -->\n    <PackageReference Include=\"QuestPDF\" Version=\"2024.10.4\" />\n  </ItemGroup>\n\n  <ItemGroup>\n    <!-- appsettings.json guarda la configuración de Mockaroo y debe copiarse junto al .exe. -->\n    <!-- agrostock.sql ya no aparece: el ORM crea la base a partir del modelo en C#. -->\n    <None Update=\"appsettings.json\" CopyToOutputDirectory=\"PreserveNewest\" />\n    <None Update=\"productos_importar.csv\" CopyToOutputDirectory=\"PreserveNewest\" />\n  </ItemGroup>\n\n</Project>\n"},"appsettings.json":{"lang":"json","src":"{\n  \"Mockaroo\": {\n    \"BaseUrl\": \"https://api.mockaroo.com/api/generate.json\",\n    \"ApiKey\": \"d4fada10\",\n    \"Schema\": \"agrostock_productos\"\n  }\n}\n"},"Models/Producto.cs":{"lang":"cs","src":"namespace AgroStock.E03.Models;\n\n// Entidad: EF Core la convierte en la tabla «productos». Cada propiedad pública es una columna.\npublic class Producto\n{\n    // Por convención, una propiedad llamada Id es la clave primaria autoincremental.\n    public int Id { get; set; }\n\n    public string Codigo { get; set; } = \"\";\n\n    public string Nombre { get; set; } = \"\";\n\n    // Clave foránea (FK) explícita: es la columna que realmente se guarda en la tabla.\n    public int CategoriaId { get; set; }\n\n    // CAMBIO v2 -> v3: antes era un texto con el nombre; ahora es el OBJETO Categoria (propiedad de navegación).\n    // EF la llena cuando la consulta usa Include().\n    public Categoria? Categoria { get; set; }\n\n    public decimal Precio { get; set; }\n\n    public int Existencia { get; set; }\n\n    public DateTime? Vencimiento { get; set; }\n\n    // Propiedad calculada: NO es una columna (el contexto la ignora con e.Ignore).\n    // Columna de solo lectura para la cuadrícula\n    public string CategoriaNombre => Categoria?.Nombre ?? \"\";\n}\n\n// Categoria pasa de ser un record a una clase con setters: EF necesita poder asignar sus propiedades.\npublic class Categoria\n{\n    public int Id { get; set; }\n\n    public string Nombre { get; set; } = \"\";\n\n    public override string ToString() => Nombre;\n}\n\n// NUEVO: en v2 el movimiento solo existía como filas SQL; ahora tiene su propia entidad (tabla «movimientos»).\npublic class Movimiento\n{\n    public int Id { get; set; }\n\n    public int ProductoId { get; set; }\n\n    // Propiedad de navegación hacia el producto movido.\n    public Producto? Producto { get; set; }\n\n    // «ENTRADA» o «SALIDA» (el contexto agrega un CHECK que lo exige).\n    public string Tipo { get; set; } = \"ENTRADA\";\n\n    public int Cantidad { get; set; }\n\n    // La fecha se guarda como texto yyyy-MM-dd (ver HasConversion en el contexto).\n    public DateTime Fecha { get; set; } = DateTime.Today;\n\n    // Columna de solo lectura para la cuadrícula\n    public string ProductoNombre => Producto is null ? \"\" : $\"{Producto.Codigo} · {Producto.Nombre}\";\n}\n"},"Data/AgroStockContext.cs":{"lang":"cs","src":"using Microsoft.EntityFrameworkCore;\nusing AgroStock.E03.Models;\n\nnamespace AgroStock.E03.Data;\n\n// DbContext = la sesión de trabajo con la base de datos. Reemplaza a Db.Abrir() y a los SqliteCommand de E02.\n// Se crea con «using» en cada operación y se libera al terminar, igual que la conexión en v2.\npublic class AgroStockContext : DbContext\n{\n    // Misma regla de v2: el archivo agrostock.db vive junto al .exe.\n    public static readonly string Ruta = Path.Combine(AppContext.BaseDirectory, \"agrostock.db\");\n\n    // Cada DbSet<T> es una tabla que se consulta con LINQ (ctx.Productos.Where(...)).\n    public DbSet<Categoria> Categorias => Set<Categoria>();\n    public DbSet<Producto> Productos => Set<Producto>();\n    public DbSet<Movimiento> Movimientos => Set<Movimiento>();\n\n    // Aquí se elige el proveedor: SQLite y la ruta del archivo.\n    // Microsoft.Data.Sqlite activa las claves foráneas (PRAGMA foreign_keys) al abrir cada conexión.\n    protected override void OnConfiguring(DbContextOptionsBuilder options)\n        => options.UseSqlite($\"Data Source={Ruta}\");\n\n    // OnModelCreating describe el modelo con la API fluida: nombres de tablas, restricciones, relaciones y datos iniciales.\n    protected override void OnModelCreating(ModelBuilder mb)\n    {\n        mb.Entity<Categoria>(e =>\n        {\n            // Nombre de la tabla (sin esto se llamaría «Categorias», como el DbSet).\n            e.ToTable(\"categorias\");\n            e.Property(c => c.Nombre).IsRequired();\n            // Índice único = UNIQUE de SQL: no hay dos categorías con el mismo nombre.\n            e.HasIndex(c => c.Nombre).IsUnique();\n        });\n\n        mb.Entity<Producto>(e =>\n        {\n            e.ToTable(\"productos\", t =>\n            {\n                // CHECK: reglas que la base hace cumplir aunque falle la interfaz (las mismas de agrostock.sql).\n                t.HasCheckConstraint(\"ck_precio\", \"precio > 0\");\n                t.HasCheckConstraint(\"ck_existencia\", \"existencia >= 0\");\n            });\n            e.Property(p => p.Codigo).IsRequired();\n            e.Property(p => p.Nombre).IsRequired();\n            // SQLite no tiene decimal: se guarda como REAL (double) y se lee de vuelta como decimal.\n            e.Property(p => p.Precio).HasConversion<double>();\n            // Vencimiento se guarda como texto yyyy-MM-dd, o NULL si el producto no vence (igual que en v2).\n            e.Property(p => p.Vencimiento).HasConversion(\n                v => v == null ? null : v.Value.ToString(\"yyyy-MM-dd\"),\n                s => s == null ? null : DateTime.Parse(s));\n            // UNIQUE sobre el código: es lo que produce el error 2067 que FrmPrincipal captura.\n            e.HasIndex(p => p.Codigo).IsUnique();\n            // Relación muchos a uno (FK hacia categorias).\n            // Restrict = no se puede borrar una categoría que tenga productos (equivale al REFERENCES de E02).\n            e.HasOne(p => p.Categoria).WithMany().HasForeignKey(p => p.CategoriaId).OnDelete(DeleteBehavior.Restrict);\n            // La propiedad calculada no es columna.\n            e.Ignore(p => p.CategoriaNombre);\n        });\n\n        mb.Entity<Movimiento>(e =>\n        {\n            e.ToTable(\"movimientos\", t =>\n            {\n                t.HasCheckConstraint(\"ck_tipo\", \"tipo IN ('ENTRADA', 'SALIDA')\");\n                t.HasCheckConstraint(\"ck_cantidad\", \"cantidad > 0\");\n            });\n            // La fecha del movimiento también se guarda como texto yyyy-MM-dd.\n            e.Property(m => m.Fecha).HasConversion(f => f.ToString(\"yyyy-MM-dd\"), s => DateTime.Parse(s));\n            e.HasOne(m => m.Producto).WithMany().HasForeignKey(m => m.ProductoId).OnDelete(DeleteBehavior.Restrict);\n            e.Ignore(m => m.ProductoNombre);\n        });\n\n        // HasData = datos iniciales (los INSERT de agrostock.sql). Se insertan cuando EnsureCreated crea la base.\n        mb.Entity<Categoria>().HasData(\n            new Categoria { Id = 1, Nombre = \"Fertilizantes\" },\n            new Categoria { Id = 2, Nombre = \"Semillas\" },\n            new Categoria { Id = 3, Nombre = \"Herbicidas\" },\n            new Categoria { Id = 4, Nombre = \"Herramientas\" });\n\n        mb.Entity<Producto>().HasData(\n            P(1, \"FER-001\", \"Fórmula 18-46-0 (quintal)\", 1, 1250.00m, 24, null),\n            P(2, \"FER-002\", \"Urea 46% (quintal)\", 1, 1100.00m, 18, null),\n            P(3, \"FER-003\", \"Fórmula 12-30-10 (quintal)\", 1, 1180.00m, 6, null),\n            P(4, \"SEM-001\", \"Semilla de frijol rojo (libra)\", 2, 32.50m, 150, new DateTime(2027, 3, 31)),\n            P(5, \"SEM-002\", \"Semilla de maíz (libra)\", 2, 28.00m, 200, new DateTime(2026, 11, 30)),\n            P(6, \"SEM-003\", \"Semilla de sorgo (libra)\", 2, 22.00m, 8, new DateTime(2026, 12, 15)),\n            P(7, \"HER-001\", \"Glifosato (litro)\", 3, 180.00m, 8, new DateTime(2027, 8, 15)),\n            P(8, \"HER-002\", \"Paraquat (litro)\", 3, 210.00m, 15, new DateTime(2027, 5, 20)),\n            P(9, \"HER-003\", \"2,4-D amina (litro)\", 3, 165.00m, 30, new DateTime(2026, 12, 1)),\n            P(10, \"HER-004\", \"Atrazina (kilo)\", 3, 140.00m, 12, new DateTime(2027, 2, 10)),\n            P(11, \"HER-005\", \"Metsulfurón (sobre)\", 3, 95.00m, 4, new DateTime(2027, 6, 30)),\n            P(12, \"HTA-001\", \"Machete de 22 pulgadas\", 4, 250.00m, 0, null),\n            P(13, \"HTA-002\", \"Bomba de mochila (20 L)\", 4, 1450.00m, 5, null),\n            P(14, \"HTA-003\", \"Piocha con cabo\", 4, 320.00m, 0, null));\n\n        mb.Entity<Movimiento>().HasData(\n            M(1, 1, \"ENTRADA\", 30, new DateTime(2026, 10, 1)),\n            M(2, 1, \"SALIDA\", 6, new DateTime(2026, 10, 5)),\n            M(3, 4, \"ENTRADA\", 200, new DateTime(2026, 10, 2)),\n            M(4, 5, \"SALIDA\", 20, new DateTime(2026, 10, 6)),\n            M(5, 7, \"SALIDA\", 2, new DateTime(2026, 10, 7)),\n            M(6, 10, \"ENTRADA\", 15, new DateTime(2026, 10, 3)));\n    }\n\n    // Funciones auxiliares para escribir cada producto del HasData en una sola línea.\n    private static Producto P(int id, string cod, string nom, int cat, decimal pre, int exi, DateTime? ven) => new()\n    {\n        Id = id, Codigo = cod, Nombre = nom, CategoriaId = cat, Precio = pre, Existencia = exi, Vencimiento = ven\n    };\n\n    private static Movimiento M(int id, int prod, string tipo, int cant, DateTime fecha) => new()\n    {\n        Id = id, ProductoId = prod, Tipo = tipo, Cantidad = cant, Fecha = fecha\n    };\n}\n"},"Data/Db.cs":{"lang":"cs","src":"namespace AgroStock.E03.Data;\n\n// En E02 esta clase abría conexiones y ejecutaba agrostock.sql. Ahora solo prepara la base: el ORM hace el resto.\npublic static class Db\n{\n    // Crea la base de datos y los datos iniciales a partir del modelo (sin scripts SQL).\n    public static void Inicializar()\n    {\n        using var ctx = new AgroStockContext();\n        // EnsureCreated: si agrostock.db no existe, la crea con sus tablas y los datos de HasData.\n        // Si ya tiene tablas, NO la toca ni la actualiza: si cambia el modelo, borre agrostock.db de bin\\Debug\\net8.0-windows\\.\n        ctx.Database.EnsureCreated();\n    }\n}\n"},"Data/ProductoRepository.cs":{"lang":"cs","src":"using Microsoft.EntityFrameworkCore;\nusing AgroStock.E03.Models;\n\nnamespace AgroStock.E03.Data;\n\n// Mismo patrón repositorio de v2 (los formularios no saben de SQL), pero ahora el «SQL» son consultas LINQ sobre el contexto.\npublic class ProductoRepository\n{\n    public List<Producto> Listar(string filtro = \"\")\n    {\n        // Un contexto por operación, liberado con using: reemplaza a Db.Abrir() de E02.\n        using var ctx = new AgroStockContext();\n        return ctx.Productos\n            // Include = JOIN: trae también la categoría de cada producto (sin él, CategoriaNombre quedaría vacío).\n            .Include(p => p.Categoria)\n            // EF.Functions.Like se traduce a LIKE. El filtro viaja como PARÁMETRO: EF nunca concatena el texto en el SQL.\n            .Where(p => EF.Functions.Like(p.Nombre, $\"%{filtro}%\") || EF.Functions.Like(p.Codigo, $\"%{filtro}%\"))\n            .OrderBy(p => p.Nombre)\n            // La consulta se ejecuta aquí (ejecución diferida): hasta ToList() solo se ha descrito qué se quiere.\n            .ToList();\n    }\n\n    public List<Categoria> Categorias()\n    {\n        using var ctx = new AgroStockContext();\n        return ctx.Categorias.OrderBy(c => c.Nombre).ToList();\n    }\n\n    public void Insertar(Producto p)\n    {\n        using var ctx = new AgroStockContext();\n        // Add + SaveChanges = INSERT. EF asigna el Id generado al objeto.\n        ctx.Productos.Add(Limpio(p));\n        ctx.SaveChanges();\n    }\n\n    // Inserta varios productos en una sola transacción; devuelve los códigos que ya existían.\n    public List<string> InsertarVarios(IEnumerable<Producto> productos)\n    {\n        using var ctx = new AgroStockContext();\n        // Se leen los códigos existentes UNA vez y se compara en memoria: los repetidos se informan en lugar de hacer fallar todo.\n        var existentes = ctx.Productos.Select(p => p.Codigo).ToHashSet(StringComparer.OrdinalIgnoreCase);\n        var duplicados = new List<string>();\n\n        foreach (var p in productos)\n        {\n            if (!existentes.Add(p.Codigo))\n            {\n                duplicados.Add(p.Codigo);\n                continue;\n            }\n            ctx.Productos.Add(Limpio(p));\n        }\n        // SaveChanges envía todos los INSERT en UNA transacción: si uno falla, ninguno queda guardado.\n        ctx.SaveChanges();\n        return duplicados;\n    }\n\n    public void Actualizar(Producto p)\n    {\n        using var ctx = new AgroStockContext();\n        // Update marca el producto como modificado: UPDATE ... WHERE Id = ...\n        ctx.Productos.Update(Limpio(p));\n        ctx.SaveChanges();\n    }\n\n    public void Eliminar(int id)\n    {\n        using var ctx = new AgroStockContext();\n        // Find busca por clave primaria.\n        var p = ctx.Productos.Find(id);\n        if (p is null) return;\n        // Remove + SaveChanges = DELETE. Si el producto tiene movimientos, la FK (Restrict) lo impide y se lanza DbUpdateException.\n        ctx.Productos.Remove(p);\n        ctx.SaveChanges();\n    }\n\n    // CAMBIO: en v2 eran dos sentencias SQL dentro de una transacción explícita.\n    // Ahora se modifica el objeto y se agrega el movimiento; SaveChanges los guarda JUNTOS en una sola transacción automática.\n    public void RegistrarMovimiento(int productoId, string tipo, int cantidad)\n    {\n        using var ctx = new AgroStockContext();\n        var p = ctx.Productos.Find(productoId) ?? throw new InvalidOperationException(\"Producto no encontrado.\");\n\n        // La validación pasa a C# (antes la hacía el CHECK al fallar con el error 275).\n        // El CHECK ck_existencia sigue existiendo como red de seguridad.\n        if (tipo == \"SALIDA\" && p.Existencia < cantidad)\n            throw new InvalidOperationException(\"Existencia insuficiente: no se registró nada.\");\n\n        p.Existencia += tipo == \"ENTRADA\" ? cantidad : -cantidad;\n        ctx.Movimientos.Add(new Movimiento { ProductoId = productoId, Tipo = tipo, Cantidad = cantidad, Fecha = DateTime.Today });\n        ctx.SaveChanges();   // una sola transacción para ambos cambios\n    }\n\n    // NUEVO: alimenta el historial (FrmMovimientos), del más reciente al más antiguo.\n    public List<Movimiento> Movimientos()\n    {\n        using var ctx = new AgroStockContext();\n        return ctx.Movimientos\n            .Include(m => m.Producto)\n            .OrderByDescending(m => m.Fecha).ThenByDescending(m => m.Id)\n            .ToList();\n    }\n\n    // Evita que EF intente insertar/actualizar la categoría de navegación.\n    // Copia del producto SIN el objeto Categoria, para que Add/Update no toquen la tabla categorias.\n    private static Producto Limpio(Producto p) => new()\n    {\n        Id = p.Id, Codigo = p.Codigo, Nombre = p.Nombre, CategoriaId = p.CategoriaId,\n        Precio = p.Precio, Existencia = p.Existencia, Vencimiento = p.Vencimiento\n    };\n}\n"},"Services/MockarooClient.cs":{"lang":"cs","src":"using System.Globalization;\nusing System.Text.Json;\nusing System.Text.Json.Serialization;\nusing AgroStock.E03.Models;\n\nnamespace AgroStock.E03.Services;\n\n// Fila tal como la devuelve el schema de Mockaroo (los nombres coinciden con los campos del schema).\npublic class ProductoMockaroo\n{\n    // [JsonPropertyName] une cada propiedad de C# con un campo del JSON; los nombres deben coincidir con los del schema de Mockaroo.\n    [JsonPropertyName(\"codigo\")] public string Codigo { get; set; } = \"\";\n    [JsonPropertyName(\"nombre\")] public string Nombre { get; set; } = \"\";\n    [JsonPropertyName(\"categoria\")] public string Categoria { get; set; } = \"\";\n    [JsonPropertyName(\"precio\")] public decimal Precio { get; set; }\n    [JsonPropertyName(\"existencia\")] public int Existencia { get; set; }\n    [JsonPropertyName(\"vencimiento\")] public string? Vencimiento { get; set; }\n}\n\n// Cliente de un SERVICIO WEB REST: envía una petición HTTP GET y recibe datos en formato JSON.\npublic class MockarooClient\n{\n    // UN solo HttpClient para toda la aplicación (reutilizarlo evita agotar conexiones).\n    // Timeout: si Mockaroo no responde en 30 s, la petición se cancela.\n    private static readonly HttpClient Http = new() { Timeout = TimeSpan.FromSeconds(30) };\n\n    private readonly string baseUrl;\n    private readonly string apiKey;\n    private readonly string schema;\n\n    // La URL, la clave y el schema se leen de appsettings.json: no se escriben dentro del código.\n    public MockarooClient()\n    {\n        var ruta = Path.Combine(AppContext.BaseDirectory, \"appsettings.json\");\n        if (!File.Exists(ruta)) throw new InvalidOperationException(\"No se encontró appsettings.json.\");\n\n        // System.Text.Json (incluido en .NET) lee el archivo de configuración.\n        using var doc = JsonDocument.Parse(File.ReadAllText(ruta));\n        var cfg = doc.RootElement.GetProperty(\"Mockaroo\");\n        baseUrl = cfg.GetProperty(\"BaseUrl\").GetString()!;\n        apiKey = cfg.GetProperty(\"ApiKey\").GetString()!;\n        schema = cfg.GetProperty(\"Schema\").GetString()!;\n    }\n\n    // Llamada síncrona (un solo hilo): la interfaz espera la respuesta.\n    public List<ProductoMockaroo> ObtenerProductos(int cantidad)\n    {\n        // Falla temprano y con un mensaje claro si nadie escribió la clave.\n        if (string.IsNullOrWhiteSpace(apiKey) || apiKey.StartsWith(\"PENDIENTE\"))\n            throw new InvalidOperationException(\"Falta la clave de API de Mockaroo en appsettings.json.\");\n\n        // Parámetros de la URL: schema = qué plantilla usar; count = cuántas filas; array=true = respuesta como lista JSON.\n        // EscapeDataString protege los caracteres especiales.\n        var url = $\"{baseUrl}?schema={Uri.EscapeDataString(schema)}&count={cantidad}&array=true\";\n        using var req = new HttpRequestMessage(HttpMethod.Get, url);\n        // La clave viaja en un encabezado HTTP, no en la URL.\n        req.Headers.Add(\"X-API-Key\", apiKey);\n\n        // Send es SÍNCRONO: el hilo de la interfaz espera la respuesta (la ventana no responde mientras tanto).\n        using var resp = Http.Send(req);\n        using var flujo = resp.Content.ReadAsStream();\n        // 2xx = éxito. Por ejemplo, 401 = clave incorrecta y 404 = schema inexistente.\n        if (!resp.IsSuccessStatusCode)\n        {\n            using var lector = new StreamReader(flujo);\n            throw new HttpRequestException($\"Mockaroo respondió {(int)resp.StatusCode}: {lector.ReadToEnd()}\");\n        }\n\n        // Deserializar = convertir el texto JSON en una lista de objetos ProductoMockaroo.\n        return JsonSerializer.Deserialize<List<ProductoMockaroo>>(flujo) ?? new();\n    }\n\n    // Valida cada fila del servicio con reglas parecidas a las del formulario; devuelve null si no sirve (la fila cuenta como inválida).\n    public static Producto? Convertir(ProductoMockaroo m, Dictionary<string, Categoria> categorias)\n    {\n        if (!categorias.TryGetValue(m.Categoria.Trim(), out var cat)) return null;\n        if (m.Codigo.Trim().Length < 3 || m.Nombre.Trim().Length < 3 || m.Precio <= 0 || m.Existencia < 0) return null;\n\n        return new Producto\n        {\n            Codigo = m.Codigo.Trim().ToUpperInvariant(),\n            Nombre = m.Nombre.Trim(),\n            CategoriaId = cat.Id,\n            Precio = m.Precio,\n            Existencia = m.Existencia,\n            Vencimiento = DateTime.TryParse(m.Vencimiento, CultureInfo.InvariantCulture, DateTimeStyles.None, out var v) ? v.Date : null\n        };\n    }\n}\n"},"Services/ReporteService.cs":{"lang":"cs","src":"using ClosedXML.Excel;\nusing QuestPDF.Fluent;\nusing QuestPDF.Helpers;\nusing QuestPDF.Infrastructure;\nusing AgroStock.E03.Models;\n\nnamespace AgroStock.E03.Services;\n\n// Genera los dos reportes. No conoce formularios ni la base: recibe la lista de productos y la ruta del archivo.\npublic class ReporteService\n{\n    static ReporteService()\n    {\n        // QuestPDF exige declarar el tipo de licencia antes de usarlo. Community es gratuita para estudiantes y proyectos pequeños.\n        QuestPDF.Settings.License = LicenseType.Community;\n    }\n\n    // PDF con QuestPDF: el documento se describe con una API fluida (página → encabezado, contenido, pie).\n    public void GenerarPdf(string ruta, List<Producto> productos)\n    {\n        // Valor del inventario = suma de precio x existencia.\n        var valorTotal = productos.Sum(p => p.Precio * p.Existencia);\n\n        Document.Create(doc => doc.Page(page =>\n        {\n            // Hoja A4 horizontal para que quepan las seis columnas.\n            page.Size(PageSizes.A4.Landscape());\n            page.Margin(30);\n            page.DefaultTextStyle(t => t.FontSize(10));\n\n            page.Header().Column(col =>\n            {\n                col.Item().Text(\"AgroStock - Reporte de inventario\").FontSize(18).Bold();\n                col.Item().Text($\"Generado: {DateTime.Now:dd/MM/yyyy HH:mm}\").FontSize(9);\n            });\n\n            page.Content().PaddingVertical(10).Table(tabla =>\n            {\n                // ConstantColumn = ancho fijo; RelativeColumn = reparte el espacio que sobra.\n                tabla.ColumnsDefinition(c =>\n                {\n                    c.ConstantColumn(80);\n                    c.RelativeColumn(3);\n                    c.RelativeColumn(1.5f);\n                    c.ConstantColumn(80);\n                    c.ConstantColumn(70);\n                    c.ConstantColumn(85);\n                });\n\n                // El encabezado de la tabla se repite en cada página.\n                tabla.Header(h =>\n                {\n                    foreach (var t in new[] { \"Código\", \"Nombre\", \"Categoría\", \"Precio (C$)\", \"Existencia\", \"Vencimiento\" })\n                        h.Cell().Background(Colors.Green.Darken2).Padding(4).Text(t).FontColor(Colors.White).Bold();\n                });\n\n                foreach (var p in productos)\n                {\n                    // Los productos con existencia menor que 10 se resaltan en rojo claro.\n                    var fondo = p.Existencia < 10 ? Colors.Red.Lighten4 : Colors.White;\n                    Celda(tabla, p.Codigo, fondo);\n                    Celda(tabla, p.Nombre, fondo);\n                    Celda(tabla, p.CategoriaNombre, fondo);\n                    Celda(tabla, p.Precio.ToString(\"N2\"), fondo);\n                    Celda(tabla, p.Existencia.ToString(), fondo);\n                    Celda(tabla, p.Vencimiento?.ToString(\"dd/MM/yyyy\") ?? \"\", fondo);\n                }\n            });\n\n            // Pie de página: totales a la izquierda y «Página X de Y» a la derecha.\n            page.Footer().Row(r =>\n            {\n                r.RelativeItem().Text($\"Productos: {productos.Count}   |   Valor del inventario: C$ {valorTotal:N2}\");\n                r.RelativeItem().AlignRight().Text(t =>\n                {\n                    t.Span(\"Página \");\n                    t.CurrentPageNumber();\n                    t.Span(\" de \");\n                    t.TotalPages();\n                });\n            });\n        })).GeneratePdf(ruta);\n    }\n\n    // Evita repetir seis veces el mismo formato de celda.\n    private static void Celda(TableDescriptor tabla, string texto, string fondo)\n        => tabla.Cell().Background(fondo).BorderBottom(0.5f).BorderColor(Colors.Grey.Lighten1).Padding(4).Text(texto);\n\n    // Excel con ClosedXML: un libro (XLWorkbook) con una hoja y celdas con fórmulas reales.\n    public void GenerarExcel(string ruta, List<Producto> productos)\n    {\n        using var libro = new XLWorkbook();\n        var hoja = libro.Worksheets.Add(\"Inventario\");\n\n        string[] encabezados = { \"Código\", \"Nombre\", \"Categoría\", \"Precio (C$)\", \"Existencia\", \"Vencimiento\", \"Valor (C$)\" };\n        for (int i = 0; i < encabezados.Length; i++)\n            hoja.Cell(1, i + 1).Value = encabezados[i];\n\n        // Estilo del encabezado: negrita, letra blanca y fondo verde oscuro.\n        var cab = hoja.Range(1, 1, 1, encabezados.Length);\n        cab.Style.Font.Bold = true;\n        cab.Style.Font.FontColor = XLColor.White;\n        cab.Style.Fill.BackgroundColor = XLColor.DarkGreen;\n\n        int fila = 2;\n        foreach (var p in productos)\n        {\n            hoja.Cell(fila, 1).Value = p.Codigo;\n            hoja.Cell(fila, 2).Value = p.Nombre;\n            hoja.Cell(fila, 3).Value = p.CategoriaNombre;\n            hoja.Cell(fila, 4).Value = p.Precio;\n            hoja.Cell(fila, 5).Value = p.Existencia;\n            if (p.Vencimiento.HasValue) hoja.Cell(fila, 6).Value = p.Vencimiento.Value;\n            // FormulaA1 escribe una fórmula de Excel: la celda se recalcula si el usuario cambia precio o existencia.\n            hoja.Cell(fila, 7).FormulaA1 = $\"D{fila}*E{fila}\";\n            fila++;\n        }\n\n        // Fila final con el total de la columna Valor.\n        hoja.Cell(fila, 6).Value = \"Total:\";\n        hoja.Cell(fila, 6).Style.Font.Bold = true;\n        hoja.Cell(fila, 7).FormulaA1 = $\"SUM(G2:G{fila - 1})\";\n        hoja.Cell(fila, 7).Style.Font.Bold = true;\n\n        hoja.Range(2, 4, fila, 4).Style.NumberFormat.Format = \"#,##0.00\";\n        hoja.Range(2, 7, fila, 7).Style.NumberFormat.Format = \"#,##0.00\";\n        hoja.Range(2, 6, fila - 1, 6).Style.DateFormat.Format = \"dd/MM/yyyy\";\n        // Inmoviliza la fila de títulos al desplazarse.\n        hoja.SheetView.FreezeRows(1);\n        hoja.Columns().AdjustToContents();\n\n        // Si el archivo está abierto en Excel, lanza IOException (la captura FrmPrincipal).\n        libro.SaveAs(ruta);\n    }\n}\n"},"Forms/FrmImportar.cs":{"lang":"cs","src":"using System.Globalization;\nusing Microsoft.EntityFrameworkCore;\nusing AgroStock.E03.Data;\nusing AgroStock.E03.Models;\nusing AgroStock.E03.Services;\n\nnamespace AgroStock.E03.Forms;\n\n// CAMBIO IMPORTANTE respecto a E02: este formulario ya no usa hilos, async ni transacción manual.\n// El foco de E03 es el ORM y el servicio web. Dos orígenes de datos (CSV y Mockaroo) y un solo camino para guardarlos: Ejecutar().\npublic partial class FrmImportar : Form\n{\n    private readonly ProductoRepository repo;\n\n    public FrmImportar(ProductoRepository repo)\n    {\n        InitializeComponent();\n        this.repo = repo;\n        btnExaminar.Click += BtnExaminar_Click;\n        btnIniciar.Click += BtnIniciar_Click;\n        // NUEVO: botón que consulta el servicio web.\n        btnMockaroo.Click += BtnMockaroo_Click;\n        btnCerrar.Click += (_, _) => Close();\n        txtArchivo.Text = Path.Combine(AppContext.BaseDirectory, \"productos_importar.csv\");\n    }\n\n    private void BtnExaminar_Click(object? sender, EventArgs e)\n    {\n        using var dlg = new OpenFileDialog { Filter = \"Archivo CSV (*.csv)|*.csv\", Title = \"Elegir productos a importar\" };\n        if (dlg.ShowDialog(this) == DialogResult.OK) txtArchivo.Text = dlg.FileName;\n    }\n\n    private void BtnIniciar_Click(object? sender, EventArgs e)\n    {\n        var ruta = txtArchivo.Text;\n        if (!File.Exists(ruta))\n        {\n            MessageBox.Show(this, \"No se encontró el archivo CSV.\", \"Importar\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            return;\n        }\n\n        // A Ejecutar se le pasa una función que LEE y valida los datos; Ejecutar se encarga de guardar y de informar.\n        Ejecutar(() =>\n        {\n            var lineas = File.ReadAllLines(ruta).Skip(1).Where(l => l.Trim().Length > 0).ToArray();   // Skip(1): encabezado\n            var categorias = repo.Categorias().ToDictionary(c => c.Nombre, StringComparer.OrdinalIgnoreCase);\n\n            var validos = new List<Producto>();\n            var rechazadas = 0;\n            for (int i = 0; i < lineas.Length; i++)\n            {\n                var p = Parsear(lineas[i], categorias);\n                if (p is null) rechazadas++; else validos.Add(p);\n                Avanzar((i + 1) * 100 / lineas.Length);\n            }\n            return (validos, rechazadas);\n        });\n    }\n\n    private void BtnMockaroo_Click(object? sender, EventArgs e)\n    {\n        Ejecutar(() =>\n        {\n            lblEstado.Text = \"Consultando Mockaroo…\";\n            lblEstado.Refresh();\n\n            // Llamada HTTP síncrona al servicio web (el cuadro numérico define cuántos productos pedir).\n            var filas = new MockarooClient().ObtenerProductos((int)nudCantidad.Value);\n            var categorias = repo.Categorias().ToDictionary(c => c.Nombre, StringComparer.OrdinalIgnoreCase);\n\n            var validos = new List<Producto>();\n            var rechazadas = 0;\n            for (int i = 0; i < filas.Count; i++)\n            {\n                var p = MockarooClient.Convertir(filas[i], categorias);\n                if (p is null) rechazadas++; else validos.Add(p);\n                Avanzar((i + 1) * 100 / filas.Count);\n            }\n            return (validos, rechazadas);\n        });\n    }\n\n    // Lee los datos con la función dada y los guarda con el ORM en una sola transacción.\n    private void Ejecutar(Func<(List<Producto> validos, int rechazadas)> leer)\n    {\n        Habilitar(false);\n        barra.Value = 0;\n        // Cursor de espera: la ventana queda ocupada hasta terminar (no hay hilo aparte).\n        UseWaitCursor = true;\n        try\n        {\n            // La función devuelve una tupla: dos valores a la vez (productos válidos y cantidad de filas rechazadas).\n            var (validos, rechazadas) = leer();\n            // Una sola transacción para todo. Los códigos que ya existían no hacen fallar la importación: se informan.\n            var duplicados = repo.InsertarVarios(validos);\n            barra.Value = 100;\n            lblEstado.Text = $\"Importación terminada: {validos.Count - duplicados.Count} productos, \" +\n                             $\"{rechazadas} filas inválidas, {duplicados.Count} códigos repetidos.\";\n        }\n        // Si la base rechaza algo, SaveChanges revierte TODO: nada queda a medias.\n        catch (DbUpdateException ex)\n        {\n            barra.Value = 0;\n            lblEstado.Text = \"Se revirtió la importación: \" + (ex.InnerException?.Message ?? ex.Message);\n        }\n        // Errores de archivo, de red o de formato JSON: se muestran en la etiqueta y la ventana sigue viva.\n        catch (Exception ex) when (ex is IOException or HttpRequestException or InvalidOperationException\n                                       or TaskCanceledException or System.Text.Json.JsonException)\n        {\n            barra.Value = 0;\n            lblEstado.Text = \"No se pudo completar: \" + ex.Message;\n        }\n        finally\n        {\n            UseWaitCursor = false;\n            Habilitar(true);\n        }\n    }\n\n    // Refresh() fuerza el repintado inmediato; sin él no se vería avanzar la barra, porque el hilo de la interfaz está ocupado.\n    private void Avanzar(int pct)\n    {\n        barra.Value = pct;\n        lblEstado.Text = $\"Procesando… {pct} %\";\n        barra.Refresh();\n        lblEstado.Refresh();\n    }\n\n    private static Producto? Parsear(string linea, Dictionary<string, Categoria> categorias)\n    {\n        var c = linea.Split(';');\n        if (c.Length < 5 || !categorias.TryGetValue(c[2].Trim(), out var categoria)) return null;\n        if (!decimal.TryParse(c[3], NumberStyles.Number, CultureInfo.InvariantCulture, out var precio) || precio <= 0) return null;\n        if (!int.TryParse(c[4], out var existencia) || existencia < 0) return null;\n\n        return new Producto\n        {\n            Codigo = c[0].Trim(),\n            Nombre = c[1].Trim(),\n            CategoriaId = categoria.Id,\n            Precio = precio,\n            Existencia = existencia,\n            Vencimiento = c.Length > 5 && DateTime.TryParse(c[5], CultureInfo.InvariantCulture, out var v) ? v : null\n        };\n    }\n\n    private void Habilitar(bool si)\n    {\n        btnIniciar.Enabled = si;\n        btnExaminar.Enabled = si;\n        btnMockaroo.Enabled = si;\n        btnCerrar.Enabled = si;\n    }\n}\n"},"Forms/FrmImportar.Designer.cs":{"lang":"cs","src":"#nullable enable\nnamespace AgroStock.E03.Forms;\n\npartial class FrmImportar\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && (components != null))\n        {\n            components.Dispose();\n        }\n        base.Dispose(disposing);\n    }\n\n    private void InitializeComponent()\n    {\n        components = new System.ComponentModel.Container();\n        lblArchivo = new Label();\n        txtArchivo = new TextBox();\n        btnExaminar = new Button();\n        btnIniciar = new Button();\n        // NUEVOS: lblCantidad, nudCantidad y btnMockaroo.\n        // Desaparecen chkBloqueante y btnCancelar (ya no hay hilos que cancelar).\n        lblCantidad = new Label();\n        nudCantidad = new NumericUpDown();\n        btnMockaroo = new Button();\n        btnCerrar = new Button();\n        barra = new ProgressBar();\n        lblEstado = new Label();\n        ((System.ComponentModel.ISupportInitialize)nudCantidad).BeginInit();\n        SuspendLayout();\n\n        lblArchivo.AutoSize = true;\n        lblArchivo.Location = new Point(20, 23);\n        lblArchivo.Name = \"lblArchivo\";\n        lblArchivo.TabIndex = 0;\n        lblArchivo.Text = \"&Archivo CSV:\";\n\n        txtArchivo.Location = new Point(115, 20);\n        txtArchivo.Name = \"txtArchivo\";\n        txtArchivo.Size = new Size(330, 23);\n        txtArchivo.TabIndex = 1;\n\n        btnExaminar.Location = new Point(455, 18);\n        btnExaminar.Name = \"btnExaminar\";\n        btnExaminar.Size = new Size(90, 27);\n        btnExaminar.TabIndex = 2;\n        btnExaminar.Text = \"E&xaminar...\";\n        btnExaminar.UseVisualStyleBackColor = true;\n\n        btnIniciar.Location = new Point(20, 58);\n        btnIniciar.Name = \"btnIniciar\";\n        btnIniciar.Size = new Size(140, 30);\n        btnIniciar.TabIndex = 3;\n        btnIniciar.Text = \"&Importar CSV\";\n        btnIniciar.UseVisualStyleBackColor = true;\n\n        lblCantidad.AutoSize = true;\n        lblCantidad.Location = new Point(20, 108);\n        lblCantidad.Name = \"lblCantidad\";\n        lblCantidad.TabIndex = 4;\n        lblCantidad.Text = \"Productos de prueba (Mockaroo):\";\n\n        nudCantidad.Location = new Point(225, 104);\n        nudCantidad.Maximum = 1000;\n        nudCantidad.Minimum = 1;\n        nudCantidad.Name = \"nudCantidad\";\n        nudCantidad.Size = new Size(70, 23);\n        nudCantidad.TabIndex = 5;\n        nudCantidad.Value = 20;\n\n        btnMockaroo.Location = new Point(305, 100);\n        btnMockaroo.Name = \"btnMockaroo\";\n        btnMockaroo.Size = new Size(140, 30);\n        btnMockaroo.TabIndex = 6;\n        btnMockaroo.Text = \"Obtener de &Mockaroo\";\n        btnMockaroo.UseVisualStyleBackColor = true;\n\n        btnCerrar.Location = new Point(455, 100);\n        btnCerrar.Name = \"btnCerrar\";\n        btnCerrar.Size = new Size(90, 30);\n        btnCerrar.TabIndex = 7;\n        btnCerrar.Text = \"Cerrar\";\n        btnCerrar.UseVisualStyleBackColor = true;\n\n        barra.Location = new Point(20, 150);\n        barra.Name = \"barra\";\n        barra.Size = new Size(525, 23);\n        barra.TabIndex = 8;\n\n        lblEstado.AutoSize = false;\n        lblEstado.Location = new Point(20, 183);\n        lblEstado.Name = \"lblEstado\";\n        lblEstado.Size = new Size(525, 40);\n        lblEstado.TabIndex = 9;\n        lblEstado.Text = \"Listo para importar.\";\n\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        ClientSize = new Size(565, 240);\n        Controls.Add(lblArchivo);\n        Controls.Add(txtArchivo);\n        Controls.Add(btnExaminar);\n        Controls.Add(btnIniciar);\n        Controls.Add(lblCantidad);\n        Controls.Add(nudCantidad);\n        Controls.Add(btnMockaroo);\n        Controls.Add(btnCerrar);\n        Controls.Add(barra);\n        Controls.Add(lblEstado);\n        FormBorderStyle = FormBorderStyle.FixedDialog;\n        MaximizeBox = false;\n        MinimizeBox = false;\n        Name = \"FrmImportar\";\n        StartPosition = FormStartPosition.CenterParent;\n        Text = \"Importar productos\";\n        ((System.ComponentModel.ISupportInitialize)nudCantidad).EndInit();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n\n    private Label lblArchivo = null!;\n    private TextBox txtArchivo = null!;\n    private Button btnExaminar = null!;\n    private Button btnIniciar = null!;\n    private Label lblCantidad = null!;\n    private NumericUpDown nudCantidad = null!;\n    private Button btnMockaroo = null!;\n    private Button btnCerrar = null!;\n    private ProgressBar barra = null!;\n    private Label lblEstado = null!;\n}\n"},"Forms/FrmPrincipal.cs":{"lang":"cs","src":"using System.Globalization;\nusing System.Text;\n// SqliteException sigue disponible: Microsoft.EntityFrameworkCore.Sqlite incluye Microsoft.Data.Sqlite.\nusing Microsoft.Data.Sqlite;\n// NUEVO: para capturar DbUpdateException.\nusing Microsoft.EntityFrameworkCore;\nusing AgroStock.E03.Data;\nusing AgroStock.E03.Models;\n// NUEVO: ReporteService.\nusing AgroStock.E03.Services;\n\nnamespace AgroStock.E03.Forms;\n\npublic partial class FrmPrincipal : Form\n{\n    private readonly ProductoRepository repo = new();\n\n    private readonly BindingSource fuente = new();\n\n    public FrmPrincipal()\n    {\n        InitializeComponent();\n        ConfigurarCuadricula();\n        SuscribirEventos();\n        ActualizarReloj();\n    }\n\n    private void ConfigurarCuadricula()\n    {\n        dgvProductos.AutoGenerateColumns = false;\n        dgvProductos.DataSource = fuente;\n\n        dgvProductos.Columns.Add(NuevaColumna(\"Código\", nameof(Producto.Codigo), 110));\n        dgvProductos.Columns.Add(NuevaColumna(\"Nombre\", nameof(Producto.Nombre), 220));\n        // CAMBIO: la columna se enlaza a CategoriaNombre (antes a Categoria, que era un texto).\n        dgvProductos.Columns.Add(NuevaColumna(\"Categoría\", nameof(Producto.CategoriaNombre), 120));\n        dgvProductos.Columns.Add(NuevaColumna(\"Precio (C$)\", nameof(Producto.Precio), 100));\n        dgvProductos.Columns.Add(NuevaColumna(\"Existencia\", nameof(Producto.Existencia), 90));\n        dgvProductos.Columns.Add(NuevaColumna(\"Vencimiento\", nameof(Producto.Vencimiento), 110));\n        dgvProductos.Columns[3].DefaultCellStyle.Format = \"N2\";\n        dgvProductos.Columns[5].DefaultCellStyle.Format = \"dd/MM/yyyy\";\n        dgvProductos.Columns[1].AutoSizeMode = DataGridViewAutoSizeColumnMode.Fill;\n    }\n\n    private static DataGridViewTextBoxColumn NuevaColumna(string titulo, string propiedad, int ancho) => new()\n    {\n        Name = \"col\" + propiedad,\n        HeaderText = titulo,\n        DataPropertyName = propiedad,\n        Width = ancho\n    };\n\n    private void SuscribirEventos()\n    {\n        Load += (_, _) => Cargar();\n\n        mnuNuevo.Click += (_, _) => Nuevo();\n        tsbNuevo.Click += (_, _) => Nuevo();\n        mnuEditarProducto.Click += (_, _) => Editar();\n        tsbEditar.Click += (_, _) => Editar();\n        mnuEliminar.Click += (_, _) => Eliminar();\n        tsbEliminar.Click += (_, _) => Eliminar();\n\n        mnuMovimiento.Click += (_, _) => RegistrarMovimiento();\n        tsbMovimiento.Click += (_, _) => RegistrarMovimiento();\n        mnuImportar.Click += (_, _) => Importar();\n        // NUEVO en v3: historial de movimientos y reportes.\n        mnuVerMovimientos.Click += (_, _) => VerMovimientos();\n\n        mnuExportar.Click += (_, _) => ExportarCsv();\n        mnuReportePdf.Click += (_, _) => GenerarReporte(pdf: true);\n        mnuReporteExcel.Click += (_, _) => GenerarReporte(pdf: false);\n        mnuAcercaDe.Click += (_, _) => MostrarAcercaDe();\n        tmrReloj.Tick += (_, _) => ActualizarReloj();\n\n        mnuSalir.Click += (_, _) => Close();\n        dgvProductos.CellDoubleClick += (_, e) => { if (e.RowIndex >= 0) Editar(); };\n\n        txtBuscar.TextChanged += (_, _) => Cargar();\n        FormClosing += FrmPrincipal_FormClosing;\n    }\n\n    private void Cargar()\n    {\n        try\n        {\n            fuente.DataSource = repo.Listar(txtBuscar.Text.Trim());\n            tslTotal.Text = $\"Productos: {fuente.Count}\";\n        }\n        // Al leer pueden fallar el proveedor (SqliteException, p. ej. «no such column») o el ORM (InvalidOperationException).\n        catch (Exception ex) when (ex is SqliteException or InvalidOperationException)\n        {\n            MessageBox.Show(this, \"No se pudo leer la base de datos:\\n\" + ex.Message, \"AgroStock\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n\n    private void Nuevo()\n    {\n        var p = new Producto();\n        using var dlg = new FrmProducto(p, repo.Categorias());\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n        Ejecutar(() => repo.Insertar(p), p.Codigo);\n    }\n\n    private void Editar()\n    {\n        if (fuente.Current is not Producto p)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        using var dlg = new FrmProducto(p, repo.Categorias());\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n        Ejecutar(() => repo.Actualizar(p), p.Codigo);\n    }\n\n    private void Eliminar()\n    {\n        if (fuente.Current is not Producto p)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        var r = MessageBox.Show(this, $\"¿Eliminar «{p.Nombre}»?\", \"Confirmar eliminación\",\n            MessageBoxButtons.YesNo, MessageBoxIcon.Question, MessageBoxDefaultButton.Button2);\n        if (r == DialogResult.Yes) Ejecutar(() => repo.Eliminar(p.Id), p.Codigo);\n    }\n\n    // Igual que en v2, pero el error de SQLite llega ENVUELTO: EF lanza DbUpdateException y la SqliteException va en InnerException.\n    private void Ejecutar(Action operacion, string codigo)\n    {\n        try\n        {\n            operacion();\n        }\n        // 2067 = UNIQUE: ya existe otro producto con ese código.\n        catch (DbUpdateException ex) when (ex.InnerException is SqliteException { SqliteExtendedErrorCode: 2067 })\n        {\n            MessageBox.Show(this, $\"El código {codigo} ya existe.\", \"No se guardó\",\n                MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        }\n        // Error 19 con el texto «FOREIGN KEY»: el producto tiene movimientos (relación Restrict).\n        catch (DbUpdateException ex) when (ex.InnerException is SqliteException { SqliteErrorCode: 19 } fk && fk.Message.Contains(\"FOREIGN KEY\"))\n        {\n            MessageBox.Show(this, \"No se puede eliminar: el producto tiene movimientos registrados.\", \"No se eliminó\",\n                MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        }\n        catch (DbUpdateException ex)\n        {\n            MessageBox.Show(this, \"Error de base de datos:\\n\" + (ex.InnerException?.Message ?? ex.Message), \"AgroStock\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n        finally\n        {\n            Cargar();\n        }\n    }\n\n    private void RegistrarMovimiento()\n    {\n        if (fuente.Current is not Producto p)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        using var dlg = new FrmMovimiento(repo, p);\n        if (dlg.ShowDialog(this) == DialogResult.OK) Cargar();\n    }\n\n    // NUEVO: abre el historial de movimientos.\n    private void VerMovimientos()\n    {\n        using var dlg = new FrmMovimientos(repo);\n        dlg.ShowDialog(this);\n    }\n\n    private void Importar()\n    {\n        using var dlg = new FrmImportar(repo);\n        dlg.ShowDialog(this);\n        Cargar();\n    }\n\n    private void ExportarCsv()\n    {\n        using var dlg = new SaveFileDialog\n        {\n            Title = \"Exportar inventario\",\n            Filter = \"Archivo CSV (*.csv)|*.csv\",\n            FileName = \"inventario.csv\"\n        };\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n\n        var sb = new StringBuilder();\n        sb.AppendLine(\"Codigo;Nombre;Categoria;Precio;Existencia;Vencimiento\");\n        foreach (var p in repo.Listar())\n        {\n            sb.AppendLine(string.Join(';', new[]\n            {\n                Csv(p.Codigo), Csv(p.Nombre), Csv(p.CategoriaNombre),\n                p.Precio.ToString(\"F2\", CultureInfo.InvariantCulture),\n                p.Existencia.ToString(),\n                p.Vencimiento?.ToString(\"yyyy-MM-dd\") ?? \"\"\n            }));\n        }\n\n        try\n        {\n            File.WriteAllText(dlg.FileName, sb.ToString(), new UTF8Encoding(true));\n            MessageBox.Show(this, \"Inventario exportado correctamente.\", \"Exportar\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n        catch (IOException ex)\n        {\n            MessageBox.Show(this, \"No se pudo guardar el archivo:\\n\" + ex.Message, \"Exportar\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n\n    // NUEVO: un mismo método para los dos reportes; el parámetro pdf decide cuál. El usuario elige dónde guardar.\n    private void GenerarReporte(bool pdf)\n    {\n        using var dlg = new SaveFileDialog\n        {\n            Title = pdf ? \"Reporte de inventario (PDF)\" : \"Reporte de inventario (Excel)\",\n            Filter = pdf ? \"Documento PDF (*.pdf)|*.pdf\" : \"Libro de Excel (*.xlsx)|*.xlsx\",\n            FileName = pdf ? \"inventario.pdf\" : \"inventario.xlsx\"\n        };\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n\n        try\n        {\n            // Se leen todos los productos (sin filtro) y se entregan al servicio de reportes.\n            var productos = repo.Listar();\n            var reportes = new ReporteService();\n            if (pdf) reportes.GenerarPdf(dlg.FileName, productos);\n            else reportes.GenerarExcel(dlg.FileName, productos);\n\n            MessageBox.Show(this, \"Reporte generado correctamente.\", \"Reportes\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n        catch (IOException ex)\n        {\n            MessageBox.Show(this, \"No se pudo guardar el archivo (¿está abierto?):\\n\" + ex.Message, \"Reportes\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n\n    private static string Csv(string texto) => \"\\\"\" + texto.Replace(\"\\\"\", \"\\\"\\\"\") + \"\\\"\";\n\n    private void MostrarAcercaDe()\n    {\n        MessageBox.Show(this, \"AgroStock v3\\nEncuentro 3: ORM, reportes y servicios web\\nUNAN-Managua, CUR Matagalpa\",\n            \"Acerca de AgroStock\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n\n    private void ActualizarReloj()\n    {\n        tslReloj.Text = DateTime.Now.ToString(\"dd/MM/yyyy HH:mm:ss\");\n    }\n\n    private void AvisarSeleccion()\n    {\n        MessageBox.Show(this, \"Seleccione primero un producto de la lista.\", \"AgroStock\",\n            MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n\n    private void FrmPrincipal_FormClosing(object? sender, FormClosingEventArgs e)\n    {\n        if (e.CloseReason != CloseReason.UserClosing) return;\n        var r = MessageBox.Show(this, \"¿Desea salir de AgroStock?\", \"Salir\",\n            MessageBoxButtons.YesNo, MessageBoxIcon.Question);\n        if (r == DialogResult.No) e.Cancel = true;\n    }\n}\n"},"Forms/FrmPrincipal.Designer.cs":{"lang":"cs","src":"#nullable enable\nnamespace AgroStock.E03.Forms;\n\npartial class FrmPrincipal\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && (components != null))\n        {\n            components.Dispose();\n        }\n        base.Dispose(disposing);\n    }\n\n    private void InitializeComponent()\n    {\n        components = new System.ComponentModel.Container();\n        menuPrincipal = new MenuStrip();\n        mnuArchivo = new ToolStripMenuItem();\n        mnuNuevo = new ToolStripMenuItem();\n        mnuExportar = new ToolStripMenuItem();\n        sepArchivo = new ToolStripSeparator();\n        // NUEVOS en v3: mnuReportePdf y mnuReporteExcel (menú Archivo) y mnuVerMovimientos (menú Editar).\n        mnuReportePdf = new ToolStripMenuItem();\n        mnuReporteExcel = new ToolStripMenuItem();\n        mnuSalir = new ToolStripMenuItem();\n        mnuEditar = new ToolStripMenuItem();\n        mnuEditarProducto = new ToolStripMenuItem();\n        mnuEliminar = new ToolStripMenuItem();\n        mnuMovimiento = new ToolStripMenuItem();\n        mnuImportar = new ToolStripMenuItem();\n        mnuVerMovimientos = new ToolStripMenuItem();\n        mnuAyuda = new ToolStripMenuItem();\n        mnuAcercaDe = new ToolStripMenuItem();\n        barraHerramientas = new ToolStrip();\n        tsbNuevo = new ToolStripButton();\n        tsbEditar = new ToolStripButton();\n        tsbEliminar = new ToolStripButton();\n        tsbMovimiento = new ToolStripButton();\n        sepBarra = new ToolStripSeparator();\n        lblBuscar = new ToolStripLabel();\n        txtBuscar = new ToolStripTextBox();\n        barraEstado = new StatusStrip();\n        tslTotal = new ToolStripStatusLabel();\n        tslReloj = new ToolStripStatusLabel();\n        dgvProductos = new DataGridView();\n        tmrReloj = new System.Windows.Forms.Timer(components);\n        menuPrincipal.SuspendLayout();\n        barraHerramientas.SuspendLayout();\n        barraEstado.SuspendLayout();\n        ((System.ComponentModel.ISupportInitialize)dgvProductos).BeginInit();\n        SuspendLayout();\n\n        menuPrincipal.Items.AddRange(new ToolStripItem[] { mnuArchivo, mnuEditar, mnuAyuda });\n        menuPrincipal.Location = new Point(0, 0);\n        menuPrincipal.Name = \"menuPrincipal\";\n        menuPrincipal.TabIndex = 0;\n\n        // Orden del menú Archivo: Nuevo, Importar, Exportar, reportes, separador, Salir.\n        mnuArchivo.DropDownItems.AddRange(new ToolStripItem[] { mnuNuevo, mnuImportar, mnuExportar, mnuReportePdf, mnuReporteExcel, sepArchivo, mnuSalir });\n        mnuArchivo.Name = \"mnuArchivo\";\n        mnuArchivo.Text = \"&Archivo\";\n\n        mnuNuevo.ShortcutKeys = Keys.Control | Keys.N;\n        mnuNuevo.Name = \"mnuNuevo\";\n        mnuNuevo.Text = \"&Nuevo producto\";\n\n        // Exportar recibe un atajo propio (Ctrl+Mayús+E) porque Ctrl+E ya es de Editar.\n        mnuExportar.ShortcutKeys = Keys.Control | Keys.Shift | Keys.E;\n        mnuExportar.Name = \"mnuExportar\";\n        mnuExportar.Text = \"&Exportar a CSV...\";\n\n        mnuReportePdf.Name = \"mnuReportePdf\";\n        mnuReportePdf.Text = \"Reporte en &PDF...\";\n\n        mnuReporteExcel.Name = \"mnuReporteExcel\";\n        mnuReporteExcel.Text = \"Reporte en E&xcel...\";\n\n        sepArchivo.Name = \"sepArchivo\";\n\n        mnuSalir.Name = \"mnuSalir\";\n        mnuSalir.ShortcutKeyDisplayString = \"Alt+F4\";\n        mnuSalir.Text = \"&Salir\";\n\n        mnuEditar.DropDownItems.AddRange(new ToolStripItem[] { mnuEditarProducto, mnuEliminar, mnuMovimiento, mnuVerMovimientos });\n        mnuEditar.Name = \"mnuEditar\";\n        mnuEditar.Text = \"&Editar\";\n\n        mnuEditarProducto.ShortcutKeys = Keys.Control | Keys.E;\n        mnuEditarProducto.Name = \"mnuEditarProducto\";\n        mnuEditarProducto.Text = \"&Editar producto\";\n\n        // Eliminar pasa de Ctrl+Supr a Ctrl+D.\n        mnuEliminar.ShortcutKeys = Keys.Control | Keys.D;\n        mnuEliminar.Name = \"mnuEliminar\";\n        mnuEliminar.Text = \"E&liminar producto\";\n\n        mnuMovimiento.ShortcutKeys = Keys.Control | Keys.M;\n        mnuMovimiento.Name = \"mnuMovimiento\";\n        mnuMovimiento.Text = \"Registrar &movimiento...\";\n\n        // Ctrl+H abre el historial.\n        mnuVerMovimientos.ShortcutKeys = Keys.Control | Keys.H;\n        mnuVerMovimientos.Name = \"mnuVerMovimientos\";\n        mnuVerMovimientos.Text = \"&Ver historial de movimientos\";\n\n        mnuImportar.ShortcutKeys = Keys.Control | Keys.I;\n        mnuImportar.Name = \"mnuImportar\";\n        mnuImportar.Text = \"&Importar desde CSV...\";\n\n        mnuAyuda.DropDownItems.AddRange(new ToolStripItem[] { mnuAcercaDe });\n        mnuAyuda.Name = \"mnuAyuda\";\n        mnuAyuda.Text = \"A&yuda\";\n        mnuAcercaDe.Name = \"mnuAcercaDe\";\n        mnuAcercaDe.Text = \"&Acerca de AgroStock\";\n\n        barraHerramientas.Items.AddRange(new ToolStripItem[] { tsbNuevo, tsbEditar, tsbEliminar, tsbMovimiento, sepBarra, lblBuscar, txtBuscar });\n        barraHerramientas.Location = new Point(0, 24);\n        barraHerramientas.Name = \"barraHerramientas\";\n        barraHerramientas.TabIndex = 1;\n\n        tsbNuevo.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbNuevo.Name = \"tsbNuevo\";\n        tsbNuevo.Text = \"Nuevo\";\n        tsbNuevo.ToolTipText = \"Nuevo producto (Ctrl+N)\";\n\n        tsbEditar.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbEditar.Name = \"tsbEditar\";\n        tsbEditar.Text = \"Editar\";\n        tsbEditar.ToolTipText = \"Editar producto (Ctrl+E)\";\n\n        tsbEliminar.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbEliminar.Name = \"tsbEliminar\";\n        tsbEliminar.Text = \"Eliminar\";\n        tsbEliminar.ToolTipText = \"Eliminar producto (Ctrl+D)\";\n\n        tsbMovimiento.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbMovimiento.Name = \"tsbMovimiento\";\n        tsbMovimiento.Text = \"Movimiento\";\n        tsbMovimiento.ToolTipText = \"Registrar entrada o salida (Ctrl+M)\";\n\n        sepBarra.Name = \"sepBarra\";\n\n        lblBuscar.Name = \"lblBuscar\";\n        lblBuscar.Text = \"Buscar:\";\n\n        txtBuscar.Name = \"txtBuscar\";\n        txtBuscar.Size = new Size(180, 25);\n        txtBuscar.ToolTipText = \"Escriba parte del código o del nombre\";\n\n        barraEstado.Items.AddRange(new ToolStripItem[] { tslTotal, tslReloj });\n        barraEstado.Dock = DockStyle.Bottom;\n        barraEstado.Name = \"barraEstado\";\n        barraEstado.TabIndex = 2;\n\n        tslTotal.Name = \"tslTotal\";\n        tslTotal.Spring = true;\n        tslTotal.TextAlign = ContentAlignment.MiddleLeft;\n        tslTotal.Text = \"Productos: 0\";\n\n        tslReloj.Name = \"tslReloj\";\n        tslReloj.Text = \"00/00/0000 00:00:00\";\n\n        dgvProductos.AllowUserToAddRows = false;\n        dgvProductos.AllowUserToDeleteRows = false;\n        dgvProductos.ReadOnly = true;\n        dgvProductos.SelectionMode = DataGridViewSelectionMode.FullRowSelect;\n        dgvProductos.MultiSelect = false;\n        dgvProductos.RowHeadersVisible = false;\n        dgvProductos.BackgroundColor = SystemColors.Window;\n        dgvProductos.Dock = DockStyle.Fill;\n        dgvProductos.Name = \"dgvProductos\";\n        dgvProductos.TabIndex = 3;\n\n        tmrReloj.Interval = 1000;\n        tmrReloj.Enabled = true;\n\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        // La ventana crece de 860 a 900 píxeles de ancho.\n        ClientSize = new Size(900, 520);\n        Controls.Add(dgvProductos);\n        Controls.Add(barraEstado);\n        Controls.Add(barraHerramientas);\n        Controls.Add(menuPrincipal);\n        MainMenuStrip = menuPrincipal;\n        MinimumSize = new Size(640, 360);\n        Name = \"FrmPrincipal\";\n        StartPosition = FormStartPosition.CenterScreen;\n        // El título cambia a v3.\n        Text = \"AgroStock v3 - Inventario del agroservicio\";\n        menuPrincipal.ResumeLayout(false);\n        menuPrincipal.PerformLayout();\n        barraHerramientas.ResumeLayout(false);\n        barraHerramientas.PerformLayout();\n        barraEstado.ResumeLayout(false);\n        barraEstado.PerformLayout();\n        ((System.ComponentModel.ISupportInitialize)dgvProductos).EndInit();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n\n    private MenuStrip menuPrincipal = null!;\n    private ToolStripMenuItem mnuArchivo = null!;\n    private ToolStripMenuItem mnuNuevo = null!;\n    private ToolStripMenuItem mnuExportar = null!;\n    private ToolStripMenuItem mnuReportePdf = null!;\n    private ToolStripMenuItem mnuReporteExcel = null!;\n    private ToolStripSeparator sepArchivo = null!;\n    private ToolStripMenuItem mnuSalir = null!;\n    private ToolStripMenuItem mnuEditar = null!;\n    private ToolStripMenuItem mnuEditarProducto = null!;\n    private ToolStripMenuItem mnuEliminar = null!;\n    private ToolStripMenuItem mnuMovimiento = null!;\n    private ToolStripMenuItem mnuImportar = null!;\n    private ToolStripMenuItem mnuVerMovimientos = null!;\n    private ToolStripMenuItem mnuAyuda = null!;\n    private ToolStripMenuItem mnuAcercaDe = null!;\n    private ToolStrip barraHerramientas = null!;\n    private ToolStripButton tsbNuevo = null!;\n    private ToolStripButton tsbEditar = null!;\n    private ToolStripButton tsbEliminar = null!;\n    private ToolStripButton tsbMovimiento = null!;\n    private ToolStripSeparator sepBarra = null!;\n    private ToolStripLabel lblBuscar = null!;\n    private ToolStripTextBox txtBuscar = null!;\n    private StatusStrip barraEstado = null!;\n    private ToolStripStatusLabel tslTotal = null!;\n    private ToolStripStatusLabel tslReloj = null!;\n    private DataGridView dgvProductos = null!;\n    private System.Windows.Forms.Timer tmrReloj = null!;\n}\n"},"Forms/FrmMovimiento.cs":{"lang":"cs","src":"// NUEVO: para capturar DbUpdateException.\nusing Microsoft.EntityFrameworkCore;\nusing AgroStock.E03.Data;\nusing AgroStock.E03.Models;\n\nnamespace AgroStock.E03.Forms;\n\npublic partial class FrmMovimiento : Form\n{\n    private readonly ProductoRepository repo;\n    private readonly Producto producto;\n\n    public FrmMovimiento(ProductoRepository repo, Producto producto)\n    {\n        InitializeComponent();\n        this.repo = repo;\n        this.producto = producto;\n\n        Load += (_, _) =>\n        {\n            lblProducto.Text = $\"{producto.Codigo} · {producto.Nombre} (existencia actual: {producto.Existencia})\";\n            rdoEntrada.Checked = true;\n        };\n        btnRegistrar.Click += BtnRegistrar_Click;\n    }\n\n    private void BtnRegistrar_Click(object? sender, EventArgs e)\n    {\n        errores.Clear();\n        if (nudCantidad.Value < 1)\n        {\n            errores.SetError(nudCantidad, \"La cantidad debe ser al menos 1.\");\n            return;\n        }\n\n        var tipo = rdoEntrada.Checked ? \"ENTRADA\" : \"SALIDA\";\n        try\n        {\n            repo.RegistrarMovimiento(producto.Id, tipo, (int)nudCantidad.Value);\n            DialogResult = DialogResult.OK;\n        }\n        // CAMBIO: la existencia insuficiente ahora es una InvalidOperationException lanzada por el repositorio (antes: error 275 de SQLite).\n        catch (InvalidOperationException ex)\n        {\n            MessageBox.Show(this, ex.Message, \"Movimiento\",\n                MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        }\n        // Cualquier otra falla de la base (incluido el CHECK ck_existencia si alguien se saltara la validación).\n        catch (DbUpdateException ex)\n        {\n            MessageBox.Show(this, \"Error de base de datos:\\n\" + (ex.InnerException?.Message ?? ex.Message), \"Movimiento\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n}\n"},"Forms/FrmMovimientos.cs":{"lang":"cs","src":"using AgroStock.E03.Data;\nusing AgroStock.E03.Models;\n\nnamespace AgroStock.E03.Forms;\n\n// NUEVO: ventana de solo lectura con el historial de entradas y salidas.\npublic partial class FrmMovimientos : Form\n{\n    private readonly ProductoRepository repo;\n\n    public FrmMovimientos(ProductoRepository repo)\n    {\n        InitializeComponent();\n        this.repo = repo;\n\n        dgvMovimientos.AutoGenerateColumns = false;\n        dgvMovimientos.Columns.Add(NuevaColumna(\"Fecha\", nameof(Movimiento.Fecha), 100, \"dd/MM/yyyy\"));\n        // ProductoNombre es la propiedad calculada «código · nombre» (por eso el repositorio usa Include).\n        dgvMovimientos.Columns.Add(NuevaColumna(\"Producto\", nameof(Movimiento.ProductoNombre), 320, null));\n        dgvMovimientos.Columns.Add(NuevaColumna(\"Tipo\", nameof(Movimiento.Tipo), 90, null));\n        dgvMovimientos.Columns.Add(NuevaColumna(\"Cantidad\", nameof(Movimiento.Cantidad), 90, null));\n        dgvMovimientos.Columns[1].AutoSizeMode = DataGridViewAutoSizeColumnMode.Fill;\n\n        btnCerrar.Click += (_, _) => Close();\n        Load += (_, _) =>\n        {\n            var lista = repo.Movimientos();\n            dgvMovimientos.DataSource = lista;\n            lblTotal.Text = $\"Movimientos: {lista.Count}\";\n        };\n    }\n\n    private static DataGridViewTextBoxColumn NuevaColumna(string titulo, string propiedad, int ancho, string? formato) => new()\n    {\n        Name = \"col\" + propiedad,\n        HeaderText = titulo,\n        DataPropertyName = propiedad,\n        Width = ancho,\n        // formato = null en las columnas que no necesitan formato especial.\n        DefaultCellStyle = { Format = formato }\n    };\n}\n"},"Forms/FrmMovimientos.Designer.cs":{"lang":"cs","src":"#nullable enable\nnamespace AgroSt function hlCs(line) {
  let out = '', i = 0, m;
  const re = /(\/\/.*$)|(\$?@?"(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)')|(\b\d+(?:\.\d+)?[mMfF]?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  while ((m = re.exec(line))) {
    out += esc(line.slice(i, m.index)); i = re.lastIndex;
    if (m[1]) out += `<span class="tc">${esc(m[1])}</span>`;
    else if (m[2] || m[3]) out += `<span class="ts">${esc(m[0])}</span>`;
    else if (m[4]) out += `<span class="tn">${esc(m[0])}</span>`;
    else { const w = m[5]; out += KW.has(w) ? `<span class="tk">${w}</span>` : TYPES.has(w) ? `<span class="tt">${w}</span>` : w; }

  return out + esc(line.slice(i));
}
function hlXml(line) {

/* ===== visor de código ===== */
const viewers = [];
let globalMode = store.get('mode', 'comentado');
function makeViewer(names) {
  let cur = names[0];
  const tabs = h('div', { class: 'v-tabs', role: 'tablist' });
  const info = h('div', { class: 'v-info' });
  const pre = h('pre');
  const body = h('div', { class: 'v-body', tabindex: '0' }, pre);
  const bC = h('button', { 'aria-pressed': 'true', onclick: () => setMode('comentado') }, 'Comentado');
  const bL = h('button', { 'aria-pressed': 'false', onclick: () => setMode('limpio') }, 'Limpio');
  const copy = h('button', { class: 'v-copy', onclick: doCopy }, 'Copiar');
  const root = h('div', { class: 'viewer' },
    h('div', { class: 'v-bar' }, tabs, h('div', { class: 'v-actions' }, h('div', { class: 'seg', role: 'group', 'aria-label': 'Versión del código' }, bC, bL), copy)),
    info, body);
  function renderTabs() {
    tabs.replaceChildren(...names.map(n => h('button', { role: 'tab', 'aria-selected': String(n === cur), onclick: () => { cur = n; render(); } }, n)));
  }
  function render() {
    renderTabs();
    bC.setAttribute('aria-pressed', String(globalMode === 'comentado'));
    bL.setAttribute('aria-pressed', String(globalMode === 'limpio'));
    const f = FILES[cur], text = textOf(cur, globalMode).replace(/\n$/, ''), lines = text.split('\n');
    pre.innerHTML = lines.map((l, i) => `<div class="ln" data-n="${i + 1}"><span class="no">${i + 1}</span><span class="tx">${hl(l, f.lang) || '&#8203;'}</span></div>`).join('');
    const nc = f.src.split('\n').filter(l => isCom(l, f.lang)).length;
    info.textContent = f.lang === 'json' ? `${lines.length} líneas. JSON no admite comentarios.`
      : globalMode === 'comentado'
        ? `${lines.length} líneas, ${nc} de ellas son comentarios que explican el código. Los comentarios no se ejecutan.`
        : `${lines.length} líneas de código sin comentarios, listas para pegar en Visual Studio.`;
  }
  function setMode(m) { globalMode = m; store.set('mode', m); viewers.forEach(v => v.render()); }
  function doCopy() {
    const text = textOf(cur, globalMode);
    const done = ok => { copy.textContent = ok ? 'Copiado' : 'Seleccione y copie (Ctrl+C)'; setTimeout(() => copy.textContent = 'Copiar', 1800); };
    const fallback = () => { try { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(false); } catch (e) { done(false); } };
    try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (e) { fallback(); }
  }
  const api = {
    root, render,
    reveal(file, snippet) {
      if (!FILES[file]) return;
      if (!names.includes(file)) names.push(file);
      cur = file; globalMode = 'comentado'; viewers.forEach(v => v.render());
      const n = lineOf(file, snippet), el = $(`.ln[data-n="${n}"]`, pre);
      if (!el) return;
      $$('.ln.flash', pre).forEach(x => x.classList.remove('flash'));
      el.classList.add('flash');
      body.scrollTop = Math.max(0, el.offsetTop - body.clientHeight / 3);
      root.scrollIntoView({ block: 'nearest', behavior: RM() ? 'auto' : 'smooth' });
      setTimeout(() => el.classList.remove('flash'), 4000);
    }
  };
  viewers.push(api); render();
  return api;
}

    clear() { box.replaceChildren(empty()); first = true; },

        n && viewer ? h('button', { onclick: () => viewer.reveal(f, snippet), title: 'Ver esta línea en el código' }, `${f.split('/').pop()} · línea ${n}`) : null));

/* ===== modelo en memoria que imita el comportamiento del ORM + SQLite (solo para los simuladores) ===== */
const ORM = (() => {

  const SEED = {
    cats: [[1, 'Fertilizantes'], [2, 'Semillas'], [3, 'Herbicidas'], [4, 'Herramientas']],
    prods: [
      [1, 'FER-001', 'Fórmula 18-46-0 (quintal)', 1, 1250, 24, null], [2, 'FER-002', 'Urea 46% (quintal)', 1, 1100, 18, null],
      [3, 'FER-003', 'Fórmula 12-30-10 (quintal)', 1, 1180, 6, null], [4, 'SEM-001', 'Semilla de frijol rojo (libra)', 2, 32.5, 150, '2027-03-31'],
      [5, 'SEM-002', 'Semilla de maíz (libra)', 2, 28, 200, '2026-11-30'], [6, 'SEM-003', 'Semilla de sorgo (libra)', 2, 22, 8, '2026-12-15'],
      [7, 'HER-001', 'Glifosato (litro)', 3, 180, 8, '2027-08-15'], [8, 'HER-002', 'Paraquat (litro)', 3, 210, 15, '2027-05-20'],
      [9, 'HER-003', '2,4-D amina (litro)', 3, 165, 30, '2026-12-01'], [10, 'HER-004', 'Atrazina (kilo)', 3, 140, 12, '2027-02-10'],
      [11, 'HER-005', 'Metsulfurón (sobre)', 3, 95, 4, '2027-06-30'], [12, 'HTA-001', 'Machete de 22 pulgadas', 4, 250, 0, null],
      [13, 'HTA-002', 'Bomba de mochila (20 L)', 4, 1450, 5, null], [14, 'HTA-003', 'Piocha con cabo', 4, 320, 0, null]],
    movs: [[1, 1, 'ENTRADA', 30, '2026-10-01'], [2, 1, 'SALIDA', 6, '2026-10-05'], [3, 4, 'ENTRADA', 200, '2026-10-02'],
      [4, 5, 'SALIDA', 20, '2026-10-06'], [5, 7, 'SALIDA', 2, '2026-10-07'], [6, 10, 'ENTRADA', 15, '2026-10-03']]
  };
  class Ctx {
    constructor() { this.reset(); }
    reset() {
      this.cats = SEED.cats.map(([id, nombre]) => ({ id, nombre }));
      this.prods = SEED.prods.map(([id, codigo, nombre, cat, precio, exi, ven]) => ({ id, codigo, nombre, cat, precio, exi, ven }));
      this.movs = SEED.movs.map(([id, prod, tipo, cant, fecha]) => ({ id, prod, tipo, cant, fecha }));
      this.nextP = 15; this.nextM = 7;
    }
    snap() { return JSON.stringify([this.cats, this.prods, this.movs, this.nextP, this.nextM]); }
    restore(s) { [this.cats, this.prods, this.movs, this.nextP, this.nextM] = JSON.parse(s); }

    check(p, selfId) {
      if (this.prods.some(x => x.id !== selfId && x.codigo === p.codigo)) throw new DbUpdateException(lite(2067, 'UNIQUE constraint failed: productos.Codigo'));
      if (!(p.precio > 0)) throw new DbUpdateException(lite(275, 'CHECK constraint failed: ck_precio'));
      if (p.exi < 0) throw new DbUpdateException(lite(275, 'CHECK constraint failed: ck_existencia'));
      if (!this.cats.some(c => c.id === p.cat)) throw new DbUpdateException(lite(787, 'FOREIGN KEY constraint failed'));
    }
    listar(f) {
      const q = String(f || '').toLowerCase();
      return this.prods.filter(p => p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q))
        .sort((a, b) => a.nombre < b.nombre ? -1 : a.nombre > b.nombre ? 1 : 0);
    }
    insertar(p) { this.check(p, 0); const r = { ...p, id: this.nextP++ }; this.prods.push(r); return r; }
    actualizar(p) { const i = this.prods.findIndex(x => x.id === p.id); this.check(p, p.id); this.prods[i] = { ...p }; }
    eliminar(id) {
      if (this.movs.some(m => m.prod === id)) throw new DbUpdateException(lite(787, 'FOREIGN KEY constraint failed'));
      this.prods = this.prods.filter(p => p.id !== id);

    insertarVarios(list) {

      const p = this.prods.find(x => x.id === id);
      if (!p) throw new InvalidOp('Producto no encontrado.');
      if (validar && tipo === 'SALIDA' && p.exi < cant) throw new InvalidOp('Existencia insuficiente: no se registró nada.');
      const s = this.snap();
      p.exi += tipo === 'ENTRADA' ? cant : -cant;
      this.movs.push({ id: this.nextM++, prod: id, tipo, cant, fecha: fmtIso(new Date()) });
      try { if (p.exi < 0) throw new DbUpdateException(lite(275, 'CHECK constraint failed: ck_existencia')); }
      catch (e) { this.restore(s); throw e; }   // SaveChanges es atómico: se revierte todo
    }
    movimientos() {
      return this.movs.map(m => ({ ...m, prodTxt: (() => { const p = this.prods.find(x => x.id === m.prod); return p ? `${p.codigo} · ${p.nombre}` : ''; })() }))
        .sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : b.id - a.id);
    }
    valor() { return this.prods.reduce((a, p) => a + p.precio * p.exi, 0); }
  }
  return { Ctx, DbUpdateException, InvalidOp };
})();
