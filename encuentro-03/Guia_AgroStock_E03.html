    errors: [['Columna vacía', 'La columna Categoría de la cuadrícula sale vacía', 'Falta <code>.Include(p =&gt; p.Categoria)</code> en <code>Listar</code>: la propiedad de navegación queda en <code>null</code>.'], ['DbUpdateException', 'El mensaje no dice qué falló', 'El detalle real está en <code>ex.InnerException</code> (la <code>SqliteException</code>). Muéstrelo o evalúelo con <code>when</code>.']],
    check: ['No queda ninguna cadena SQL en el repositorio', 'Listar usa Include y Like', 'InsertarVarios devuelve los códigos repetidos', 'Entiendo qué hace SaveChanges con una sola transacción'] },

  { id: 'reportes', nav: 'Reportes', title: 'Reportes en PDF y en Excel', files: ['Services/ReporteService.cs'],
    goal: 'Crear una clase de servicio que genere el inventario como PDF (QuestPDF) y como libro de Excel (ClosedXML) con fórmulas reales.',
    how: ['Cree la carpeta <b>Services</b> en el proyecto (clic derecho → Agregar → Nueva carpeta).', 'Agregue la clase <b>Services/ReporteService.cs</b> y pegue el código del visor.',
      '<code>GenerarPdf</code> describe la página con una API fluida: encabezado, tabla (filas con existencia &lt; 10 en rojo claro) y pie con total y «Página X de Y».',
      '<code>GenerarExcel</code> escribe encabezados con estilo, una fila por producto con la fórmula <code>=D*E</code> y una fila final con <code>=SUM(...)</code>.',
      'Fíjese en el constructor estático: <code>QuestPDF.Settings.License = LicenseType.Community;</code> es obligatorio antes de generar.',
      'La clase no sabe nada de formularios: en el paso 8 el menú la llamará pasándole la lista y la ruta que elija el usuario.'],
    after: '<div class="tip"><b>Servicio, no repositorio.</b> <code>ReporteService</code> vive en <code>Services</code> porque no accede a la base: recibe los datos ya leídos. Separar así cada responsabilidad permite cambiar el reporte sin tocar la interfaz.</div>',
    sims: [{ k: 'rep', t: 'Vista previa del PDF y del libro de Excel', d: 'Agregue un producto con poca existencia, vea las fórmulas y pruebe el error de archivo abierto.' }],
    errors: [['Licencia QuestPDF', 'Excepción de licencia al generar el PDF', 'Falta <code>QuestPDF.Settings.License = LicenseType.Community;</code>.'], ['IOException', 'El proceso no puede obtener acceso al archivo', 'El .xlsx o el .pdf está abierto en otro programa. Ciérrelo y reintente; el formulario ya captura la excepción.'], ['CS0246', 'No se encontró XLWorkbook / Document', 'Falta ClosedXML o QuestPDF, o el <code>using</code> correspondiente.']],
    check: ['ReporteService compila sin errores', 'Entiendo cómo se resaltan las existencias bajas en el PDF', 'Las celdas de «Valor» del Excel son fórmulas', 'Declaré la licencia Community de QuestPDF'] },

  { id: 'mockaroo', nav: 'Servicio web', title: 'Servicio web Mockaroo e importación', files: ['Services/MockarooClient.cs', 'Forms/FrmImportar.cs', 'Forms/FrmImportar.Designer.cs'],
    goal: 'Consumir un servicio web REST que entrega productos de prueba en JSON y guardarlos con el ORM, junto con la importación desde CSV.',
    how: ['Con la cuenta de Mockaroo del proyecto (o una gratuita en <b>mockaroo.com</b>), verifique que exista el schema; si no, créelo. En <b>Schemas → New Schema</b> nombre el schema exactamente <code>agrostock_productos</code> y cree estos campos (nombres en minúscula): <code>codigo</code> (por ejemplo, expresión regular <code>[A-Z]{3}-[0-9]{4}</code>), <code>nombre</code> (lista personalizada), <code>categoria</code> (lista: Fertilizantes, Semillas, Herbicidas, Herramientas), <code>precio</code> (número con 2 decimales), <code>existencia</code> (número entero) y <code>vencimiento</code> (fecha <code>yyyy-MM-dd</code>, con parte en blanco).',
      'Compruebe que <code>appsettings.json</code> tenga la <b>clave de API</b> del proyecto (<code>d4fada10</code>). Esa clave pertenece a la cuenta de Mockaroo donde existe el schema; si usa otra cuenta, reemplácela por la suya.',
      'Agregue <b>Services/MockarooClient.cs</b>. Lee la configuración, hace un <code>GET</code> con la clave en el encabezado <code>X-API-Key</code>, convierte el JSON en objetos y valida cada fila.',
      'Reemplace <b>Forms/FrmImportar.cs</b> y <b>FrmImportar.Designer.cs</b> por los del visor. Se agregan <code>lblCantidad</code>, <code>nudCantidad</code> y <code>btnMockaroo</code>; se quitan <code>chkBloqueante</code> y <code>btnCancelar</code> (ya no hay hilos).',
      'Observe <code>Ejecutar(Func&lt;…&gt;)</code>: recibe la función que lee los datos (CSV o Mockaroo) y se encarga de guardar con <code>InsertarVarios</code> y de informar.',
      'Reemplace <b>productos_importar.csv</b> si lo desea; el de E02 también sirve (mismo formato). Compile: ahora el proyecto debe compilar completo.'],
    after: '<div class="note"><b>Cuide la clave.</b> <code>appsettings.json</code> contiene la clave de API. Si sube el proyecto a un repositorio público, quítela o cámbiela antes.</div><div class="tip" style="margin-top:12px"><b>Sin hilos, a propósito.</b> La llamada <code>Http.Send</code> es síncrona: durante ese instante la ventana no responde (el cursor cambia a espera). En E02 resolvió ese problema con <code>Task.Run</code> e <code>IProgress</code>; combinar ambas ideas es un reto opcional del paso 9.</div><h3 class="block-h" style="margin-top:18px">Controles nuevos de FrmImportar</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Tipo</th><th>Propiedades</th></tr></thead><tbody><tr><td><code>btnIniciar</code></td><td>Button</td><td class="wrap">Text <code>&amp;Importar CSV</code>, (20,58), 140×30</td></tr><tr><td><code>lblCantidad</code></td><td>Label</td><td class="wrap">Text <code>Productos de prueba (Mockaroo):</code>, (20,108)</td></tr><tr><td><code>nudCantidad</code></td><td>NumericUpDown</td><td class="wrap">(225,104), 70×23, Minimum 1, Maximum 1000, Value 20</td></tr><tr><td><code>btnMockaroo</code></td><td>Button</td><td class="wrap">Text <code>Obtener de &amp;Mockaroo</code>, (305,100), 140×30</td></tr><tr><td><code>btnCerrar</code></td><td>Button</td><td class="wrap">Text <code>Cerrar</code>, (455,100), 90×30</td></tr></tbody></table></div><p class="sim-desc" style="margin:8px 0 0">El resto (<code>lblArchivo, txtArchivo, btnExaminar, barra, lblEstado</code>) no cambia. ClientSize 565×240, FixedDialog.</p>',
    sims: [{ k: 'mock', t: 'Llamada al servicio web y guardado', d: 'Simule la importación desde CSV y desde Mockaroo, y provoque cada tipo de fallo de la llamada.' }],
    errors: [['PENDIENTE', 'Falta la clave de API de Mockaroo en appsettings.json', 'Escriba la clave del proyecto en <code>appsettings.json</code>, guarde y vuelva a ejecutar (se copia a bin al compilar).'], ['401 / 404', 'Mockaroo respondió 401 o 404', '401: clave incorrecta. 404: el schema no existe o su nombre difiere del de <code>Schema</code> en appsettings.json.'], ['0 productos', 'Todas las filas salen inválidas', 'Los nombres de los campos del schema no coinciden con los de <code>[JsonPropertyName]</code>.'], ['appsettings', 'No se encontró appsettings.json', 'Falta marcarlo como «Copiar si es posterior» o está fuera de la carpeta del proyecto.']],
    check: ['Creé el schema agrostock_productos con los seis campos', 'appsettings.json tiene la clave de API del proyecto', 'El botón Mockaroo agrega productos y informa inválidos y repetidos', 'Importar el mismo CSV dos veces informa los repetidos sin fallar', 'No subí la clave a un repositorio público'] },

  { id: 'movs', nav: 'Movimientos', title: 'Movimientos de inventario e historial', files: ['Forms/FrmMovimiento.cs', 'Forms/FrmMovimientos.cs', 'Forms/FrmMovimientos.Designer.cs'],
    goal: 'Adaptar el formulario de entradas y salidas a los errores del ORM y crear la ventana nueva que muestra el historial de movimientos.',
    how: ['<b>A. Adaptar FrmMovimiento (ya existe).</b> Reemplace el contenido de <b>Forms/FrmMovimiento.cs</b> por el del visor. Solo cambian tres cosas: el <code>using Microsoft.EntityFrameworkCore;</code> y los dos <code>catch</code> del final. Su <code>.Designer.cs</code> <b>no cambia</b>.',
      '<b>B. Crear FrmMovimientos (formulario nuevo) desde el diseñador.</b> Siga la guía «Crear FrmMovimientos desde el diseñador, paso a paso» que está debajo del visor de código: son 10 acciones cortas (formulario, propiedades, tres controles y el código).',
      '<b>Atajo opcional.</b> Si no quiere usar el diseñador, cree el formulario (acción 1 de la guía) y pegue el código del visor en <b>FrmMovimientos.cs</b> y en <b>FrmMovimientos.Designer.cs</b>, reemplazando todo.',
      '<b>C. Entienda lo nuevo.</b> La cuadrícula se llena en el evento <code>Load</code> con <code>repo.Movimientos()</code>; la columna Producto usa la propiedad calculada <code>ProductoNombre</code>; el repositorio ya ordena del más reciente al más antiguo.',
      '<b>D. Compile</b> (' + K('Ctrl') + '+' + K('Mayús') + '+' + K('B') + '). Ahora el proyecto debe compilar completo. Todavía no puede abrir el historial: el menú se agrega en el paso siguiente. Pruebe la lógica en el simulador.'],
    after: '<h3 class="block-h" style="margin-top:6px">Crear FrmMovimientos desde el diseñador, paso a paso</h3><p class="sim-desc" style="margin:0 0 10px">Trabaje en la vista <b>Diseño</b>. Los nombres deben ser exactos: el código usa <code>dgvMovimientos</code>, <code>lblTotal</code> y <code>btnCerrar</code>. Las propiedades se cambian en la ventana <b>Propiedades</b> (<kbd>F4</kbd>); use el botón «Por categorías» u «Orden alfabético» como prefiera.</p><ol class="how"><li><b>Agregar el formulario.</b> En el Explorador de soluciones, clic derecho en la carpeta <b>Forms</b> → <b>Agregar</b> → <b>Formulario (Windows Forms)…</b>. En «Nombre» escriba <code>FrmMovimientos.cs</code> y pulse <b>Agregar</b>. Se abre un formulario vacío en la vista Diseño.</li><li><b>Propiedades del formulario.</b> Haga clic en una zona vacía del formulario (no sobre un control) y cambie: <code>Text</code> → <code>Historial de movimientos</code>; <code>StartPosition</code> → <code>CenterParent</code>; <code>MinimumSize</code> → <code>500; 300</code>. Después arrastre la esquina inferior derecha hasta que el tamaño sea cercano a <b>700 × 446</b> (Visual Studio lo muestra en la barra inferior mientras arrastra).</li><li><b>Abrir el Cuadro de herramientas.</b> Menú <b>Ver</b> → <b>Cuadro de herramientas</b> (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>X</kbd>). Si no encuentra un control, escriba su nombre en el cuadro de búsqueda del panel.</li><li><b>DataGridView.</b> En la categoría <b>Datos</b>, arrastre un <code>DataGridView</code> al formulario. Haga clic en la flecha ▸ de su esquina superior derecha (etiqueta inteligente) y <b>desmarque</b> «Habilitar agregado», «Habilitar edición» y «Habilitar eliminación»; deje sin marcar «Acoplar en contenedor principal». Luego, en Propiedades: <code>(Name)</code> → <code>dgvMovimientos</code>; <code>Location</code> → <code>12; 12</code>; <code>Size</code> → <code>676; 380</code>; <code>SelectionMode</code> → <code>FullRowSelect</code>; <code>MultiSelect</code> → <code>False</code>; <code>RowHeadersVisible</code> → <code>False</code>; <code>BackgroundColor</code> → pestaña <i>Sistema</i> → <code>Window</code>; <code>Anchor</code> → abra la lista y active las <b>cuatro</b> barras (arriba, abajo, izquierda y derecha). <b>No cree columnas aquí</b>: el código las crea.</li><li><b>Label.</b> En «Controles comunes» arrastre un <code>Label</code> debajo de la cuadrícula. <code>(Name)</code> → <code>lblTotal</code>; <code>Text</code> → <code>Movimientos: 0</code>; <code>Location</code> → <code>12; 410</code>; <code>Anchor</code> → deje activas solo <b>abajo</b> e <b>izquierda</b> (desactive «arriba»).</li><li><b>Button.</b> Arrastre un <code>Button</code> a la esquina inferior derecha. <code>(Name)</code> → <code>btnCerrar</code>; <code>Text</code> → <code>Cerrar</code>; <code>Size</code> → <code>90; 30</code>; <code>Location</code> → <code>598; 404</code>; <code>Anchor</code> → solo <b>abajo</b> y <b>derecha</b>. No asigne <code>DialogResult</code>: el código cierra la ventana con <code>Close()</code>.</li><li><b>Orden de tabulación (opcional).</b> <code>dgvMovimientos</code> con <code>TabIndex</code> 0 y <code>btnCerrar</code> con 1, para que <kbd>Tab</kbd> recorra primero la cuadrícula.</li><li><b>No haga doble clic en los controles.</b> Eso genera manejadores vacíos (por ejemplo <code>btnCerrar_Click</code>) que se sumarían a los que el código ya conecta con <code>btnCerrar.Click += …</code>. Si lo hizo por error, borre esos métodos y la línea correspondiente del <code>.Designer.cs</code>.</li><li><b>Escribir el código.</b> Clic derecho en el diseñador → <b>Ver código</b> (<kbd>F7</kbd>). Reemplace <b>todo</b> el contenido de <code>FrmMovimientos.cs</code> por el del visor (versión Limpio o Comentado). Guarde con <kbd>Ctrl</kbd>+<kbd>S</kbd>.</li><li><b>Compruebe.</b> Abra <code>FrmMovimientos.Designer.cs</code> y compárelo con el del visor: el orden de las líneas puede variar, pero <code>Name</code>, <code>Location</code>, <code>Size</code>, <code>Anchor</code> y <code>Text</code> deben coincidir. Compile (<kbd>Ctrl</kbd>+<kbd>Mayús</kbd>+<kbd>B</kbd>).</li></ol><p class="sim-desc" style="margin:10px 0 6px"><b>Así debe verse en la vista Diseño</b> (las columnas aparecen en tiempo de ejecución, porque las crea el código):</p><div class="win" style="max-width:480px"><div class="win-t"><span class="ic"></span><span class="tt2">Historial de movimientos</span></div><div style="padding:8px"><div class="w-grid" style="border:1px solid #aaa"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th class="r">Cantidad</th></tr></thead><tbody><tr><td>07/10/2026</td><td>HER-001 · Glifosato (litro)</td><td>SALIDA</td><td class="r">2</td></tr><tr><td>06/10/2026</td><td>SEM-002 · Semilla de maíz (libra)</td><td>SALIDA</td><td class="r">20</td></tr></tbody></table></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px"><span>Movimientos: 6</span><button class="w-btn" type="button">Cerrar</button></div></div></div><p class="sim-desc" style="margin:6px 0 18px"><code>dgvMovimientos</code> arriba, <code>lblTotal</code> abajo a la izquierda y <code>btnCerrar</code> abajo a la derecha.</p><h3 class="block-h" style="margin-top:6px">Controles de FrmMovimientos (resumen)</h3><p class="sim-desc" style="margin:0 0 8px">ClientSize 700×446, StartPosition <code>CenterParent</code>, MinimumSize 500×300, Text <code>Historial de movimientos</code>.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Tipo</th><th>Propiedades</th></tr></thead><tbody><tr><td><code>dgvMovimientos</code></td><td>DataGridView</td><td class="wrap">(12,12), 676×380; ReadOnly, sin agregar ni borrar filas, FullRowSelect, RowHeadersVisible false; <b>Anchor</b> en los cuatro lados</td></tr><tr><td><code>lblTotal</code></td><td>Label</td><td class="wrap">Text <code>Movimientos: 0</code>, (12,410); Anchor Bottom, Left</td></tr><tr><td><code>btnCerrar</code></td><td>Button</td><td class="wrap">Text <code>Cerrar</code>, (598,404), 90×30; Anchor Bottom, Right</td></tr></tbody></table></div><div class="note" style="margin-top:12px"><b>Normal:</b> el diseñador de Visual Studio puede mostrar <i>No se pudo crear una instancia de FrmMovimientos</i> porque su constructor recibe parámetros. El formulario funciona al ejecutar (<kbd>F5</kbd>).</div>',
    sims: [{ k: 'mov', t: 'Movimientos, transacción e historial', d: 'Registre entradas y salidas, quite la validación en C# y mire el historial resultante.' }],
    errors: [['Insuficiente', 'Una salida mayor que la existencia no avisa', 'Falta el <code>catch (InvalidOperationException ex)</code> en <code>FrmMovimiento</code>: el repositorio lanza esa excepción cuando la existencia no alcanza.'], ['Historial vacío', 'La columna Producto del historial sale en blanco', 'Falta <code>.Include(m =&gt; m.Producto)</code> en <code>repo.Movimientos()</code>.'], ['CS0103', 'El nombre dgvMovimientos no existe', 'El <code>.Designer.cs</code> no se pegó o su nombre de clase no es <code>FrmMovimientos</code>.']],
    check: ['FrmMovimiento captura InvalidOperationException y DbUpdateException', 'Creé FrmMovimientos desde el diseñador con los nombres exactos (dgvMovimientos, lblTotal, btnCerrar)', 'El proyecto compila completo', 'Entiendo que SaveChanges guarda el movimiento y la existencia juntos'] },

  { id: 'principal', nav: 'Ventana principal', title: 'Ventana principal: menús, errores del ORM y reportes', files: ['Forms/FrmPrincipal.Designer.cs', 'Forms/FrmPrincipal.cs'],
    goal: 'Conectar todo en la ventana principal: nombre de la categoría en la cuadrícula, avisos para los errores del ORM, historial de movimientos y reportes PDF y Excel en el menú.',
    how: ['<b>A. Diseñador.</b> Reemplace <b>Forms/FrmPrincipal.Designer.cs</b> por el del visor. Agrega tres opciones de menú: <code>mnuReportePdf</code>, <code>mnuReporteExcel</code> (Archivo) y <code>mnuVerMovimientos</code> (Editar); cambia algunos atajos (tabla de abajo) y el título pasa a «AgroStock v3».',
      '<b>B. Código.</b> Reemplace <b>Forms/FrmPrincipal.cs</b> por el del visor. Son cinco cambios; búsquelos con los comentarios del visor:<br>&nbsp;&nbsp;1) <code>using</code> nuevos (<code>Microsoft.EntityFrameworkCore</code> y <code>Services</code>).<br>&nbsp;&nbsp;2) La columna Categoría se enlaza a <code>CategoriaNombre</code>.<br>&nbsp;&nbsp;3) <code>SuscribirEventos</code> conecta los tres menús nuevos.<br>&nbsp;&nbsp;4) <code>Ejecutar</code> captura <code>DbUpdateException</code> y evalúa su <code>InnerException</code> (2067 = código repetido; 19 + «FOREIGN KEY» = tiene movimientos).<br>&nbsp;&nbsp;5) Métodos nuevos: <code>VerMovimientos</code> (abre el historial) y <code>GenerarReporte</code> (SaveFileDialog + ReporteService).',
      '<b>C. Sin cambios.</b> <b>FrmProducto.cs</b>, <b>FrmProducto.Designer.cs</b> y <b>Program.cs</b> no se tocan (solo el namespace del paso 1).',
      '<b>D. Pruebe.</b> Ejecute con ' + K('F5') + ' y recorra: buscar, ' + K('Ctrl') + '+' + K('N') + ' nuevo, editar, eliminar, ' + K('Ctrl') + '+' + K('M') + ' movimiento, ' + K('Ctrl') + '+' + K('H') + ' historial, ' + K('Ctrl') + '+' + K('I') + ' importar, y Archivo → Reporte en PDF / en Excel.'],
    after: '<h3 class="block-h" style="margin-top:6px">Atajos y menús de v3</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Opción</th><th>Menú</th><th>Atajo</th></tr></thead><tbody><tr><td>Nuevo producto</td><td>Archivo</td><td><kbd>Ctrl</kbd>+<kbd>N</kbd></td></tr><tr><td>Importar desde CSV</td><td>Archivo</td><td><kbd>Ctrl</kbd>+<kbd>I</kbd></td></tr><tr><td>Exportar a CSV</td><td>Archivo</td><td><kbd>Ctrl</kbd>+<kbd>Mayús</kbd>+<kbd>E</kbd> <span class="chip nuevo">nuevo</span></td></tr><tr><td>Reporte en PDF / en Excel</td><td>Archivo</td><td>— <span class="chip nuevo">nuevos</span></td></tr><tr><td>Editar producto</td><td>Editar</td><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td></tr><tr><td>Eliminar producto</td><td>Editar</td><td><kbd>Ctrl</kbd>+<kbd>D</kbd> <span class="chip mod">cambió</span></td></tr><tr><td>Registrar movimiento</td><td>Editar</td><td><kbd>Ctrl</kbd>+<kbd>M</kbd></td></tr><tr><td>Ver historial de movimientos</td><td>Editar</td><td><kbd>Ctrl</kbd>+<kbd>H</kbd> <span class="chip nuevo">nuevo</span></td></tr></tbody></table></div>',
    sims: [{ k: 'crud', t: 'AgroStock v3: CRUD con el ORM', d: 'Cree, edite, busque, elimine y registre movimientos. El registro muestra qué excepción captura cada caso.' }],
    errors: [['2067', 'El programa se cierra al repetir un código', 'El <code>catch</code> debe ser de <code>DbUpdateException</code> y mirar <code>ex.InnerException</code>; la <code>SqliteException</code> no llega directa.'], ['FK', 'Se puede borrar un producto con movimientos', 'Revise <code>OnDelete(DeleteBehavior.Restrict)</code> en el contexto; si cambió el modelo, borre agrostock.db de bin.'], ['Atajo', 'Ctrl+D o Ctrl+H no responde', 'Falta <code>ShortcutKeys</code> en el Designer o está definido en otro menú.'], ['CS0246', 'FrmMovimientos o ReporteService no existen', 'Falta completar el paso 7 (FrmMovimientos) o el paso 5 (ReporteService).']],
    check: ['La cuadrícula muestra el nombre de la categoría', 'Un código repetido muestra un aviso y no cierra el programa', 'Ctrl+H abre el historial con el más reciente primero', 'Los reportes PDF y Excel se guardan donde elijo', 'Una salida mayor que la existencia muestra «Existencia insuficiente»'] },

  { id: 'probar', nav: 'Probar y entregar', title: 'Probar, resolver errores y entregar', goal: 'Verificar AgroStock v3 con una lista de pruebas, consultar los errores frecuentes y preparar la entrega.',
    how: ['Elimine <code>bin</code> y <code>obj</code>, abra la solución y ejecute con ' + K('F5') + ': la base debe crearse sola con los 14 productos.',
      'Recorra las pruebas con su pareja: buscar, crear, editar, eliminar, movimiento (entrada y salida mayor que la existencia), historial, ambos reportes, importar el CSV <b>dos veces</b> y obtener productos de Mockaroo.',
      'Si algo falla, busque el síntoma en la tabla de errores: el visor resalta la línea y explica la causa.',
      'Para entregar, comprima la carpeta <b>sin bin, obj ni .vs</b>. Verifique que la <code>ApiKey</code> de <code>appsettings.json</code> sea la correcta y que el README mencione si usó IA o ejemplos.'],
