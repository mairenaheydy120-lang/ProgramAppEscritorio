<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía AgroStock v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Misma identidad que la guía del Encuentro 2: cuaderno de campo en verde con tinta oscura;
   los simuladores conservan el aspecto gris claro de Windows para distinguir "el programa" de "la guía". */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',Consolas,'Cascadia Mono',ui-monospace,monospace;
  --bg:#F1F5EF; --surface:#FFFFFF; --surface2:#E7EEE4; --fg:#15241B; --muted:#51645A; --line:#CBD7C7;
  --accent:#1A6B45; --accent-fg:#FFFFFF; --accent-soft:#DAEBDC; --accent-line:#9CC8AA;
  --warn:#8A5200; --warn-soft:#F7E9CC; --bad:#B3261E; --bad-soft:#F9DEDB; --ok:#1A6B45;
  --code-bg:#13201A; --code-fg:#DCE8DF; --code-c:#7FB48E; --code-k:#E8AB5E; --code-s:#9DC8E8; --code-t:#8ED6B5; --code-n:#CDA9EA; --code-ln:#5C7468; --code-hl:#2A4A39;
  --code-bar:#1B2C23; --code-bar-fg:#B9CCBF;
  --w-face:#F0F0F0; --w-white:#FFFFFF; --w-border:#ADADAD; --w-text:#111111; --w-mute:#6B6B6B; --w-sel:#0078D7; --w-sel-fg:#FFFFFF; --w-title:#FFFFFF; --w-shadow:rgba(0,0,0,.35);
  --w-low:#FFB35C; --w-icon-warn:#B86E00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1612; --surface:#15211A; --surface2:#1C2A22; --fg:#E2ECE4; --muted:#9AB0A1; --line:#2B3C32;
    --accent:#5CC68E; --accent-fg:#0A1A11; --accent-soft:#1B3828; --accent-line:#2F6A4A;
    --warn:#E9B14F; --warn-soft:#3A2D12; --bad:#FF8F85; --bad-soft:#3F1D1A; --ok:#5CC68E;
    --code-bg:#0A110D; --code-bar:#121D17; --code-hl:#223B2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#15211A; --surface2:#1C2A22; --fg:#E2ECE4; --muted:#9AB0A1; --line:#2B3C32;
  --accent:#5CC68E; --accent-fg:#0A1A11; --accent-soft:#1B3828; --accent-line:#2F6A4A;
  --warn:#E9B14F; --warn-soft:#3A2D12; --bad:#FF8F85; --bad-soft:#3F1D1A; --ok:#5CC68E;
  --code-bg:#0A110D; --code-bar:#121D17; --code-hl:#223B2E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0 0 .8em;max-width:68ch}
code,.mono{font-family:var(--font-mono);font-size:.88em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.brand small{font-family:var(--font-body);font-weight:400;color:var(--muted);margin-left:.5em;font-size:.85rem}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-bar{width:96px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

main{max-width:1040px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:56px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(1.9rem,5vw,2.9rem);letter-spacing:-.02em;margin-bottom:.4em}
.hero .lead{font-size:1.12rem;color:var(--muted)}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:600;margin-bottom:.6em}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:1em 0 0;padding:0;list-style:none;font-size:.95rem}
.facts li{display:flex;gap:6px;align-items:baseline}
.facts b{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;min-width:0}
.map h2{font-size:1rem;margin-bottom:8px}
.tree{list-style:none;margin:0;padding:0;font-family:var(--font-mono);font-size:.84rem}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line);margin-left:6px}
.tree li{padding:1px 0}
.tree .dir{color:var(--muted);font-weight:600}
.tree button{background:none;border:0;padding:2px 6px;border-radius:5px;cursor:pointer;font:inherit;color:var(--fg);text-align:left}
.tree button:hover{background:var(--accent-soft)}
.map p{font-size:.85rem;color:var(--muted);margin:8px 0 0}

.step{scroll-margin-top:118px;display:flex;flex-direction:column;gap:18px;border-top:2px solid var(--fg);padding-top:20px}
.step-h{display:flex;flex-direction:column;gap:6px}
.step-h .num{font-family:var(--font-mono);font-size:.82rem;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.step-h h2{font-size:clamp(1.5rem,3.6vw,2.1rem);letter-spacing:-.015em}
.goal{font-size:1.05rem;color:var(--muted);margin:0}
.block-h{font-family:var(--font-display);font-size:1.08rem;margin:0 0 6px}
.how{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.how li::marker{color:var(--accent);font-weight:600}
.how b{font-weight:600}
kbd{font-family:var(--font-mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.note{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.95rem;max-width:78ch}
.note b{color:var(--warn)}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.95rem;max-width:78ch}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th{background:var(--surface2);text-align:left;padding:6px 10px;font-weight:600;white-space:nowrap}
.tbl td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:150px}
.chip{display:inline-block;border-radius:99px;padding:0 9px;font-size:.76rem;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.chip.nuevo{background:var(--accent-soft);color:var(--ok);border-color:var(--accent-line)}
.chip.mod{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.borra{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.igual{color:var(--muted)}

.viewer{border-radius:10px;overflow:hidden;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--code-bar);min-width:0}
.v-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--code-bar);padding:8px 10px;color:var(--code-bar-fg)}
.v-tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.v-tabs button{background:transparent;border:1px solid transparent;color:var(--code-bar-fg);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:var(--font-mono);font-size:.8rem}
.v-tabs button[aria-selected="true"]{background:var(--code-bg);color:var(--code-fg);border-color:#2f4a3b}
.v-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #2f4a3b;border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--code-bar-fg);padding:3px 10px;cursor:pointer;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.v-copy{background:transparent;border:1px solid #2f4a3b;color:var(--code-bar-fg);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:.82rem}
.v-copy:hover{background:#243a2e}
.v-info{padding:6px 12px;font-size:.78rem;color:var(--code-ln);background:var(--code-bg);border-bottom:1px solid var(--code-bar)}
.v-body{max-height:460px;overflow:auto;padding:8px 0}
.v-body pre{margin:0;font-family:var(--font-mono);font-size:.8rem;line-height:1.6;width:max-content;min-width:100%;tab-size:4}
.ln{display:flex;padding-right:16px}
.ln .no{flex:0 0 3.2em;text-align:right;padding-right:12px;color:var(--code-ln);user-select:none}
.ln.flash{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--code-k)}
.tc{color:var(--code-c);font-style:italic}.tk{color:var(--code-k)}.ts{color:var(--code-s)}.tt{color:var(--code-t)}.tn{color:var(--code-n)}

.sim{border:1px solid var(--accent-line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sim-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.sim-h h3{font-size:1.1rem}
.tagsim{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.sim-desc{margin:0;color:var(--muted);font-size:.95rem}
.sbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.93rem}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.sbtn.ghost{background:transparent;color:var(--accent)}
.sbtn.ghost[aria-pressed="true"]{background:var(--accent-soft)}
.sbtn.sm{padding:3px 10px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{display:grid;gap:14px;min-width:0}
.stage.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.panel h4{margin:0 0 6px;font-size:.95rem}
.logbox{font-family:var(--font-mono);font-size:.78rem;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.logbox .it{display:flex;flex-wrap:wrap;gap:2px 8px;padding:3px 6px;border-radius:5px;background:var(--surface)}
.logbox .it .ev{color:var(--accent);font-weight:600}
.logbox .it button{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit;padding:0}
.logbox .empty{color:var(--muted);font-family:var(--font-body);font-size:.88rem}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.78rem;border:1px solid var(--line);background:var(--surface)}
.pill.ok{background:var(--accent-soft);color:var(--ok);border-color:var(--accent-line)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.codebox{font-family:var(--font-mono);font-size:.8rem;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.6}

.win{background:var(--w-face);color:var(--w-text);border:1px solid #6d6d6d;box-shadow:0 8px 24px var(--w-shadow);position:relative;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.35;min-width:0;max-width:100%;overflow:hidden}
.win *{color-scheme:light}
.win-t{background:var(--w-title);color:#111;display:flex;align-items:center;height:30px;border-bottom:1px solid #d6d6d6;font-size:12px;padding-left:8px;gap:8px;user-select:none}
.win-t .ic{width:14px;height:14px;background:var(--accent);border-radius:3px;flex:0 0 auto}
.win-t .tt2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-t .wb{display:flex;height:100%}
.win-t .wb span,.win-t .wb button{width:40px;height:100%;border:0;background:transparent;display:grid;place-items:center;font-size:12px;color:#222;cursor:default}
.w-tool{display:flex;gap:2px;padding:2px 4px;align-items:center;background:var(--w-face);border-bottom:1px solid #d8d8d8;min-height:30px;flex-wrap:wrap}
.w-tool button{border:1px solid transparent;background:transparent;padding:2px 9px;font-size:13px;cursor:default;color:var(--w-text);border-radius:2px}
.w-tool button:hover{background:#E5F3FF;border-color:#CCE8FF}
.w-tool .sep{width:1px;height:20px;background:#bbb;margin:0 4px}
.w-tool label{font-size:13px;margin-left:4px}
.w-tool input{height:22px;width:130px;border:1px solid #7a7a7a;background:#fff;padding:0 4px;font-size:13px;color:var(--w-text);min-width:0}
.w-status{display:flex;justify-content:space-between;gap:10px;background:#007ACC;color:#fff;font-size:12px;padding:2px 10px;min-height:22px;align-items:center}
.w-body{padding:10px 12px}
.w-grid{background:#fff;overflow:auto;border-top:1px solid #aaa}
.w-grid table{border-collapse:collapse;font-size:13px;width:100%;color:var(--w-text)}
.w-grid th{background:#f0f0f0;font-weight:400;text-align:left;border:1px solid #dcdcdc;padding:3px 8px;white-space:nowrap;position:sticky;top:0}
.w-grid td{padding:3px 8px;border-bottom:1px solid #eee;border-right:1px solid #f0f0f0;white-space:nowrap}
.w-grid tr.sel td{background:var(--w-sel);color:var(--w-sel-fg)}
.w-grid tr.low:not(.sel) td{background:var(--w-low)}
.w-grid td.r,.w-grid th.r{text-align:right}
.w-btn{background:#E1E1E1;border:1px solid #ADADAD;padding:3px 14px;min-width:78px;font-size:13px;color:var(--w-text);cursor:default;border-radius:2px}
.w-btn:hover{background:#E5F1FB;border-color:#0078D7}
.w-btn.def{border:2px solid #0078D7;padding:2px 13px}
.w-btn:disabled{opacity:.5}
.w-in{height:23px;border:1px solid #7a7a7a;background:#fff;padding:0 4px;font-size:13px;width:100%;min-width:0;color:var(--w-text)}
.w-field{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 8px;align-items:center;margin-bottom:8px;font-size:13px}
.w-err{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#E81123;color:#fff!important;font-size:11px;font-weight:700;cursor:help;margin-left:6px;flex:0 0 auto}
.w-cell{display:flex;align-items:center;min-width:0}
.w-ov{position:absolute;inset:30px 0 0 0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:30;padding:8px}
.w-dlg{background:var(--w-face);border:1px solid #555;box-shadow:0 6px 22px rgba(0,0,0,.45);width:min(100%,430px);max-height:100%;overflow:auto;color:var(--w-text)}
.w-msg{display:flex;gap:14px;padding:18px 16px;background:#fff;font-size:13px;align-items:flex-start}
.w-msg .mi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;font-size:18px}
.w-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;background:var(--w-face)}
.w-radio{display:flex;gap:6px;align-items:center;font-size:13px}

.paper{background:#fff;color:#222;border:1px solid #bbb;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 16px;font-family:Arial,Helvetica,sans-serif;font-size:11px;overflow:auto;max-height:380px}
.paper h5{margin:0;font-size:16px}
.paper .gen{font-size:9px;margin-bottom:8px}
.paper table{border-collapse:collapse;width:100%}
.paper th{background:#2E7D32;color:#fff;text-align:left;padding:4px}
.paper td{padding:4px;border-bottom:.5px solid #bdbdbd}
.paper tr.lowr td{background:#FFCDD2}
.paper .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:10px}
.xl{background:#fff;color:#111;border:1px solid #9aa;font-family:Calibri,'Segoe UI',Arial,sans-serif;font-size:13px;overflow:auto;max-height:380px}
.xl .fbar{display:flex;gap:8px;padding:4px 8px;border-bottom:1px solid #ccc;background:#f3f3f3;font-size:12px;align-items:center}
.xl .fbar b{min-width:34px;text-align:center;border-right:1px solid #ccc}
.xl table{border-collapse:collapse;width:100%}
.xl th{background:#f0f0f0;border:1px solid #d4d4d4;font-weight:400;padding:2px 8px}
.xl td{border:1px solid #e1e1e1;padding:2px 8px;white-space:nowrap;cursor:cell}
.xl td.r{text-align:right}
.xl td.sel{outline:2px solid #217346;outline-offset:-2px}
.xl tr.hd td{background:#006100;color:#fff;font-weight:700}

details.err{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.err summary{padding:10px 14px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.err summary code{background:var(--bad-soft);color:var(--bad);padding:0 6px;border-radius:5px}
details.err .body{padding:0 14px 12px}
.errs{display:flex;flex-direction:column;gap:8px}
.check{border-top:1px solid var(--line);padding-top:12px}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.check input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent-line)}
.boa-sel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px}
.boa-in{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;width:100%;max-width:340px}
.se{background:#fff;border:1px solid var(--w-border);color:var(--w-text);padding:8px 6px;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:200px;overflow:auto}
.se ul{list-style:none;margin:0;padding-left:16px}
.se>ul{padding-left:2px}
.se li{padding:2px 4px}
.se .del{text-decoration:line-through;color:#999}
.se .bad{color:#B3261E}
footer{max-width:1040px;margin:0 auto;padding:0 16px 48px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.prog-bar i{transition:none}}
@media (max-width:980px){.stage.three{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .stage.two{grid-template-columns:minmax(0,1fr)}
  body{font-size:16px}
  .brand small{display:none}
}
@media (max-width:520px){.brand{white-space:nowrap}#progtxt{display:none}}
.sim-desc code,.tip code,.note code,.how code{overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="top-row"><div class="row"><a class="sbtn ghost sm" href="../hub-encuentro-03.html" style="text-decoration:none">← Volver al Encuentro 3</a><div class="brand">AgroStock v3<small>Guía del Encuentro 3</small></div></div>
    <div class="prog" role="status"><span id="progtxt">0 comprobaciones</span><span class="prog-bar" aria-hidden="true"><i id="progbar"></i></span></div></div>
  <nav class="nav" id="nav" aria-label="Pasos de la guía"></nav>
</div></header>
<main>
  <section class="hero" id="hero"></section>
  <section id="cambios" class="step" aria-labelledby="h-cambios"></section>
