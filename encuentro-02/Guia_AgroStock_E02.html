";\n        menuPrincipal.ResumeLayout(false);\n        menuPrincipal.PerformLayout();\n        barraHerramientas.ResumeLayout(false);\n        barraHerramientas.PerformLayout();\n        barraEstado.ResumeLayout(false);\n        barraEstado.PerformLayout();\n        ((System.ComponentModel.ISupportInitialize)dgvProductos).EndInit();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n}\n"}, "Forms/FrmMovimiento.cs": {"lang": "cs", "src": "using Microsoft.Data.Sqlite;\nusing AgroStock.E02.Data;\nusing AgroStock.E02.Models;\n\nnamespace AgroStock.E02.Forms;\n\n// Formulario modal para registrar una ENTRADA (llega mercadería) o una SALIDA (se vende) de un producto.\npublic partial class FrmMovimiento : Form\n{\n    private readonly ProductoRepository repo;\n    private readonly Producto producto;\n\n    public FrmMovimiento(ProductoRepository repo, Producto producto)\n    {\n        InitializeComponent();\n        this.repo = repo;\n        this.producto = producto;\n\n        Load += (_, _) =>\n        {\n            // Se muestra qué producto se va a mover y cuánto hay ahora, para que el usuario decida con datos.\n            lblProducto.Text = $\"{producto.Codigo} · {producto.Nombre} (existencia actual: {producto.Existencia})\";\n            rdoEntrada.Checked = true;\n        };\n        btnRegistrar.Click += BtnRegistrar_Click;\n    }\n\n    private void BtnRegistrar_Click(object? sender, EventArgs e)\n    {\n        errores.Clear();\n        // NumericUpDown.Minimum = 1 ya impide cero o negativos, pero se valida por si alguien cambia el diseño.\n        if (nudCantidad.Value < 1)\n        {\n            errores.SetError(nudCantidad, \"La cantidad debe ser al menos 1.\");\n            return;\n        }\n\n        // Los dos RadioButton están en el mismo contenedor: solo uno puede estar marcado.\n        var tipo = rdoEntrada.Checked ? \"ENTRADA\" : \"SALIDA\";\n        try\n        {\n            // El repositorio guarda el movimiento Y actualiza la existencia en una sola transacción.\n            repo.RegistrarMovimiento(producto.Id, tipo, (int)nudCantidad.Value);\n            DialogResult = DialogResult.OK;\n        }\n        // 275 = SQLITE_CONSTRAINT_CHECK: CHECK (existencia >= 0) falló, no alcanza la mercadería.\n        catch (SqliteException ex) when (ex.SqliteExtendedErrorCode == 275)\n        {\n            // La transacción se revirtió: no quedó ningún movimiento a medias.\n            MessageBox.Show(this, \"Existencia insuficiente: no se registró nada.\", \"Movimiento\",\n                MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        }\n        catch (SqliteException ex)\n        {\n            MessageBox.Show(this, \"Error de base de datos:\\n\" + ex.Message, \"Movimiento\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n}\n"}, "Forms/FrmMovimiento.Designer.cs": {"lang": "cs", "src": "#nullable enable\n// Archivo generado por el diseñador de Visual Studio: no lo modifique a mano.\nnamespace AgroStock.E02.Forms;\n\npartial class FrmMovimiento\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    private ErrorProvider errores = null!;\n    private Label lblProducto = null!;\n    private GroupBox grpTipo = null!;\n    private RadioButton rdoEntrada = null!;\n    private RadioButton rdoSalida = null!;\n    private Label lblCantidad = null!;\n    private NumericUpDown nudCantidad = null!;\n    private Button btnRegistrar = null!;\n    private Button btnCancelar = null!;\n\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && components != null) components.Dispose();\n        base.Dispose(disposing);\n    }\n\n    private void InitializeComponent()\n    {\n        components = new System.ComponentModel.Container();\n        errores = new ErrorProvider(components);\n        lblProducto = new Label();\n        grpTipo = new GroupBox();\n        rdoEntrada = new RadioButton();\n        rdoSalida = new RadioButton();\n        lblCantidad = new Label();\n        nudCantidad = new NumericUpDown();\n        btnRegistrar = new Button();\n        btnCancelar = new Button();\n        ((System.ComponentModel.ISupportInitialize)errores).BeginInit();\n        ((System.ComponentModel.ISupportInitialize)nudCantidad).BeginInit();\n        grpTipo.SuspendLayout();\n        SuspendLayout();\n\n        errores.ContainerControl = this;\n\n        // lblProducto: el código lo escribe el Load del formulario\n        lblProducto.AutoSize = false;\n        lblProducto.Location = new Point(20, 20);\n        lblProducto.Name = \"lblProducto\";\n        lblProducto.Size = new Size(380, 36);\n\n        // Los dos RadioButton están DENTRO del mismo GroupBox: por eso solo uno puede estar marcado.\n        grpTipo.Controls.Add(rdoEntrada);\n        grpTipo.Controls.Add(rdoSalida);\n        grpTipo.Location = new Point(20, 65);\n        grpTipo.Name = \"grpTipo\";\n        grpTipo.Size = new Size(380, 55);\n        grpTipo.TabStop = false;\n        grpTipo.Text = \"Tipo de movimiento\";\n        rdoEntrada.AutoSize = true;\n        rdoEntrada.Location = new Point(15, 22);\n        rdoEntrada.Name = \"rdoEntrada\";\n        rdoEntrada.Text = \"&Entrada (llega mercadería)\";\n        rdoSalida.AutoSize = true;\n        rdoSalida.Location = new Point(215, 22);\n        rdoSalida.Name = \"rdoSalida\";\n        rdoSalida.Text = \"&Salida (venta)\";\n\n        lblCantidad.AutoSize = true;\n        lblCantidad.Location = new Point(20, 143);\n        lblCantidad.Name = \"lblCantidad\";\n        lblCantidad.Text = \"&Cantidad:\";\n        // Minimum = 1: la interfaz ya impide cero o negativos (la base lo exige con CHECK cantidad > 0)\n        nudCantidad.Location = new Point(140, 140);\n        nudCantidad.Maximum = 100000M;\n        nudCantidad.Minimum = 1M;\n        nudCantidad.Name = \"nudCantidad\";\n        nudCantidad.Size = new Size(120, 23);\n        nudCantidad.Value = 1M;\n\n        btnRegistrar.Location = new Point(210, 190);\n        btnRegistrar.Name = \"btnRegistrar\";\n        btnRegistrar.Size = new Size(90, 30);\n        btnRegistrar.Text = \"&Registrar\";\n        btnCancelar.DialogResult = DialogResult.Cancel;\n        btnCancelar.Location = new Point(310, 190);\n        btnCancelar.Name = \"btnCancelar\";\n        btnCancelar.Size = new Size(90, 30);\n        btnCancelar.Text = \"Cancelar\";\n\n        AcceptButton = btnRegistrar;\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        CancelButton = btnCancelar;\n        ClientSize = new Size(420, 240);\n        Controls.Add(lblProducto);\n        Controls.Add(grpTipo);\n        Controls.Add(lblCantidad);\n        Controls.Add(nudCantidad);\n        Controls.Add(btnRegistrar);\n        Controls.Add(btnCancelar);\n        FormBorderStyle = FormBorderStyle.FixedDialog;\n        MaximizeBox = false;\n        MinimizeBox = false;\n        Name = \"FrmMovimiento\";\n        ShowInTaskbar = false;\n        StartPosition = FormStartPosition.CenterParent;\n        Text = \"Registrar movimiento\";\n        ((System.ComponentModel.ISupportInitialize)errores).EndInit();\n        ((System.ComponentModel.ISupportInitialize)nudCantidad).EndInit();\n        grpTipo.ResumeLayout(false);\n        grpTipo.PerformLayout();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n}\n"}, "Forms/FrmImportar.cs": {"lang": "cs", "src": "using System.Globalization;\nusing Microsoft.Data.Sqlite;\nusing AgroStock.E02.Data;\nusing AgroStock.E02.Models;\n\nnamespace AgroStock.E02.Forms;\n\n// Importa productos desde un CSV SIN congelar la ventana: el trabajo pesado corre en otro hilo.\npublic partial class FrmImportar : Form\n{\n    private readonly ProductoRepository repo;\n\n    // CancellationTokenSource: el \"interruptor\" que la interfaz pulsa para pedir que la tarea se detenga.\n    private CancellationTokenSource? cts;\n\n    // Recurso compartido entre hilos: lo escribe el hilo de trabajo y lo lee el hilo de la interfaz.\n    private int insertados;\n    private readonly object candado = new();\n    private readonly List<string> rechazadas = new();\n\n    public FrmImportar(ProductoRepository repo)\n    {\n        InitializeComponent();\n        this.repo = repo;\n        btnExaminar.Click += BtnExaminar_Click;\n        btnIniciar.Click += BtnIniciar_Click;\n        // Cancelar NO detiene el hilo a la fuerza: solo avisa. La tarea decide cuándo parar.\n        btnCancelar.Click += (_, _) => cts?.Cancel();\n        btnCerrar.Click += (_, _) => Close();\n        // Valor inicial: el CSV que viaja junto al .exe (ver csproj).\n        txtArchivo.Text = Path.Combine(AppContext.BaseDirectory, \"productos_importar.csv\");\n        Alternar(enCurso: false);\n    }\n\n    private void BtnExaminar_Click(object? sender, EventArgs e)\n    {\n        using var dlg = new OpenFileDialog { Filter = \"Archivo CSV (*.csv)|*.csv\", Title = \"Elegir productos a importar\" };\n        if (dlg.ShowDialog(this) == DialogResult.OK) txtArchivo.Text = dlg.FileName;\n    }\n\n    // async void SOLO se usa en manejadores de eventos. Las líneas después de \"await\" vuelven al hilo de la interfaz.\n    private async void BtnIniciar_Click(object? sender, EventArgs e)\n    {\n        var ruta = txtArchivo.Text;\n        if (!File.Exists(ruta))\n        {\n            MessageBox.Show(this, \"No se encontró el archivo CSV.\", \"Importar\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            return;\n        }\n\n        // El token se copia a una variable local: la lambda de Task.Run no debe depender del campo, que cambia a null al terminar.\n        cts = new CancellationTokenSource();\n        var token = cts.Token;\n        Alternar(enCurso: true);\n        barra.Value = 0;\n        insertados = 0;\n        rechazadas.Clear();\n\n        // Progress<int> se crea AQUÍ, en el hilo de la interfaz: recuerda ese contexto y ejecuta el\n        // método de abajo en ese mismo hilo aunque Report() se llame desde otro. Por eso puede tocar controles.\n        var progreso = new Progress<int>(pct =>\n        {\n            barra.Value = pct;\n            lblEstado.Text = $\"Importando… {pct} %\";\n        });\n\n        try\n        {\n            if (chkBloqueante.Checked)\n            {\n                // SOLO PARA COMPARAR: el trabajo corre en el hilo de la interfaz y la ventana queda «No responde».\n                Importar(ruta, null, CancellationToken.None);\n            }\n            else\n            {\n                // Task.Run mueve el trabajo al ThreadPool; await espera SIN bloquear la interfaz.\n                await Task.Run(() => Importar(ruta, progreso, token));\n            }\n            lblEstado.Text = $\"Importación terminada: {insertados} productos, {rechazadas.Count} líneas rechazadas.\";\n        }\n        // La cancelación llega como excepción: no es un error, es la forma normal de salir de la tarea.\n        catch (OperationCanceledException)\n        {\n            barra.Value = 0;\n            lblEstado.Text = \"Cancelada: no se guardó ningún producto.\";\n        }\n        // Código repetido al importar dos veces el mismo archivo: UNIQUE falla y TODA la transacción se revierte.\n        catch (SqliteException ex)\n        {\n            barra.Value = 0;\n            lblEstado.Text = \"Se revirtió la importación: \" + ex.Message;\n        }\n        catch (IOException ex)\n        {\n            lblEstado.Text = \"No se pudo leer el archivo: \" + ex.Message;\n        }\n        finally\n        {\n            // finally se ejecuta siempre: se libera el interruptor y se devuelven los botones a su estado normal.\n            cts?.Dispose();\n            cts = null;\n            Alternar(enCurso: false);\n        }\n    }\n\n    // Corre en OTRO hilo (salvo en la versión bloqueante). Por eso NO toca ningún control: solo avisa con progreso.\n    private void Importar(string ruta, IProgress<int>? progreso, CancellationToken token)\n    {\n        var lineas = File.ReadAllLines(ruta).Skip(1).Where(l => l.Trim().Length > 0).ToArray();   // Skip(1): encabezado\n        var categorias = repo.Categorias().ToDictionary(c => c.Nombre, StringComparer.OrdinalIgnoreCase);\n\n        // UNA conexión y UNA transacción para todo el archivo: o entran los 500 productos o no entra ninguno.\n        using var cn = Db.Abrir();\n        using var tx = cn.BeginTransaction();\n\n        for (int i = 0; i < lineas.Length; i++)\n        {\n            // Detención controlada: la tarea revisa el token en cada vuelta, en un punto seguro.\n            if (token.IsCancellationRequested)\n            {\n                tx.Rollback();                          // se descarta todo lo insertado hasta ahora\n                token.ThrowIfCancellationRequested();   // sale de la tarea lanzando OperationCanceledException\n            }\n\n            var p = Parsear(lineas[i], categorias);\n            if (p is null)\n            {\n                // lock: solo un hilo a la vez modifica la lista (List<T> no es segura entre hilos).\n                lock (candado) { rechazadas.Add($\"Línea {i + 2}: {lineas[i]}\"); }\n                continue;\n            }\n\n            repo.Insertar(p, cn, tx);\n            // Interlocked: incremento atómico. insertados++ podría perder cuentas si dos hilos lo usaran a la vez.\n            Interlocked.Increment(ref insertados);\n\n            Thread.Sleep(10);   // solo para la demostración: simula un trabajo lento y permite probar Cancelar\n            // Report puede llamarse desde cualquier hilo; el avance se muestra en el hilo de la interfaz.\n            progreso?.Report((i + 1) * 100 / lineas.Length);\n        }\n\n        // Llegó al final sin cancelaciones ni errores: recién ahora los datos son definitivos.\n        tx.Commit();\n    }\n\n    // Convierte una línea «codigo;nombre;categoria;precio;existencia;vencimiento» en un Producto, o null si es inválida.\n    private static Producto? Parsear(string linea, Dictionary<string, Categoria> categorias)\n    {\n        var c = linea.Split(';');\n        if (c.Length < 5 || !categorias.TryGetValue(c[2].Trim(), out var categoria)) return null;\n        // InvariantCulture: el punto decimal se lee igual en cualquier idioma de Windows.\n        if (!decimal.TryParse(c[3], NumberStyles.Number, CultureInfo.InvariantCulture, out var precio) || precio <= 0) return null;\n        if (!int.TryParse(c[4], out var existencia) || existencia < 0) return null;\n\n        return new Producto\n        {\n            Codigo = c[0].Trim(),\n            Nombre = c[1].Trim(),\n            CategoriaId = categoria.Id,\n            Precio = precio,\n            Existencia = existencia,\n            Vencimiento = c.Length > 5 && DateTime.TryParse(c[5], CultureInfo.InvariantCulture, out var v) ? v : null\n        };\n    }\n\n    // Habilita o deshabilita botones según haya una importación en curso.\n    private void Alternar(bool enCurso)\n    {\n        btnIniciar.Enabled = !enCurso;\n        btnExaminar.Enabled = !enCurso;\n        btnCancelar.Enabled = enCurso;\n        btnCerrar.Enabled = !enCurso;\n    }\n}\n"}, "Forms/FrmImportar.Designer.cs": {"lang": "cs", "src": "#nullable enable\n// Archivo generado por el diseñador de Visual Studio: no lo modifique a mano.\nnamespace AgroStock.E02.Forms;\n\npartial class FrmImportar\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    private Label lblArchivo = null!;\n    private TextBox txtArchivo = null!;\n    private Button btnExaminar = null!;\n    private CheckBox chkBloqueante = null!;\n    private Button btnIniciar = null!;\n    private Button btnCancelar = null!;\n    private Button btnCerrar = null!;\n    private ProgressBar barra = null!;\n    private Label lblEstado = null!;\n\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && components != null) components.Dispose();\n        base.Dispose(disposing);\n    }\n\n    private void InitializeComponent()\n    {\n        lblArchivo = new Label();\n        txtArchivo = new TextBox();\n        btnExaminar = new Button();\n        chkBloqueante = new CheckBox();\n        btnIniciar = new Button();\n        btnCancelar = new Button();\n        btnCerrar = new Button();\n        barra = new ProgressBar();\n        lblEstado = new Label();\n        SuspendLayout();\n\n        lblArchivo.AutoSize = true;\n        lblArchivo.Location = new Point(20, 23);\n        lblArchivo.Name = \"lblArchivo\";\n        lblArchivo.Text = \"&Archivo CSV:\";\n        txtArchivo.Location = new Point(115, 20);\n        txtArchivo.Name = \"txtArchivo\";\n        txtArchivo.Size = new Size(330, 23);\n        txtArchivo.TabIndex = 1;\n        btnExaminar.Location = new Point(455, 18);\n        btnExaminar.Name = \"btnExaminar\";\n        btnExaminar.Size = new Size(90, 27);\n        btnExaminar.TabIndex = 2;\n        btnExaminar.Text = \"E&xaminar...\";\n\n        // chkBloqueante existe SOLO para comparar: con la casilla marcada la tarea corre en el hilo de la interfaz.\n        chkBloqueante.AutoSize = true;\n        chkBloqueante.Location = new Point(20, 62);\n        chkBloqueante.Name = \"chkBloqueante\";\n        chkBloqueante.TabIndex = 3;\n        chkBloqueante.Text = \"Ejecutar en el hilo de la interfaz (solo para comparar: la ventana se congela)\";\n\n        btnIniciar.Location = new Point(20, 100);\n        btnIniciar.Name = \"btnIniciar\";\n        btnIniciar.Size = new Size(90, 30);\n        btnIniciar.TabIndex = 4;\n        btnIniciar.Text = \"&Importar\";\n        // btnCancelar NO lleva DialogResult: el código solo pide detener la tarea (cts.Cancel()) y la ventana sigue abierta.\n        btnCancelar.Location = new Point(120, 100);\n        btnCancelar.Name = \"btnCancelar\";\n        btnCancelar.Size = new Size(90, 30);\n        btnCancelar.TabIndex = 5;\n        btnCancelar.Text = \"&Cancelar\";\n        btnCerrar.Location = new Point(455, 100);\n        btnCerrar.Name = \"btnCerrar\";\n        btnCerrar.Size = new Size(90, 30);\n        btnCerrar.TabIndex = 6;\n        btnCerrar.Text = \"Cerrar\";\n\n        barra.Location = new Point(20, 150);\n        barra.Name = \"barra\";\n        barra.Size = new Size(525, 23);\n        lblEstado.AutoSize = false;\n        lblEstado.Location = new Point(20, 183);\n        lblEstado.Name = \"lblEstado\";\n        lblEstado.Size = new Size(525, 40);\n        lblEstado.Text = \"Listo para importar.\";\n\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        ClientSize = new Size(565, 240);\n        Controls.AddRange(new Control[] { lblArchivo, txtArchivo, btnExaminar, chkBloqueante,\n            btnIniciar, btnCancelar, btnCerrar, barra, lblEstado });\n        FormBorderStyle = FormBorderStyle.FixedDialog;\n        MaximizeBox = false;\n        MinimizeBox = false;\n        Name = \"FrmImportar\";\n        ShowInTaskbar = false;\n        StartPosition = FormStartPosition.CenterParent;\n        Text = \"Importar productos\";\n        ResumeLayout(false);\n        PerformLayout();\n    }\n}\n"}, "agrostock.sql": {"lang": "sql", "src": "-- agrostock.sql · Base de datos de AgroStock v2 (SQLite). Ejecútelo en DB Browser for SQLite.\n-- Los datos son de prueba: no contienen información personal real.\n\n-- Activa las claves foráneas en esta conexión (DB Browser y la consola sqlite3 las traen desactivadas).\nPRAGMA foreign_keys = ON;\n\n-- Se borra en orden inverso a las dependencias, para poder volver a ejecutar el script.\nDROP TABLE IF EXISTS movimientos;\nDROP TABLE IF EXISTS productos;\nDROP TABLE IF EXISTS categorias;\n\n-- Una categoría tiene muchos productos.\nCREATE TABLE categorias (\n    id     INTEGER PRIMARY KEY AUTOINCREMENT,   -- clave primaria (PK): identifica cada fila\n    nombre TEXT NOT NULL UNIQUE                 -- obligatorio y sin repetirse\n);\n\n-- Un producto pertenece a una categoría.\nCREATE TABLE productos (\n    id           INTEGER PRIMARY KEY AUTOINCREMENT,\n    codigo       TEXT NOT NULL UNIQUE,                              -- no puede haber dos productos con el mismo código\n    nombre       TEXT NOT NULL,\n    categoria_id INTEGER NOT NULL REFERENCES categorias(id),        -- clave foránea (FK) hacia categorias\n    precio       REAL NOT NULL CHECK (precio > 0),                  -- CHECK: regla que debe cumplir cada fila\n    existencia   INTEGER NOT NULL DEFAULT 0 CHECK (existencia >= 0),\n    vencimiento  TEXT NULL                                          -- yyyy-MM-dd; NULL si el producto no vence\n);\n\n-- Un producto tiene muchos movimientos (entradas y salidas de bodega).\n-- fecha: date('now') da la fecha UTC; en Nicaragua (UTC-6) después de las 6 p. m. daría el día siguiente.\n-- Con 'localtime' se guarda la fecha local de la computadora.\nCREATE TABLE movimientos (\n    id          INTEGER PRIMARY KEY AUTOINCREMENT,\n    producto_id INTEGER NOT NULL REFERENCES productos(id),\n    tipo        TEXT NOT NULL CHECK (tipo IN ('ENTRADA', 'SALIDA')),\n    cantidad    INTEGER NOT NULL CHECK (cantidad > 0),\n    fecha       TEXT NOT NULL DEFAULT (date('now', 'localtime'))\n);\n\n-- ---------- Datos de ejemplo ----------\nINSERT INTO categorias (nombre) VALUES ('Fertilizantes'), ('Semillas'), ('Herbicidas'), ('Herramientas');\n\nINSERT INTO productos (codigo, nombre, categoria_id, precio, existencia, vencimiento) VALUES\n    ('FER-001', 'Fórmula 18-46-0 (quintal)',   1, 1250.00,  24, NULL),\n    ('FER-002', 'Urea 46% (quintal)',           1, 1100.00,  18, NULL),\n    ('FER-003', 'Fórmula 12-30-10 (quintal)',   1, 1180.00,   6, NULL),\n    ('SEM-001', 'Semilla de frijol rojo (libra)', 2,   32.50, 150, '2027-03-31'),\n    ('SEM-002', 'Semilla de maíz (libra)',      2,   28.00, 200, '2026-11-30'),\n    ('SEM-003', 'Semilla de sorgo (libra)',     2,   22.00,   8, '2026-12-15'),\n    ('HER-001', 'Glifosato (litro)',            3,  180.00,   8, '2027-08-15'),\n    ('HER-002', 'Paraquat (litro)',             3,  210.00,  15, '2027-05-20'),\n    ('HER-003', '2,4-D amina (litro)',          3,  165.00,  30, '2026-12-01'),\n    ('HER-004', 'Atrazina (kilo)',              3,  140.00,  12, '2027-02-10'),\n    ('HER-005', 'Metsulfurón (sobre)',          3,   95.00,   4, '2027-06-30'),\n    ('HTA-001', 'Machete de 22 pulgadas',       4,  250.00,   0, NULL),\n    ('HTA-002', 'Bomba de mochila (20 L)',      4, 1450.00,   5, NULL),\n    ('HTA-003', 'Piocha con cabo',              4,  320.00,   0, NULL);\n\nINSERT INTO movimientos (producto_id, tipo, cantidad, fecha) VALUES\n    (1, 'ENTRADA', 30, '2026-10-01'),\n    (1, 'SALIDA',   6, '2026-10-05'),\n    (4, 'ENTRADA', 200, '2026-10-02'),\n    (5, 'SALIDA',  20, '2026-10-06'),\n    (7, 'SALIDA',   2, '2026-10-07'),\n    (10, 'ENTRADA', 15, '2026-10-03');\n"}, "consultas.sql": {"lang": "sql", "src": "-- consultas.sql · Guía de 10 consultas de AgroStock (solución de referencia del docente).\n-- Ejecute agrostock.sql primero. Cada consulta se prueba por separado en DB Browser for SQLite.\n\n-- 1. Productos ordenados por precio, del mayor al menor.\nSELECT * FROM productos ORDER BY precio DESC;\n\n-- 2. Código, nombre y existencia de los productos con existencia menor que 10.\nSELECT codigo, nombre, existencia FROM productos WHERE existencia < 10;\n\n-- 3. Productos que vencen antes del 31/12/2026. Las fechas son texto yyyy-MM-dd, por eso se comparan como texto.\n--    Los productos sin vencimiento (NULL) no aparecen: NULL no es menor que nada.\nSELECT codigo, nombre, vencimiento FROM productos WHERE vencimiento < '2026-12-31';\n\n-- 4. Cada producto con el nombre de su categoría (JOIN).\nSELECT p.codigo, p.nombre, c.nombre AS categoria\nFROM productos p JOIN categorias c ON c.id = p.categoria_id;\n\n-- 5. Cuántos productos hay por categoría (GROUP BY).\nSELECT c.nombre AS categoria, COUNT(*) AS productos\nFROM productos p JOIN categorias c ON c.id = p.categoria_id\nGROUP BY c.nombre;\n\n-- 6. Valor total del inventario (precio x existencia).\nSELECT SUM(precio * existencia) AS valor_total FROM productos;\n\n-- 7. Nueva categoría «Riego» y un producto de esa categoría (la clave foránea se obtiene con una subconsulta).\nINSERT INTO categorias (nombre) VALUES ('Riego');\nINSERT INTO productos (codigo, nombre, categoria_id, precio, existencia)\nVALUES ('RIE-001', 'Manguera de 1/2 pulgada (rollo)', (SELECT id FROM categorias WHERE nombre = 'Riego'), 850.00, 10);\n\n-- 8. Aumento de 5 % al precio de los fertilizantes. Pruebe primero el mismo WHERE con un SELECT.\nUPDATE productos SET precio = ROUND(precio * 1.05, 2)\nWHERE categoria_id = (SELECT id FROM categorias WHERE nombre = 'Fertilizantes');\n\n-- 9. SALIDA de 3 unidades de HER-004 (la fecha usa el valor por defecto: hoy (hora local)).\nINSERT INTO movimientos (producto_id, tipo, cantidad)\nVALUES ((SELECT id FROM productos WHERE codigo = 'HER-004'), 'SALIDA', 3);\n\n-- 10. Eliminar los productos de Herramientas con existencia 0.\n--     Primero verifique con SELECT; después cambie SELECT * por DELETE.\nSELECT * FROM productos\nWHERE existencia = 0 AND categoria_id = (SELECT id FROM categorias WHERE nombre = 'Herramientas');\nDELETE FROM productos\nWHERE existencia = 0 AND categoria_id = (SELECT id FROM categorias WHERE nombre = 'Herramientas');\n"}, "productos_importar.csv": {"lang": "csv", "src": "codigo;nombre;categoria;precio;existencia;vencimiento\nIMP-0001;Fórmula 15-15-15 (quintal) - lote 1;Fertilizantes;1122.70;19;\nIMP-0002;Semilla de arroz (libra) - lote 1;Semillas;27.82;83;2027-01-27\nIMP-0003;Herbicida selectivo (litro) - lote 1;Herbicidas;161.50;46;2027-10-17\nIMP-0004;Azadón con cabo - lote 1;Herramientas;280.00;4;\nIMP-0005;Sulfato de amonio (quintal) - lote 1;Fertilizantes;741.00;55;\nIMP-0006;Semilla de frijol negro (libra) - lote 1;Semillas;32.10;8;2027-04-18\nIMP-0007;Herbicida de contacto (litro) - lote 1;Herbicidas;214.00;7;2027-10-08\nIMP-0008;Pala redonda - lote 1;Herramientas;294.50;73;\nIMP-0009;Fosfato diamónico DAP (quintal) - lote 1;Fertilizantes;1412.40;6;\nIMP-0010;Semilla de tomate (sobre) - lote 1;Semillas;45.00;5;2027-09-10\nIMP-0011;Herbicida pre-emergente (litro) - lote 1;Herbicidas;160.50;18;2027-09-19\nIMP-0012;Tijera de podar - lote 1;Herramientas;267.80;71;\nIMP-0013;Abono orgánico (saco) - lote 1;Fertilizantes;210.00;13;\nIMP-0014;Semilla de chile (sobre) - lote 1;Semillas;40.00;47;2027-02-19\nIMP-0015;Herbicida sistémico (litro) - lote 1;Herbicidas;180.50;79;2028-04-22\nIMP-0016;Rastrillo - lote 1;Herramientas;246.10;99;\nIMP-0017;Cloruro de potasio (quintal) - lote 1;Fertilizantes;1081.50;59;\nIMP-0018;Semilla de pipián (sobre) - lote 1;Semillas;37.45;46;2027-05-26\nIMP-0019;Herbicida para pasto (litro) - lote 1;Herbicidas;85.00;89;2027-04-19\nIMP-0020;Guantes de trabajo (par) - lote 2;Herramientas;61.80;67;\nIMP-0021;Fórmula 15-15-15 (quintal) - lote 2;Fertilizantes;1166.30;112;\nIMP-0022;Semilla de arroz (libra) - lote 2;Semillas;26.78;93;2028-08-20\nIMP-0023;Herbicida selectivo (litro) - lote 2;Herbicidas;161.50;15;2028-09-06\nIMP-0024;Azadón con cabo - lote 2;Herramientas;288.40;19;\nIMP-0025;Sulfato de amonio (quintal) - lote 2;Fertilizantes;834.60;53;\n"}, "DemoHilos/Program.cs": {"lang": "cs", "src": "// DemoHilos: proyecto de consola para ver, sin ventanas, cómo se comportan los hilos.\n// Es \"top-level statements\": las instrucciones van directo, sin escribir class Program ni Main.\n\n// ============ 1. Estados de un hilo ============\nConsole.WriteLine(\"=== 1. Estados de un hilo ===\");\nvar hilo = new Thread(() => Thread.Sleep(1500)) { Name = \"Trabajador\" };\nConsole.WriteLine($\"Antes de Start:   {hilo.ThreadState}\");   // Unstarted: creado pero no iniciado\nhilo.Start();\nThread.Sleep(200);                                             // damos tiempo a que el hilo llegue a su Sleep\nConsole.WriteLine($\"Durante su Sleep: {hilo.ThreadState}\");   // WaitSleepJoin: dormido, esperando\nhilo.Join();                                                   // el hilo principal espera a que termine\nConsole.WriteLine($\"Después de Join:  {hilo.ThreadState}\");   // Stopped: terminó su método\n\n// ============ 2. Condición de carrera ============\nConsole.WriteLine(\"\\n=== 2. Condición de carrera (2 hilos x 1 000 000 de incrementos) ===\");\nconst int VUELTAS = 1_000_000;\nint sinProteger = 0, conLock = 0, conInterlocked = 0;\nobject candado = new();\n\n// Lanza dos hilos que ejecutan el mismo incremento VUELTAS veces y espera a que ambos terminen.\nvoid DosHilos(Action incremento)\n{\n    var a = new Thread(() => { for (int i = 0; i < VUELTAS; i++) incremento(); });\n    var b = new Thread(() => { for (int i = 0; i < VUELTAS; i++) incremento(); });\n    a.Start(); b.Start();\n    a.Join(); b.Join();\n}\n\n// contador++ es en realidad LEER, SUMAR y ESCRIBIR. Si los hilos se intercalan entre esos pasos, se pierden incrementos.\nDosHilos(() => sinProteger++);\n// lock: solo un hilo a la vez entra a la sección crítica. Correcto, pero más lento.\nDosHilos(() => { lock (candado) { conLock++; } });\n// Interlocked: la CPU hace leer-sumar-escribir como UNA sola operación indivisible. Correcto y rápido.\nDosHilos(() => Interlocked.Increment(ref conInterlocked));\n\nConsole.WriteLine($\"Esperado:         {2 * VUELTAS:N0}\");\nConsole.WriteLine($\"Sin proteger:     {sinProteger:N0}   <- casi siempre MENOR: se perdieron incrementos\");\nConsole.WriteLine($\"Con lock:         {conLock:N0}\");\nConsole.WriteLine($\"Con Interlocked:  {conInterlocked:N0}\");\n\n// ============ 3. SemaphoreSlim: límite de tareas simultáneas ============\nConsole.WriteLine(\"\\n=== 3. SemaphoreSlim: máximo 2 descargas a la vez ===\");\nusing var semaforo = new SemaphoreSlim(2);   // 2 \"permisos\": solo 2 tareas pueden estar dentro a la vez\nvar descargas = Enumerable.Range(1, 5).Select(n => Task.Run(async () =>\n{\n    await semaforo.WaitAsync();              // pide un permiso; si no hay, espera sin bloquear el hilo\n    try\n    {\n        Console.WriteLine($\"Descarga {n} empieza (hilo {Environment.CurrentManagedThreadId})\");\n        await Task.Delay(800);               // simula la descarga\n        Console.WriteLine($\"Descarga {n} termina\");\n    }\n    finally\n    {\n        semaforo.Release();                  // SIEMPRE devolver el permiso, aunque falle la descarga\n    }\n})).ToArray();\nawait Task.WhenAll(descargas);\n\n// ============ 4. Detención controlada (cancelación cooperativa) ============\nConsole.WriteLine(\"\\n=== 4. Cancelación cooperativa con CancellationToken ===\");\nusing var cts = new CancellationTokenSource();\nvar trabajo = Task.Run(() =>\n{\n    for (int paso = 1; paso <= 10; paso++)\n    {\n        cts.Token.ThrowIfCancellationRequested();   // punto seguro: aquí la tarea acepta detenerse\n        Console.WriteLine($\"Paso {paso} de 10\");\n        Thread.Sleep(300);\n    }\n}, cts.Token);\n\nThread.Sleep(1000);\ncts.Cancel();                                       // se PIDE detener; la tarea decide cuándo\ntry\n{\n    await trabajo;\n}\ncatch (OperationCanceledException)\n{\n    Console.WriteLine(\"La tarea se detuvo en un punto seguro (sin Thread.Abort).\");\n}\n"}, "DemoHilos/DemoHilos.csproj": {"lang": "xml", "src": "<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n    <!-- Proyecto de CONSOLA aparte: sin ventanas se observan los hilos sin distracciones. -->\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net8.0</TargetFramework>\n    <Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>\n  </PropertyGroup>\n\n</Project>\n"}};

/* ================= Simulador: carrera crítica y SemaphoreSlim ================= */
function simConcurrency(host, viewer) {
  const FILE = 'DemoHilos/Program.cs', log = makeLog(viewer, FILE);
  const N = () => Math.max(1000, +nIn.value || 100000);
  const nIn = h('input', { class: 'boa-in', type: 'number', value: 100000, min: 1000, max: 500000, step: 1000, id: 'cc-n', style: 'width:130px' });
  const res = h('div', { class: 'tbl-wrap' });
  function carrera(n) { // 2 hilos x n incrementos con cambios de contexto entre «leer» y «escribir»
    let counter = 0; const pend = [null, null], left = [n, n]; let t = 0;
    while (left[0] > 0 || left[1] > 0) {
      if (Math.random() < 0.3) t = 1 - t; if (left[t] === 0) t = 1 - t;
      if (pend[t] === null) pend[t] = counter; else { counter = pend[t] + 1; pend[t] = null; left[t]--; }
    }
    return counter;
  }
  function run() {
    const n = N(), tot = 2 * n, a = carrera(n);
    const rows = [['Sin protección (contador++)', a, 'DosHilos(() => sinProteger++);'], ['Con lock', tot, 'lock (candado) { conLock++; }'], ['Con Interlocked.Increment', tot, 'Interlocked.Increment(ref conInterlocked)']];
    res.replaceChildren(h('table', { class: 'tbl' }, h('thead', null, h('tr', null, ['Técnica', 'Esperado', 'Resultado', 'Incrementos perdidos'].map(t => h('th', null, t)))),
      h('tbody', null, rows.map(r => h('tr', null, h('td', null, r[0]), h('td', { class: 'mono' }, tot.toLocaleString('en-US')), h('td', { class: 'mono' }, h('b', null, r[1].toLocaleString('en-US'))), h('td', null, r[1] === tot ? h('span', { class: 'pill ok' }, '0') : h('span', { class: 'pill bad' }, (tot - r[1]).toLocaleString('en-US'))))))));
    log.push('Carrera', `${tot.toLocaleString('en-US')} esperados; sin protección dio ${a.toLocaleString('en-US')}`, 'DosHilos(() => sinProteger++)'); log.push('Sincronizado', 'lock e Interlocked dan siempre el valor exacto', 'DosHilos(() => Interlocked.Increment');
  }
  /* SemaphoreSlim */
  let perm = 2, tasks = [], timer = 0;
  const lanes = h('div', { class: 'row', 'aria-live': 'polite' }), permIn = h('select', { class: 'boa-sel', 'aria-label': 'Permisos del semáforo', onchange: e => { perm = +e.target.value; } }, [1, 2, 3].map(v => h('option', { value: v, selected: v === perm }, v)));
  function drawT() { lanes.replaceChildren(...tasks.map(t => h('span', { class: 'pill ' + (t.s === 'dentro' ? 'ok' : t.s === 'fin' ? '' : 'warn') }, `Tarea ${t.n}: ${t.s === 'dentro' ? 'descargando ' + Math.ceil(t.left / 10) + ' s' : t.s === 'fin' ? 'terminó' : 'esperando permiso'}`))); }
  function sem() { clearInterval(timer); tasks = 'ABCDE'.split('').map(n => ({ n, s: 'espera', left: 12 })); log.push('SemaphoreSlim', `new SemaphoreSlim(${perm}): solo ${perm} tarea(s) a la vez`, 'using var semaforo = new SemaphoreSlim(2);');
    timer = setInterval(() => { let inside = tasks.filter(t => t.s === 'dentro').length;
      tasks.forEach(t => { if (t.s === 'dentro') { t.left--; if (t.left <= 0) { t.s = 'fin'; inside--; } } });
      tasks.forEach(t => { if (t.s === 'espera' && inside < perm) { t.s = 'dentro'; inside++; } }); drawT(); if (tasks.every(t => t.s === 'fin')) { clearInterval(timer); log.push('Release', 'finally { semaforo.Release(); } devolvió cada permiso', 'semaforo.Release();'); } }, 100); }
  host.append(h('div', { style: COL }, h('h4', { class: 'block-h', style: 'margin:0' }, 'A. Condición de carrera'), h('div', { class: 'row' }, h('label', { for: 'cc-n' }, 'Incrementos por hilo:'), nIn, h('button', { class: 'sbtn', onclick: run }, 'Ejecutar los tres casos')), res,
    h('p', { class: 'sim-desc' }, 'En C# real ejecute DemoHilos: el valor sin protección cambia en cada corrida, pero casi nunca llega al esperado. Aquí se modela el entrelazado leer → sumar → escribir.'),
    h('h4', { class: 'block-h', style: 'margin:8px 0 0' }, 'B. SemaphoreSlim: límite de tareas simultáneas'), h('div', { class: 'row' }, h('label', null, 'Permisos: ', permIn), h('button', { class: 'sbtn', onclick: sem }, 'Iniciar 5 descargas')), lanes,
    h('div', { class: 'panel' }, h('h4', null, 'Registro'), log.box)));
  run();
  const mo = new MutationObserver(() => { if (!host.isConnected) { clearInterval(timer); mo.disconnect(); } }); mo.observe(document.body, { childList: true, subtree: true });
}

  { id: 'crud', nav: 'CRUD', title: 'CRUD desde la interfaz y movimientos con transacción', files: ['Forms/FrmProducto.cs', 'Forms/FrmProducto.Designer.cs', 'Forms/FrmPrincipal.cs', 'Forms/FrmPrincipal.Designer.cs', 'Forms/FrmMovimiento.cs', 'Forms/FrmMovimiento.Designer.cs'],
    goal: 'Conectar la ventana de AgroStock v1 a la base: listar, buscar, insertar, editar y eliminar, y registrar entradas y salidas en una transacción.',

      'Revise <code>Ejecutar(Action, codigo)</code>: captura <code>SqliteException</code> por su código extendido (2067 repetido, 787 clave foránea) y siempre recarga la tabla en <code>finally</code>.', 'Cree <b>FrmMovimiento</b>: Entrada o Salida con cantidad; captura el error 275 (CHECK) si la existencia quedaría negativa.',
      'Exportar, Acerca de y el reloj siguen funcionando como en v1; ahora exportan lo que hay en la base (<code>ExportarCsv</code> recorre <code>repo.Listar()</code>).', 'Pruebe en los simuladores: primero el CRUD completo y luego el movimiento con y sin transacción.'],
    after: "<h3 class=\"block-h\" style=\"margin-top:18px\">Controles del formulario</h3><p class=\"sim-desc\" style=\"margin:0 0 10px\">Cada <code>.Designer.cs</code> del visor es lo que genera Visual Studio al colocar estos controles. Puede copiarlo o armar el formulario a mano con las tablas. Los cuatro empiezan con <code>#nullable enable</code> (evita la advertencia CS8669) y usan <code>namespace AgroStock.E02.Forms;</code>.</p><h4 style=\"margin:12px 0 6px\">FrmPrincipal: los controles de v1 más tres nuevos</h4><p class=\"sim-desc\" style=\"margin:0 0 8px\">Conserve todo lo de v1 (<code>menuPrincipal, mnuArchivo, mnuNuevo, mnuExportar, sepArchivo, mnuSalir, mnuEditar, mnuEditarProducto, mnuEliminar, mnuAyuda, mnuAcercaDe, barraHerramientas, tsbNuevo, tsbEditar, tsbEliminar, sepBarra, lblBuscar, txtBuscar, barraEstado, tslTotal, tslReloj, dgvProductos, tmrReloj</code>) y agregue:</p><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Nombre</th><th>Tipo</th><th>Propiedades</th></tr></thead><tbody><tr><td><code>mnuImportar</code></td><td>ToolStripMenuItem</td><td class=\"wrap\">Text <code>&amp;Importar desde CSV...</code>, ShortcutKeys <code>Ctrl+I</code>; dentro de <code>mnuArchivo</code>, antes de <code>mnuExportar</code></td></tr><tr><td><code>mnuMovimiento</code></td><td>ToolStripMenuItem</td><td class=\"wrap\">Text <code>Registrar &amp;movimiento...</code>, ShortcutKeys <code>Ctrl+M</code>; dentro de <code>mnuEditar</code>, después de <code>mnuEliminar</code></td></tr><tr><td><code>tsbMovimiento</code></td><td>ToolStripButton</td><td class=\"wrap\">Text <code>Movimiento</code>, DisplayStyle <code>Text</code>, ToolTip <code>Registrar entrada o salida (Ctrl+M)</code>; después de <code>tsbEliminar</code></td></tr></tbody></table></div><p class=\"sim-desc\" style=\"margin:8px 0 0\">Título de la ventana: <code>AgroStock v2 - Inventario del agroservicio</code>.</p><h4 style=\"margin:16px 0 6px\">FrmProducto: el diseñador de v1 no cambia</h4><p class=\"sim-desc\" style=\"margin:0 0 8px\">Ya tenía <code>errores</code> (ErrorProvider) y <code>cboCategoria</code> con <code>DropDownStyle = DropDownList</code>. Solo el namespace pasa a <code>AgroStock.E02.Forms</code>. ClientSize 440×300, FixedDialog, CenterParent.</p><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Nombre</th><th>Tipo</th><th>Propiedades</th></tr></thead><tbody><tr><td><code>errores</code></td><td>ErrorProvider</td><td class=\"wrap\">ContainerControl = el formulario</td></tr><tr><td><code>lblCodigo / txtCodigo</code></td><td>Label / TextBox</td><td class=\"wrap\">Text <code>&amp;Código:</code>; MaxLength 20; (130,20), 150×23</td></tr><tr><td><code>lblNombre / txtNombre</code></td><td>Label / TextBox</td><td class=\"wrap\">Text <code>&amp;Nombre:</code>; MaxLength 80; (130,55), 280×23</td></tr><tr><td><code>lblCategoria / cboCategoria</code></td><td>Label / ComboBox</td><td class=\"wrap\">Text <code>C&amp;ategoría:</code>; <b>DropDownStyle = DropDownList</b>; (130,90), 200×23</td></tr><tr><td><code>lblPrecio / nudPrecio</code></td><td>Label / NumericUpDown</td><td class=\"wrap\">Text <code>&amp;Precio (C$):</code>; DecimalPlaces 2; Maximum 1000000; ThousandsSeparator true</td></tr><tr><td><code>lblExistencia / nudExistencia</code></td><td>Label / NumericUpDown</td><td class=\"wrap\">Text <code>&amp;Existencia:</code>; Maximum 100000</td></tr><tr><td><code>lblVencimiento / dtpVencimiento</code></td><td>Label / DateTimePicker</td><td class=\"wrap\">Text <code>&amp;Vencimiento:</code>; Format Short; <b>ShowCheckBox = true</b> (sin marcar = no vence)</td></tr><tr><td><code>btnGuardar</code></td><td>Button</td><td class=\"wrap\">Text <code>&amp;Guardar</code>, (240,250), 85×30; AcceptButton del formulario</td></tr><tr><td><code>btnCancelar</code></td><td>Button</td><td class=\"wrap\">Text <code>Cancelar</code>, DialogResult <code>Cancel</code>, (335,250), 85×30; CancelButton del formulario</td></tr></tbody></table></div><h4 style=\"margin:16px 0 6px\">FrmMovimiento</h4><p class=\"sim-desc\" style=\"margin:0 0 8px\">ClientSize 420×240, FormBorderStyle <code>FixedDialog</code>, sin Maximizar ni Minimizar, StartPosition <code>CenterParent</code>, Text <code>Registrar movimiento</code>, AcceptButton <code>btnRegistrar</code>, CancelButton <code>btnCancelar</code>.</p><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Nombre</th><th>Tipo</th><th>Propiedades</th></tr></thead><tbody><tr><td><code>errores</code></td><td>ErrorProvider</td><td class=\"wrap\">—</td></tr><tr><td><code>lblProducto</code></td><td>Label</td><td class=\"wrap\">AutoSize false, (20,20), 380×36</td></tr><tr><td><code>grpTipo</code></td><td>GroupBox</td><td class=\"wrap\">(20,65), 380×55, Text <code>Tipo de movimiento</code>; contiene los dos RadioButton (mismo contenedor = excluyentes)</td></tr><tr><td><code>rdoEntrada</code></td><td>RadioButton</td><td class=\"wrap\">Text <code>&amp;Entrada (llega mercadería)</code>, (15,22)</td></tr><tr><td><code>rdoSalida</code></td><td>RadioButton</td><td class=\"wrap\">Text <code>&amp;Salida (venta)</code>, (215,22)</td></tr><tr><td><code>lblCantidad</code></td><td>Label</td><td class=\"wrap\">Text <code>&amp;Cantidad:</code>, (20,143)</td></tr><tr><td><code>nudCantidad</code></td><td>NumericUpDown</td><td class=\"wrap\">(140,140), Minimum 1, Maximum 100000, Value 1</td></tr><tr><td><code>btnRegistrar</code></td><td>Button</td><td class=\"wrap\">Text <code>&amp;Registrar</code>, (210,190), 90×30</td></tr><tr><td><code>btnCancelar</code></td><td>Button</td><td class=\"wrap\">Text <code>Cancelar</code>, DialogResult <code>Cancel</code>, (310,190), 90×30</td></tr></tbody></table></div><div style=\"margin-top:12px\"><div class=\"note\"><b>Normal:</b> en Visual Studio el diseñador puede mostrar <i>No se pudo crear una instancia de FrmProducto / FrmMovimiento</i> porque sus constructores reciben parámetros. El formulario funciona al ejecutar (<kbd>F5</kbd>).</div></div>",
    sims: [{ k: 'crud', t: 'AgroStock v2: CRUD', d: 'Cree, edite, busque y elimine. El registro muestra el SQL y la excepción capturada.' }, { k: 'mov', t: 'Movimiento: con y sin transacción', d: 'Registre una SALIDA y provoque un fallo a mitad de camino.' }],
    errors: [['2067', 'El programa se cierra al repetir un código', 'Falta el <code>catch (SqliteException ex) when (ex.SqliteExtendedErrorCode == 2067)</code> alrededor de Insertar.'], ['787', 'No deja eliminar un producto', 'Tiene movimientos registrados (FK). Es el comportamiento correcto: informe al usuario.'],
      ['Cuadrícula', 'La cuadrícula no se refresca después de guardar', 'Falta llamar a <code>Cargar()</code>; en el código de la guía está en el bloque finally de Ejecutar.']],
    check: ['Listar y buscar funcionan contra la base', 'Insertar, editar y eliminar funcionan', 'Un código repetido muestra un aviso, no una excepción', 'Las entradas y salidas actualizan la existencia en una transacción', 'Exportar a CSV genera inventario.csv con los 14 productos'] },

  { id: 'hilos', nav: 'Hilos y tareas', title: 'Hilos y tareas: importar 500 productos sin congelar la ventana', files: ['Forms/FrmImportar.cs', 'Forms/FrmImportar.Designer.cs', 'productos_importar.csv'],
    goal: 'Mover una tarea larga a segundo plano con Task.Run, mostrar su avance con IProgress y mantener la ventana respondiendo.',
    how: ['Cree <b>Forms/FrmImportar.cs</b>: botones Importar y Cancelar, barra de progreso y la casilla <b>chkBloqueante</b> que existe solo para comparar. Los controles están en la tabla de abajo y en su <code>.Designer.cs</code>.', 'Primero ejecute en modo bloqueante: la ventana se queda blanca y Cancelar no responde (la interfaz está congelada). Después en modo normal: la estrella gira y la barra avanza.',
      'Estudie el patrón: <code>async void</code> (solo en manejadores), <code>await Task.Run(...)</code> y <code>Progress&lt;int&gt;</code> creado en el hilo de la interfaz.', 'Ejecute DemoHilos para ver los estados de un hilo y recuerde la regla: solo el hilo de la interfaz toca los controles.', 'Agregue <b>productos_importar.csv</b> (500 filas, botón de descarga bajo el visor) a la carpeta del proyecto y cambie «Copiar en el directorio de salida» a <b>Copiar si es posterior</b>.', 'Estudie el formato del CSV en el visor: encabezado <code>codigo;nombre;categoria;precio;existencia;vencimiento</code>, separador punto y coma, 6 campos por línea, punto decimal, fechas <code>yyyy-MM-dd</code> o vacío y categorías que ya existan en la tabla.'],
    after: "<div class=\"tip\" style=\"margin-top:12px\"><b>Archivo completo.</b> El visor muestra las primeras 25 filas. El archivo completo tiene 500 filas; descárguelo de la carpeta de recursos o con este botón. Guárdelo en la carpeta del proyecto y en Propiedades ponga <i>Copiar en el directorio de salida</i> = <b>Copiar si es posterior</b>. <div style=\"margin-top:8px\"><button class=\"sbtn sm\" type=\"button\" onclick=\"descargarCsv()\">Descargar productos_importar.csv</button></div></div><h3 class=\"block-h\" style=\"margin-top:18px\">Controles del formulario</h3><p class=\"sim-desc\" style=\"margin:0 0 8px\">FrmImportar: ClientSize 565×240, FormBorderStyle <code>FixedDialog</code>, sin Maximizar ni Minimizar, StartPosition <code>CenterParent</code>, Text <code>Importar productos</code>. Su <code>.Designer.cs</code> también empieza con <code>#nullable enable</code>.</p><div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Nombre</th><th>Tipo</th><th>Propiedades</th></tr></thead><tbody><tr><td><code>lblArchivo</code></td><td>Label</td><td class=\"wrap\">Text <code>&amp;Archivo CSV:</code>, (20,23)</td></tr><tr><td><code>txtArchivo</code></td><td>TextBox</td><td class=\"wrap\">(115,20), 330×23</td></tr><tr><td><code>btnExaminar</code></td><td>Button</td><td class=\"wrap\">Text <code>E&amp;xaminar...</code>, (455,18), 90×27</td></tr><tr><td><code>chkBloqueante</code></td><td>CheckBox</td><td class=\"wrap\">(20,62), Text <code>Ejecutar en el hilo de la interfaz (solo para comparar: la ventana se congela)</code>. Con la casilla marcada la importación corre en el hilo de la interfaz y <b>el botón Cancelar no responde</b>, porque la ventana está congelada.</td></tr><tr><td><code>btnIniciar</code></td><td>Button</td><td class=\"wrap\">Text <code>&amp;Importar</code>, (20,100), 90×30</td></tr><tr><td><code>btnCancelar</code></td><td>Button</td><td class=\"wrap\">Text <code>&amp;Cancelar</code>, (120,100), 90×30. <b>Sin DialogResult</b>: lo maneja el código (<code>cts?.Cancel()</code>)</td></tr><tr><td><code>btnCerrar</code></td><td>Button</td><td class=\"wrap\">Text <code>Cerrar</code>, (455,100), 90×30</td></tr><tr><td><code>barra</code></td><td>ProgressBar</td><td class=\"wrap\">(20,150), 525×23</td></tr><tr><td><code>lblEstado</code></td><td>Label</td><td class=\"wrap\">AutoSize false, (20,183), 525×40, Text <code>Listo para importar.</code></td></tr></tbody></table></div><div style=\"margin-top:12px\"><div class=\"note\"><b>Normal:</b> en Visual Studio el diseñador puede mostrar <i>No se pudo crear una instancia de FrmImportar</i> porque sus constructores reciben parámetros. El formulario funciona al ejecutar (<kbd>F5</kbd>).</div></div>",
    sims: [{ k: 'threads', t: 'Estados de un hilo', d: 'Siga un hilo desde Unstarted hasta Stopped y provoque el error de acceso entre hilos.' }, { k: 'import', t: 'Simulador de la estrella: bloqueante o en segundo plano', d: 'Compare los dos modos. Agregue líneas con errores para ver cómo se rechazan.' }],
    errors: [['Congelada', 'La ventana dice «No responde» al importar', 'La importación corre en el hilo de la interfaz. Use <code>await Task.Run(() =&gt; Importar(...))</code>.'], ['InvalidOperation', 'Operación no válida a través de subprocesos', 'Se tocó un control desde Task.Run. Reporte con <code>IProgress&lt;int&gt;</code>.'],
      ['async void', 'Una excepción cierra la aplicación sin aviso', '<code>async void</code> no puede capturarse desde fuera: use try/catch dentro del manejador y devuelva Task en el resto de métodos.']],
    check: ['La importación no congela la ventana', 'La barra y el estado se actualizan con IProgress', 'Ejecuté DemoHilos y vi los estados del hilo', 'Entiendo por qué no se toca un control desde otro hilo', 'productos_importar.csv (500 filas) está en el proyecto y se copia al directorio de salida'] },

  { id: 'sincro', nav: 'Sincronización', title: 'Sincronización y detención controlada', files: ['DemoHilos/Program.cs', 'DemoHilos/DemoHilos.csproj'],
    goal: 'Proteger datos compartidos entre hilos y detener una tarea de forma cooperativa, sin dejar datos a medias.',
    after: "<div class=\"note\"><b>Si aparece <code>error CS0579: Atributo '...' duplicado</code>:</b> la carpeta <b>DemoHilos</b> quedó dentro de la carpeta de AgroStock.E02 y el proyecto de ventanas compila también sus archivos. Solución: muévala a una carpeta hermana, junto a AgroStock.E02, o agregue al <code>.csproj</code> de AgroStock.E02: <code>&lt;Compile Remove=\"DemoHilos\\**\" /&gt; &lt;None Remove=\"DemoHilos\\**\" /&gt; &lt;EmbeddedResource Remove=\"DemoHilos\\**\" /&gt;</code></div>",
    how: ['Si aún no lo hizo, cree <b>DemoHilos</b> como proyecto de consola <b>junto a</b> AgroStock.E02 (misma solución, carpeta hermana, nunca dentro de la carpeta de AgroStock.E02).', 'Ejecute <b>DemoHilos</b>: dos hilos suman un millón de veces cada uno. Sin protección el resultado casi nunca es 2 000 000.', 'Compare <code>lock</code> (correcto, más lento) con <code>Interlocked.Increment</code> (correcto y rápido).', 'Pruebe <code>SemaphoreSlim</code>: limita cuántas tareas entran a la vez y se libera siempre en <code>finally</code>.',
      'En FrmImportar, la cancelación es cooperativa: <code>cts.Cancel()</code> pide detener y la tarea revisa el token, hace <code>Rollback</code> y sale con <code>ThrowIfCancellationRequested()</code>.', 'Cancele una importación en el simulador con y sin transacción.'],
    sims: [{ k: 'conc', t: 'Carrera crítica y SemaphoreSlim', d: 'Vea los incrementos perdidos y el límite de tareas simultáneas.' }, { k: 'cancel', t: 'Cancelación con y sin Rollback', d: 'Cancele a mitad de la importación y compare cómo queda la base.' }],
    errors: [['Carrera', 'El total insertado no coincide con lo guardado', 'Se usó <code>contador++</code> desde varios hilos. Use <code>Interlocked.Increment</code> o un <code>lock</code>.'], ['Abort', 'Thread.Abort no funciona', 'Está obsoleto y no se admite en .NET moderno. Use CancellationToken.'],
      ['Semáforo', 'Las tareas quedan esperando para siempre', 'Falta <code>semaforo.Release()</code> en un bloque finally.'],
      ['CS0579', 'Atributo duplicado al compilar AgroStock.E02', 'DemoHilos quedó <b>dentro</b> de la carpeta de AgroStock.E02. Muévalo a una carpeta hermana, o agregue al .csproj de E02 <code>&lt;Compile Remove="DemoHilos\\**" /&gt;</code>, <code>&lt;None Remove="DemoHilos\\**" /&gt;</code> y <code>&lt;EmbeddedResource Remove="DemoHilos\\**" /&gt;</code>.']],
    check: ['Vi la condición de carrera y la corregí con lock o Interlocked', 'Entiendo la diferencia entre lock e Interlocked', 'Cancelar la importación revierte la transacción', 'Sé por qué Thread.Abort no se usa'] },

      'Redacte el <b>informe de una página</b> con ejemplo propio: Thread, Task y BackgroundWorker, cuándo usar cada uno.', 'Suba el proyecto <b>sin las carpetas bin y obj</b>, el script con las 10 consultas, el video y el informe. Si usó IA o ejemplos, indíquelo en el README.'],

      ['2067', 'UNIQUE constraint failed', 'Código repetido; el programa debe avisar, no cerrarse.'], ['787', 'FOREIGN KEY constraint failed', 'Producto con movimientos o categoría inexistente: el aviso es correcto. Mantenga PRAGMA foreign_keys = ON en Db.Abrir(); no dependa de que el proveedor lo active.'], ['Parámetro', 'Un parámetro sin valor', 'Cada $nombre del SQL necesita su AddWithValue.'],
      ['Congelada', 'La ventana dice «No responde»', 'El trabajo pesado está en el hilo de la interfaz.'], ['InvalidOperation', 'Acceso a control desde otro hilo', 'Use IProgress<int>.'], ['Carrera', 'El contador pierde incrementos', 'Use Interlocked o lock.'],
      ['CS0579', 'Atributo duplicado al compilar AgroStock.E02', 'DemoHilos quedó dentro de la carpeta de AgroStock.E02. Muévalo a una carpeta hermana o agregue las tres líneas Remove al .csproj de E02.']],
    check: ['Compila sin errores', 'El CRUD, los movimientos y la importación funcionan', 'Puedo cancelar la importación y se revierte', 'Grabé el video de máximo 2 minutos', 'Subí el proyecto sin bin y obj, el script SQL y el informe'], next: true }
