<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía AgroStock v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Concepto: cuaderno de campo + taller. Guía en verde de cultivo con tinta oscura; los simuladores
   conservan el aspecto gris claro de Windows para distinguir "el programa" de "la guía". */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',Consolas,'Cascadia Mono',ui-monospace,monospace;
  --bg:#F1F5EF; --surface:#FFFFFF; --surface2:#E7EEE4; --fg:#15241B; --muted:#51645A; --line:#CBD7C7;
  --accent:#1A6B45; --accent-fg:#FFFFFF; --accent-soft:#DAEBDC; --accent-line:#9CC8AA;
  --warn:#8A5200; --warn-soft:#F7E9CC; --bad:#B3261E; --bad-soft:#F9DEDB; --ok:#1A6B45;
  --code-bg:#13201A; --code-fg:#DCE8DF; --code-c:#7FB48E; --code-k:#E8AB5E; --code-s:#9DC8E8; --code-t:#8ED6B5; --code-n:#CDA9EA; --code-ln:#5C7468; --code-hl:#2A4A39;
  --code-bar:#1B2C23; --code-bar-fg:#B9CCBF;
  /* Simuladores: aspecto Windows, igual en claro y oscuro */
  --w-face:#F0F0F0; --w-white:#FFFFFF; --w-border:#ADADAD; --w-text:#111111; --w-mute:#6B6B6B; --w-sel:#0078D7; --w-sel-fg:#FFFFFF; --w-title:#FFFFFF; --w-shadow:rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1612; --surface:#15211A; --surface2:#1C2A22; --fg:#E2ECE4; --muted:#9AB0A1; --line:#2B3C32;
    --accent:#5CC68E; --accent-fg:#0A1A11; --accent-soft:#1B3828; --accent-line:#2F6A4A;
    --warn:#E9B14F; --warn-soft:#3A2D12; --bad:#FF8F85; --bad-soft:#3F1D1A; --ok:#5CC68E;
    --code-bg:#0A110D; --code-bar:#121D17; --code-hl:#223B2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#15211A; --surface2:#1C2A22; --fg:#E2ECE4; --muted:#9AB0A1; --line:#2B3C32;
  --accent:#5CC68E; --accent-fg:#0A1A11; --accent-soft:#1B3828; --accent-line:#2F6A4A;
  --warn:#E9B14F; --warn-soft:#3A2D12; --bad:#FF8F85; --bad-soft:#3F1D1A; --ok:#5CC68E;
  --code-bg:#0A110D; --code-bar:#121D17; --code-hl:#223B2E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:130px}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0 0 .8em;max-width:68ch}
code,.mono{font-family:var(--font-mono);font-size:.88em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- encabezado fijo ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.brand small{font-family:var(--font-body);font-weight:400;color:var(--muted);margin-left:.5em;font-size:.85rem}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-bar{width:96px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* ---------- estructura general ---------- */
main{max-width:1040px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:56px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(1.9rem,5vw,2.9rem);letter-spacing:-.02em;margin-bottom:.4em}
.hero .lead{font-size:1.12rem;color:var(--muted)}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:600;margin-bottom:.6em}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:1em 0 0;padding:0;list-style:none;font-size:.95rem}
.facts li{display:flex;gap:6px;align-items:baseline}
.facts b{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;min-width:0}
.map h2{font-size:1rem;margin-bottom:8px}
.tree{list-style:none;margin:0;padding:0;font-family:var(--font-mono);font-size:.84rem}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line);margin-left:6px}
.tree li{padding:1px 0}
.tree .dir{color:var(--muted);font-weight:600}
.tree button{background:none;border:0;padding:2px 6px;border-radius:5px;cursor:pointer;font:inherit;color:var(--fg);text-align:left}
.tree button:hover{background:var(--accent-soft)}
.tree .tag{font-family:var(--font-body);font-size:.72rem;color:var(--accent);margin-left:6px}
.map p{font-size:.85rem;color:var(--muted);margin:8px 0 0}

.step{scroll-margin-top:118px;display:flex;flex-direction:column;gap:18px;border-top:2px solid var(--fg);padding-top:20px}
.step-h{display:flex;flex-direction:column;gap:6px}
.step-h .num{font-family:var(--font-mono);font-size:.82rem;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.step-h h2{font-size:clamp(1.5rem,3.6vw,2.1rem);letter-spacing:-.015em}
.goal{font-size:1.05rem;color:var(--muted);margin:0}
.block-h{font-family:var(--font-display);font-size:1.08rem;margin:0 0 6px}
.how{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.how li::marker{color:var(--accent);font-weight:600}
.how b{font-weight:600}
.kbd,kbd{font-family:var(--font-mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.note{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.95rem;max-width:78ch}
.note b{color:var(--warn)}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.95rem;max-width:78ch}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th{background:var(--surface2);text-align:left;padding:6px 10px;font-weight:600;white-space:nowrap}
.tbl td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap}

/* ---------- visor de código ---------- */
.viewer{border-radius:10px;overflow:hidden;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--code-bar);min-width:0}
.v-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--code-bar);padding:8px 10px;color:var(--code-bar-fg)}
.v-tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.v-tabs button{background:transparent;border:1px solid transparent;color:var(--code-bar-fg);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:var(--font-mono);font-size:.8rem}
.v-tabs button[aria-selected="true"]{background:var(--code-bg);color:var(--code-fg);border-color:#2f4a3b}
.v-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #2f4a3b;border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--code-bar-fg);padding:3px 10px;cursor:pointer;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.v-copy{background:transparent;border:1px solid #2f4a3b;color:var(--code-bar-fg);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:.82rem}
.v-copy:hover{background:#243a2e}
.v-info{padding:6px 12px;font-size:.78rem;color:var(--code-ln);background:var(--code-bg);border-bottom:1px solid var(--code-bar)}
.v-body{max-height:460px;overflow:auto;padding:8px 0}
.v-body pre{margin:0;font-family:var(--font-mono);font-size:.8rem;line-height:1.6;width:max-content;min-width:100%}
.ln{display:flex;padding-right:16px}
.ln .no{flex:0 0 3.2em;text-align:right;padding-right:12px;color:var(--code-ln);user-select:none}
.ln.flash{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--code-k)}
.tc{color:var(--code-c);font-style:italic}.tk{color:var(--code-k)}.ts{color:var(--code-s)}.tt{color:var(--code-t)}.tn{color:var(--code-n)}

/* ---------- simuladores ---------- */
.sim{border:1px solid var(--accent-line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sim-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.sim-h h3{font-size:1.1rem}
.sim-h .tagsim{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.sim-desc{margin:0;color:var(--muted);font-size:.95rem}
.sbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.93rem}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.sbtn.ghost{background:transparent;color:var(--accent)}
.sbtn.sm{padding:3px 10px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{display:grid;gap:14px;min-width:0}
.stage.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.panel h4{margin:0 0 6px;font-family:var(--font-display);font-size:.95rem}
.logbox{font-family:var(--font-mono);font-size:.78rem;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.logbox .it{display:flex;flex-wrap:wrap;gap:2px 8px;padding:3px 6px;border-radius:5px;background:var(--surface)}
.logbox .it .ev{color:var(--accent);font-weight:600}
.logbox .it button{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit;padding:0}
.logbox .empty{color:var(--muted);font-family:var(--font-body);font-size:.88rem}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.78rem;border:1px solid var(--line);background:var(--surface)}
.pill.ok{background:var(--accent-soft);color:var(--ok);border-color:var(--accent-line)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.codebox{font-family:var(--font-mono);font-size:.8rem;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.6}
.codebox .chg{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--code-k);display:inline-block;width:100%}

/* ---------- ventana tipo Windows ---------- */
.win{background:var(--w-face);color:var(--w-text);border:1px solid #6d6d6d;box-shadow:0 8px 24px var(--w-shadow);position:relative;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.35;min-width:0;max-width:100%;overflow:hidden}
.win *{color-scheme:light}
.win-t{background:var(--w-title);display:flex;align-items:center;height:30px;border-bottom:1px solid #d6d6d6;font-size:12px;padding-left:8px;gap:8px;user-select:none}
.win-t .ic{width:14px;height:14px;background:var(--accent);border-radius:3px;flex:0 0 auto}
.win-t .tt2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-t .wb{display:flex;height:100%}
.win-t .wb span,.win-t .wb button{width:40px;height:100%;border:0;background:transparent;display:grid;place-items:center;font-size:12px;color:#222;cursor:default}
.win-t .wb button.x{cursor:pointer}.win-t .wb button.x:hover{background:#E81123;color:#fff}
.w-menu{display:flex;background:var(--w-white);border-bottom:1px solid #e5e5e5;height:24px;align-items:stretch;position:relative}
.w-menu>button{background:transparent;border:0;padding:0 9px;cursor:default;font-size:13px;color:var(--w-text)}
.w-menu>button:hover,.w-menu>button[aria-expanded="true"]{background:#CCE8FF}
.w-drop{position:absolute;top:24px;z-index:20;background:var(--w-white);border:1px solid #ccc;box-shadow:2px 3px 8px rgba(0,0,0,.25);min-width:230px;padding:2px}
.w-drop button{display:flex;justify-content:space-between;gap:24px;width:100%;background:transparent;border:0;padding:4px 22px 4px 26px;text-align:left;font-size:13px;color:var(--w-text);cursor:default}
.w-drop button:hover{background:#CCE8FF}
.w-drop hr{border:0;border-top:1px solid #ddd;margin:3px 2px}
.w-drop .sk{color:var(--w-mute);font-size:12px}
.w-tool{display:flex;gap:2px;padding:2px 4px;align-items:center;background:var(--w-face);border-bottom:1px solid #d8d8d8;height:30px;flex-wrap:nowrap;overflow:hidden}
.w-tool button{border:1px solid transparent;background:transparent;padding:2px 9px;font-size:13px;cursor:default;color:var(--w-text);border-radius:2px}
.w-tool button:hover{background:#E5F3FF;border-color:#CCE8FF}
.w-tool .sep{width:1px;height:20px;background:#bbb;margin:0 4px}
.w-tool label{font-size:13px;margin-left:4px}
.w-tool input{height:22px;width:130px;border:1px solid #7a7a7a;background:#fff;padding:0 4px;font-size:13px;color:var(--w-text);min-width:0}
.w-status{display:flex;justify-content:space-between;gap:10px;background:#007ACC;color:#fff;font-size:12px;padding:2px 10px;height:22px;align-items:center}
.w-status *{color:#fff}
.w-body{padding:10px 12px}
.w-grid{background:#fff;overflow:auto;border-top:1px solid #aaa}
.w-grid table{border-collapse:collapse;font-size:13px;width:100%;color:var(--w-text)}
.w-grid th{background:#f0f0f0;font-weight:400;text-align:left;border:1px solid #dcdcdc;padding:3px 8px;white-space:nowrap;position:sticky;top:0}
.w-grid td{padding:3px 8px;border-bottom:1px solid #eee;border-right:1px solid #f0f0f0;white-space:nowrap}
.w-grid tr.sel td{background:var(--w-sel);color:var(--w-sel-fg)}
.w-grid td.r,.w-grid th.r{text-align:right}
.w-btn{background:#E1E1E1;border:1px solid #ADADAD;padding:3px 14px;min-width:78px;font-size:13px;color:var(--w-text);cursor:default;border-radius:2px}
.w-btn:hover{background:#E5F1FB;border-color:#0078D7}
.w-btn.def{border:2px solid #0078D7;padding:2px 13px}
.w-btn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.w-in{height:23px;border:1px solid #7a7a7a;background:#fff;padding:0 4px;font-size:13px;width:100%;min-width:0;color:var(--w-text)}
.w-in:disabled{background:#f0f0f0;color:#777}
.w-field{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 8px;align-items:center;margin-bottom:8px;font-size:13px}
.w-field label u{text-decoration:underline}
.w-err{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#E81123;color:#fff!important;font-size:11px;font-weight:700;cursor:help;margin-left:6px;flex:0 0 auto}
.w-cell{display:flex;align-items:center;min-width:0}
.w-ov{position:absolute;inset:30px 0 0 0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:30;padding:8px}
.w-ov.full{inset:0}
.w-dlg{background:var(--w-face);border:1px solid #555;box-shadow:0 6px 22px rgba(0,0,0,.45);width:min(100%,430px);max-height:100%;overflow:auto}
.w-dlg .w-t{height:28px}
.w-msg{display:flex;gap:14px;padding:18px 16px;background:#fff;font-size:13px;align-items:flex-start}
.w-msg .mi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;font-size:18px}
.w-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;background:var(--w-face)}
.w-nores{position:absolute;inset:0;background:rgba(255,255,255,.55);display:grid;place-items:center;z-index:25;color:#111;font-size:13px;text-align:center;padding:12px}
.closed{padding:40px 16px;text-align:center;background:var(--w-face);color:#333;font-size:14px}

/* ---------- explorador de soluciones ---------- */
.se{background:var(--w-white);border:1px solid var(--w-border);color:var(--w-text);padding:8px 6px;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:260px;overflow:auto}
.se ul{list-style:none;margin:0;padding-left:16px}
.se>ul{padding-left:2px}
.se li{padding:2px 4px;border-radius:3px;display:flex;flex-direction:column}
.se .it{display:flex;gap:6px;align-items:center;padding:1px 4px;border-radius:3px}
.se .it.new{background:#CCE8FF;animation:pop .9s ease-out 1}
.se .it.gone{text-decoration:line-through;color:#999}
.se .ico{width:14px;display:inline-block;text-align:center;font-size:12px}
@keyframes pop{from{background:#7CC4FF}to{background:#CCE8FF}}
@media (prefers-reduced-motion:reduce){.se .it.new{animation:none}.prog-bar i{transition:none}}

/* ---------- lista de comprobación y errores ---------- */
.check{border-top:1px solid var(--line);padding-top:12px}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.check input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent-line)}
details.err{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0}
details.err summary{padding:10px 14px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.err summary code{background:var(--bad-soft);color:var(--bad);padding:0 6px;border-radius:5px}
details.err .body{padding:0 14px 12px;color:var(--fg)}
.errs{display:flex;flex-direction:column;gap:8px}
footer{max-width:1040px;margin:0 auto;padding:0 16px 48px;color:var(--muted);font-size:.9rem}

/* ---------- extensiones: comparaciones, ejercitación y BOA ---------- */
:root{--w-low:#FFB35C;--w-icon-warn:#B86E00}
.stage.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.w-grid tr.low:not(.sel) td{background:var(--w-low)}
.sbtn.ghost[aria-pressed="true"]{background:var(--accent-soft)}
.tlp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px;font-size:13px}
.tlp .w-in{width:100%}
.flp{display:flex;flex-wrap:wrap;gap:6px 10px;padding:8px;font-size:13px}
.flp.nowrap{flex-wrap:nowrap;overflow:hidden}
.flp>span{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}
.flp .w-in{width:72px}
.ex-lv{display:flex;flex-direction:column;gap:12px}
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.ex-big{display:grid;gap:18px}
.boa-sel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px}

const FILES = {"AgroStock.E02.csproj": {"lang": "xml", "src": "<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n    <!-- WinExe = aplicación con ventanas: al ejecutarla no se abre una consola negra detrás. -->\n    <OutputType>WinExe</OutputType>\n    <!-- Versión de .NET para Windows con la que se compila el proyecto (la misma del Encuentro 1). -->\n    <TargetFramework>net8.0-windows</TargetFramework>\n    <!-- Advertencias de nulos: string? admite null y string no. -->\n    <Nullable>enable</Nullable>\n    <!-- Agrega automáticamente los using más comunes (System, System.IO, System.Linq, System.Threading.Tasks...). -->\n    <ImplicitUsings>enable</ImplicitUsings>\n    <!-- Incluye Windows Forms: formularios, controles y los using System.Windows.Forms y System.Drawing. -->\n    <UseWindowsForms>true</UseWindowsForms>\n  </PropertyGroup>\n\n  <ItemGroup>\n    <!-- Proveedor ADO.NET de SQLite. Lo agrega NuGet al instalar el paquete Microsoft.Data.Sqlite. -->\n    <PackageReference Include=\"Microsoft.Data.Sqlite\" Version=\"8.0.10\" />\n  </ItemGroup>\n\n  <ItemGroup>\n    <!-- Estos archivos están en la carpeta del proyecto, pero el programa corre desde bin\\Debug\\net8.0-windows\\. -->\n    <!-- PreserveNewest los copia junto al .exe para que Db.Inicializar() y FrmImportar los encuentren. -->\n    <!-- agrostock.db NO se lista: la crea Db.Inicializar() desde agrostock.sql la primera vez que se ejecuta la aplicación. -->\n    <None Update=\"agrostock.sql\" CopyToOutputDirectory=\"PreserveNewest\" />\n    <None Update=\"productos_importar.csv\" CopyToOutputDirectory=\"PreserveNewest\" />\n  </ItemGroup>\n\n  <!-- OPCIONAL, solo si la carpeta DemoHilos quedó DENTRO de esta carpeta (no se recomienda: error CS0579). -->\n  <!-- Para activarlo, borre el marcador de comentario del inicio y del final de cada una de las cinco líneas siguientes. -->\n  <!-- <ItemGroup> -->\n  <!--   <Compile Remove=\"DemoHilos\\**\" /> -->\n  <!--   <None Remove=\"DemoHilos\\**\" /> -->\n  <!--   <EmbeddedResource Remove=\"DemoHilos\\**\" /> -->\n  <!-- </ItemGroup> -->\n\n</Project>\n"}, "Program.cs": {"lang": "cs", "src": "// El espacio de nombres coincide con el nombre del proyecto: AgroStock.E02.\nusing AgroStock.E02.Data;\n\nnamespace AgroStock.E02;\n\ninternal static class Program\n{\n    // [STAThread]: la interfaz gráfica corre en un único hilo (el hilo de la interfaz). Windows lo exige.\n    [STAThread]\n    private static void Main()\n    {\n        // Prepara estilos visuales, escala para pantallas de alta resolución y fuente por defecto.\n        ApplicationConfiguration.Initialize();\n\n        // NUEVO en v2: antes de mostrar la ventana se verifica que la base exista.\n        // Si no existe, Db.Inicializar() la crea ejecutando agrostock.sql.\n        try\n        {\n            Db.Inicializar();\n        }\n        catch (Exception ex)\n        {\n            // Sin base de datos la aplicación no tiene sentido: se avisa y se sale sin abrir la ventana.\n            MessageBox.Show(\"No se pudo abrir la base de datos:\\n\" + ex.Message, \"AgroStock\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n            return;\n        }\n\n        // Muestra el formulario principal e inicia el bucle de mensajes (igual que en v1).\n        Application.Run(new Forms.FrmPrincipal());\n    }\n}\n"}, "Models/Producto.cs": {"lang": "cs", "src": "// Las clases del dominio (los datos del negocio) van en la carpeta Models.\nnamespace AgroStock.E02.Models;\n\n// Un Producto representa una fila de la tabla productos de agrostock.db.\npublic class Producto\n{\n    // NUEVO en v2: Id es la clave primaria (PK) que asigna la base de datos. 0 significa \"todavía no guardado\".\n    public int Id { get; set; }\n\n    // Código corto y único (UNIQUE en la tabla), por ejemplo FER-001.\n    public string Codigo { get; set; } = \"\";\n\n    public string Nombre { get; set; } = \"\";\n\n    // NUEVO en v2: la tabla guarda la clave foránea (FK) categoria_id, no el nombre de la categoría.\n    public int CategoriaId { get; set; }\n\n    // Nombre de la categoría, traído con un JOIN para mostrarlo en la cuadrícula.\n    public string Categoria { get; set; } = \"\";\n\n    // decimal en C#; en SQLite se guarda como REAL.\n    public decimal Precio { get; set; }\n\n    public int Existencia { get; set; }\n\n    // DateTime? admite null: no todo producto vence. En la base es un TEXT con formato yyyy-MM-dd.\n    public DateTime? Vencimiento { get; set; }\n}\n\n// Una Categoria es una fila de la tabla categorias. \"record\" genera Equals, ToString y propiedades de solo lectura.\npublic record Categoria(int Id, string Nombre)\n{\n    // ToString lo usa un ComboBox para mostrar el texto cuando no se indica DisplayMember.\n    public override string ToString() => Nombre;\n}\n"}, "Data/Db.cs": {"lang": "cs", "src": "// Microsoft.Data.Sqlite es el proveedor ADO.NET: traduce las llamadas de C# a instrucciones para el motor SQLite.\nusing Microsoft.Data.Sqlite;\n\nnamespace AgroStock.E02.Data;\n\n// Clase estática: no se crean objetos de ella. Concentra TODO lo que tiene que ver con la conexión.\npublic static class Db\n{\n    // La base es un solo archivo junto al .exe. AppContext.BaseDirectory evita depender de la carpeta de trabajo.\n    public static readonly string Ruta = Path.Combine(AppContext.BaseDirectory, \"agrostock.db\");\n\n    // Cadena de conexión: para SQLite solo indica el archivo (Data Source). El constructor la arma sin errores de tipeo.\n    private static string Cadena => new SqliteConnectionStringBuilder { DataSource = Ruta }.ToString();\n\n    // Abre una conexión nueva. Quien la llama debe liberarla con \"using\" para que se cierre siempre.\n    public static SqliteConnection Abrir()\n    {\n        var cn = new SqliteConnection(Cadena);\n        // Open crea el archivo vacío si no existía.\n        cn.Open();\n\n        // DB Browser y la consola sqlite3 traen las claves foráneas DESACTIVADAS. Microsoft.Data.Sqlite normalmente\n        // las activa, pero no se debe depender de eso. Por eso Abrir() ejecuta SIEMPRE PRAGMA foreign_keys = ON; en cada conexión.\n        using var cmd = cn.CreateCommand();\n        cmd.CommandText = \"PRAGMA foreign_keys = ON;\";\n        cmd.ExecuteNonQuery();\n        return cn;\n    }\n\n    // Crea la base la primera vez: ejecuta agrostock.sql (tablas + datos de ejemplo).\n    public static void Inicializar()\n    {\n        // Si el archivo ya existe se conserva: no se pisan los datos del usuario.\n        // Si quedó vacío o incompleto (\"no such table\"), bórrelo de bin\\Debug\\net8.0-windows\\ y vuelva a ejecutar.\n        if (File.Exists(Ruta)) return;\n\n        var script = File.ReadAllText(Path.Combine(AppContext.BaseDirectory, \"agrostock.sql\"));\n        using var cn = Abrir();\n        using var cmd = cn.CreateCommand();\n        // El proveedor ejecuta todas las sentencias del script, una tras otra, en una sola llamada.\n        cmd.CommandText = script;\n        cmd.ExecuteNonQuery();\n    }\n}\n"}, "Data/ProductoRepository.cs": {"lang": "cs", "src": "using System.Globalization;\nusing Microsoft.Data.Sqlite;\nusing AgroStock.E02.Models;\n\nnamespace AgroStock.E02.Data;\n\n// PATRÓN REPOSITORIO: todo el SQL de AgroStock vive en esta clase.\n// Los formularios solo llaman a Listar, Insertar, Actualizar y Eliminar; no saben qué motor hay debajo.\npublic class ProductoRepository\n{\n    // Consulta base reutilizada por Listar. El JOIN trae el nombre de la categoría junto a cada producto.\n    private const string SelectBase =\n        \"SELECT p.id, p.codigo, p.nombre, p.categoria_id, c.nombre, p.precio, p.existencia, p.vencimiento \" +\n        \"FROM productos p JOIN categorias c ON c.id = p.categoria_id\";\n\n    // ---------------------------------------------------------------- Read\n\n    // Devuelve los productos cuyo código o nombre contienen el texto buscado.\n    public List<Producto> Listar(string filtro = \"\")\n    {\n        // using: la conexión y el comando se liberan SIEMPRE, aunque ocurra una excepción.\n        using var cn = Db.Abrir();\n        using var cmd = cn.CreateCommand();\n        cmd.CommandText = SelectBase + \" WHERE p.nombre LIKE $f OR p.codigo LIKE $f ORDER BY p.nombre\";\n        // Parámetro: el valor viaja separado del SQL. NUNCA se concatena lo que escribe el usuario.\n        cmd.Parameters.AddWithValue(\"$f\", $\"%{filtro}%\");\n\n        var lista = new List<Producto>();\n        // ExecuteReader devuelve un lector que recorre las filas hacia adelante, una por una.\n        using var rd = cmd.ExecuteReader();\n        while (rd.Read())\n        {\n            lista.Add(new Producto\n            {\n                Id = rd.GetInt32(0),\n                Codigo = rd.GetString(1),\n                Nombre = rd.GetString(2),\n                CategoriaId = rd.GetInt32(3),\n                Categoria = rd.GetString(4),\n                // REAL de SQLite -> double -> decimal. Se convierte aquí para que el resto del programa use decimal.\n                Precio = Convert.ToDecimal(rd.GetDouble(5)),\n                Existencia = rd.GetInt32(6),\n                // Vencimiento puede ser NULL en la base: IsDBNull evita una excepción al leerlo.\n                Vencimiento = rd.IsDBNull(7) ? null : DateTime.ParseExact(rd.GetString(7), \"yyyy-MM-dd\", CultureInfo.InvariantCulture)\n            });\n        }\n        return lista;\n    }\n\n    // Categorías para llenar el ComboBox de FrmProducto.\n    public List<Categoria> Categorias()\n    {\n        using var cn = Db.Abrir();\n        using var cmd = cn.CreateCommand();\n        cmd.CommandText = \"SELECT id, nombre FROM categorias ORDER BY nombre\";\n        var lista = new List<Categoria>();\n        using var rd = cmd.ExecuteReader();\n        while (rd.Read()) lista.Add(new Categoria(rd.GetInt32(0), rd.GetString(1)));\n        return lista;\n    }\n\n    // ---------------------------------------------------------------- Create\n\n    // cn y tx son opcionales: FrmImportar pasa SU conexión y SU transacción para que todas las\n    // inserciones se confirmen (o se descarten) juntas. Si no se pasan, el método abre una conexión propia.\n    public void Insertar(Producto p, SqliteConnection? cn = null, SqliteTransaction? tx = null)\n    {\n        var propia = cn is null;\n        cn ??= Db.Abrir();\n        try\n        {\n            using var cmd = cn.CreateCommand();\n            // Desde Microsoft.Data.Sqlite 6, si la conexión tiene una transacción abierta el comando debe declararla.\n            cmd.Transaction = tx;\n            cmd.CommandText =\n                \"INSERT INTO productos (codigo, nombre, categoria_id, precio, existencia, vencimiento) \" +\n                \"VALUES ($cod, $nom, $cat, $pre, $exi, $ven)\";\n            AgregarParametros(cmd, p);\n            cmd.ExecuteNonQuery();   // INSERT no devuelve filas: se usa ExecuteNonQuery\n        }\n        finally\n        {\n            // Solo se cierra la conexión si este método la abrió; la ajena la cierra quien la creó.\n            if (propia) cn.Dispose();\n        }\n    }\n\n    // ---------------------------------------------------------------- Update\n\n    public void Actualizar(Producto p)\n    {\n        using var cn = Db.Abrir();\n        using var cmd = cn.CreateCommand();\n        // El WHERE id = $id es obligatorio: sin él se cambiarían TODOS los productos.\n        cmd.CommandText =\n            \"UPDATE productos SET codigo = $cod, nombre = $nom, categoria_id = $cat, \" +\n            \"precio = $pre, existencia = $exi, vencimiento = $ven WHERE id = $id\";\n        AgregarParametros(cmd, p);\n        cmd.Parameters.AddWithValue(\"$id\", p.Id);\n        cmd.ExecuteNonQuery();\n    }\n\n    // ---------------------------------------------------------------- Delete\n\n    public void Eliminar(int id)\n    {\n        using var cn = Db.Abrir();\n        using var cmd = cn.CreateCommand();\n        // Si el producto tiene movimientos, la clave foránea lo impide y SQLite lanza SqliteException (19).\n        cmd.CommandText = \"DELETE FROM productos WHERE id = $id\";\n        cmd.Parameters.AddWithValue(\"$id\", id);\n        cmd.ExecuteNonQuery();\n    }\n\n    // ---------------------------------------------------------------- Movimientos (transacción)\n\n    // Registra una ENTRADA o SALIDA y ajusta la existencia. Las dos sentencias forman UNA transacción:\n    // o se guardan las dos o no se guarda ninguna.\n    public void RegistrarMovimiento(int productoId, string tipo, int cantidad)\n    {\n        using var cn = Db.Abrir();\n        // BeginTransaction: a partir de aquí nada es definitivo hasta llamar a Commit.\n        using var tx = cn.BeginTransaction();\n\n        using (var ins = cn.CreateCommand())\n        {\n            ins.Transaction = tx;\n            // date('now') da la fecha UTC; en Nicaragua (UTC-6) después de las 6 p. m. daría el día siguiente.\n            // Con 'localtime' se guarda la fecha local de la computadora.\n            ins.CommandText = \"INSERT INTO movimientos (producto_id, tipo, cantidad, fecha) VALUES ($p, $t, $c, date('now', 'localtime'))\";\n            ins.Parameters.AddWithValue(\"$p\", productoId);\n            ins.Parameters.AddWithValue(\"$t\", tipo);\n            ins.Parameters.AddWithValue(\"$c\", cantidad);\n            ins.ExecuteNonQuery();\n        }\n\n        using (var upd = cn.CreateCommand())\n        {\n            upd.Transaction = tx;\n            // Una SALIDA resta; una ENTRADA suma. Si la existencia quedara negativa, CHECK (existencia >= 0) falla.\n            upd.CommandText = \"UPDATE productos SET existencia = existencia + $delta WHERE id = $p\";\n            upd.Parameters.AddWithValue(\"$delta\", tipo == \"ENTRADA\" ? cantidad : -cantidad);\n            upd.Parameters.AddWithValue(\"$p\", productoId);\n            upd.ExecuteNonQuery();\n        }\n\n        // Todo salió bien: se confirman las dos operaciones.\n        // Si arriba hubo una excepción, Commit nunca se ejecuta y al liberar \"tx\" SQLite hace Rollback solo.\n        tx.Commit();\n    }\n\n    // ---------------------------------------------------------------- auxiliar\n\n    // Agrega los parámetros comunes de INSERT y UPDATE. Un solo lugar = un solo cambio si la tabla cambia.\n    private static void AgregarParametros(SqliteCommand cmd, Producto p)\n    {\n        cmd.Parameters.AddWithValue(\"$cod\", p.Codigo);\n        cmd.Parameters.AddWithValue(\"$nom\", p.Nombre);\n        cmd.Parameters.AddWithValue(\"$cat\", p.CategoriaId);\n        cmd.Parameters.AddWithValue(\"$pre\", (double)p.Precio);\n        cmd.Parameters.AddWithValue(\"$exi\", p.Existencia);\n        // Si no vence se envía DBNull.Value: así la columna queda en NULL y no en un texto vacío.\n        cmd.Parameters.AddWithValue(\"$ven\", (object?)p.Vencimiento?.ToString(\"yyyy-MM-dd\") ?? DBNull.Value);\n    }\n}\n"}, "Forms/FrmProducto.cs": {"lang": "cs", "src": "// Models: Producto y Categoria. Los formularios no conocen SQL: solo reciben y entregan objetos.\nusing AgroStock.E02.Models;\n\nnamespace AgroStock.E02.Forms;\n\n// Formulario modal para capturar o editar un producto (el mismo de v1, ahora con categorías de la base).\npublic partial class FrmProducto : Form\n{\n    // Producto con el que trabaja el diálogo. Quien lo abre lo recibe de vuelta ya lleno.\n    public Producto Producto { get; }\n\n    // NUEVO en v2: las categorías vienen de la tabla categorias, no de una lista fija en el código.\n    private readonly List<Categoria> categorias;\n\n    public FrmProducto(Producto producto, List<Categoria> categorias)\n    {\n        InitializeComponent();\n        Producto = producto;\n        this.categorias = categorias;\n\n        Load += FrmProducto_Load;\n        txtCodigo.KeyPress += TxtCodigo_KeyPress;\n        btnGuardar.Click += BtnGuardar_Click;\n    }\n\n    private void FrmProducto_Load(object? sender, EventArgs e)\n    {\n        // DataSource enlaza el ComboBox con la lista de objetos Categoria.\n        cboCategoria.DataSource = categorias;\n        // DisplayMember = lo que el usuario VE; ValueMember = lo que el programa USA (la clave foránea).\n        cboCategoria.DisplayMember = nameof(Categoria.Nombre);\n        cboCategoria.ValueMember = nameof(Categoria.Id);\n        // Sin esto el ComboBox seleccionaría la primera categoría y un producto nuevo quedaría \"elegido\" sin querer.\n        cboCategoria.SelectedIndex = -1;\n\n        Text = Producto.Id == 0 ? \"Nuevo producto\" : \"Editar producto\";\n        txtCodigo.Text = Producto.Codigo;\n        txtNombre.Text = Producto.Nombre;\n        // Al editar, SelectedValue busca la categoría cuyo Id coincide con la clave foránea del producto.\n        if (Producto.CategoriaId != 0) cboCategoria.SelectedValue = Producto.CategoriaId;\n        nudPrecio.Value = Producto.Precio;\n        nudExistencia.Value = Producto.Existencia;\n        if (Producto.Vencimiento.HasValue)\n        {\n            dtpVencimiento.Value = Producto.Vencimiento.Value;\n            dtpVencimiento.Checked = true;\n        }\n    }\n\n    // Igual que en v1: solo letras, dígitos y guion, siempre en mayúscula.\n    private void TxtCodigo_KeyPress(object? sender, KeyPressEventArgs e)\n    {\n        if (char.IsControl(e.KeyChar)) return;\n        if (!char.IsLetterOrDigit(e.KeyChar) && e.KeyChar != '-')\n        {\n            e.Handled = true;\n            return;\n        }\n        e.KeyChar = char.ToUpperInvariant(e.KeyChar);\n    }\n\n    private void BtnGuardar_Click(object? sender, EventArgs e)\n    {\n        errores.Clear();\n        bool valido = true;\n\n        // La validación de la interfaz avisa AL USUARIO; las restricciones de la base (NOT NULL, UNIQUE, CHECK)\n        // son la última defensa. Se hacen las dos: la primera es amable, la segunda es segura.\n        if (txtCodigo.Text.Trim().Length < 3)\n        {\n            errores.SetError(txtCodigo, \"Escriba al menos 3 caracteres.\");\n            valido = false;\n        }\n        if (txtNombre.Text.Trim().Length < 3)\n        {\n            errores.SetError(txtNombre, \"Escriba al menos 3 caracteres.\");\n            valido = false;\n        }\n        if (cboCategoria.SelectedValue is null)\n        {\n            errores.SetError(cboCategoria, \"Elija una categoría.\");\n            valido = false;\n        }\n        if (nudPrecio.Value <= 0)\n        {\n            errores.SetError(nudPrecio, \"El precio debe ser mayor que cero.\");\n            valido = false;\n        }\n        if (!valido) return;\n\n        Producto.Codigo = txtCodigo.Text.Trim();\n        Producto.Nombre = txtNombre.Text.Trim();\n        // SelectedValue es object?: se convierte a int porque ValueMember es Id.\n        Producto.CategoriaId = (int)cboCategoria.SelectedValue!;\n        Producto.Precio = nudPrecio.Value;\n        Producto.Existencia = (int)nudExistencia.Value;\n        Producto.Vencimiento = dtpVencimiento.Checked ? dtpVencimiento.Value.Date : null;\n\n        DialogResult = DialogResult.OK;\n    }\n}\n"}, "Forms/FrmProducto.Designer.cs": {"lang": "cs", "src": "#nullable enable\n// Igual que en v1: este diseñador NO cambió. Solo se actualizó el namespace a AgroStock.E02.Forms.\n// cboCategoria usa DropDownStyle = DropDownList (solo se puede elegir una categoría de la lista, no escribir otra).\nnamespace AgroStock.E02.Forms;\n\npartial class FrmProducto\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    private ErrorProvider errores = null!;\n    private Label lblCodigo = null!;\n    private TextBox txtCodigo = null!;\n    private Label lblNombre = null!;\n    private TextBox txtNombre = null!;\n    private Label lblCategoria = null!;\n    private ComboBox cboCategoria = null!;\n    private Label lblPrecio = null!;\n    private NumericUpDown nudPrecio = null!;\n    private Label lblExistencia = null!;\n    private NumericUpDown nudExistencia = null!;\n    private Label lblVencimiento = null!;\n    private DateTimePicker dtpVencimiento = null!;\n    private Button btnGuardar = null!;\n    private Button btnCancelar = null!;\n\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && components != null) components.Dispose();\n        base.Dispose(disposing);\n    }\n\n    private void InitializeComponent()\n    {\n        components = new System.ComponentModel.Container();\n        errores = new ErrorProvider(components);\n        lblCodigo = new Label();\n        txtCodigo = new TextBox();\n        lblNombre = new Label();\n        txtNombre = new TextBox();\n        lblCategoria = new Label();\n        cboCategoria = new ComboBox();\n        lblPrecio = new Label();\n        nudPrecio = new NumericUpDown();\n        lblExistencia = new Label();\n        nudExistencia = new NumericUpDown();\n        lblVencimiento = new Label();\n        dtpVencimiento = new DateTimePicker();\n        btnGuardar = new Button();\n        btnCancelar = new Button();\n        ((System.ComponentModel.ISupportInitialize)errores).BeginInit();\n        ((System.ComponentModel.ISupportInitialize)nudPrecio).BeginInit();\n        ((System.ComponentModel.ISupportInitialize)nudExistencia).BeginInit();\n        SuspendLayout();\n\n        // errores: muestra el ícono rojo junto al control inválido (errores.SetError)\n        errores.ContainerControl = this;\n\n        lblCodigo.AutoSize = true;\n        lblCodigo.Location = new Point(20, 23);\n        lblCodigo.Name = \"lblCodigo\";\n        lblCodigo.Text = \"&Código:\";\n        txtCodigo.Location = new Point(130, 20);\n        txtCodigo.MaxLength = 20;\n        txtCodigo.Name = \"txtCodigo\";\n        txtCodigo.Size = new Size(150, 23);\n        txtCodigo.TabIndex = 1;\n\n        lblNombre.AutoSize = true;\n        lblNombre.Location = new Point(20, 58);\n        lblNombre.Name = \"lblNombre\";\n        lblNombre.Text = \"&Nombre:\";\n        txtNombre.Location = new Point(130, 55);\n        txtNombre.MaxLength = 80;\n        txtNombre.Name = \"txtNombre\";\n        txtNombre.Size = new Size(280, 23);\n        txtNombre.TabIndex = 3;\n\n        lblCategoria.AutoSize = true;\n        lblCategoria.Location = new Point(20, 93);\n        lblCategoria.Name = \"lblCategoria\";\n        lblCategoria.Text = \"C&ategoría:\";\n        cboCategoria.DropDownStyle = ComboBoxStyle.DropDownList;\n        cboCategoria.Location = new Point(130, 90);\n        cboCategoria.Name = \"cboCategoria\";\n        cboCategoria.Size = new Size(200, 23);\n        cboCategoria.TabIndex = 5;\n\n        lblPrecio.AutoSize = true;\n        lblPrecio.Location = new Point(20, 128);\n        lblPrecio.Name = \"lblPrecio\";\n        lblPrecio.Text = \"&Precio (C$):\";\n        nudPrecio.DecimalPlaces = 2;\n        nudPrecio.Location = new Point(130, 125);\n        nudPrecio.Maximum = 1000000M;\n        nudPrecio.Name = \"nudPrecio\";\n        nudPrecio.Size = new Size(120, 23);\n        nudPrecio.TabIndex = 7;\n        nudPrecio.ThousandsSeparator = true;\n\n        lblExistencia.AutoSize = true;\n        lblExistencia.Location = new Point(20, 163);\n        lblExistencia.Name = \"lblExistencia\";\n        lblExistencia.Text = \"&Existencia:\";\n        nudExistencia.Location = new Point(130, 160);\n        nudExistencia.Maximum = 100000M;\n        nudExistencia.Name = \"nudExistencia\";\n        nudExistencia.Size = new Size(120, 23);\n        nudExistencia.TabIndex = 9;\n\n        lblVencimiento.AutoSize = true;\n        lblVencimiento.Location = new Point(20, 198);\n        lblVencimiento.Name = \"lblVencimiento\";\n        lblVencimiento.Text = \"&Vencimiento:\";\n        // ShowCheckBox: sin marcar significa \"no vence\" (la columna vencimiento queda en NULL)\n        dtpVencimiento.Format = DateTimePickerFormat.Short;\n        dtpVencimiento.Location = new Point(130, 195);\n        dtpVencimiento.Name = \"dtpVencimiento\";\n        dtpVencimiento.ShowCheckBox = true;\n        dtpVencimiento.Size = new Size(140, 23);\n        dtpVencimiento.TabIndex = 11;\n\n        btnGuardar.Location = new Point(240, 250);\n        btnGuardar.Name = \"btnGuardar\";\n        btnGuardar.Size = new Size(85, 30);\n        btnGuardar.TabIndex = 12;\n        btnGuardar.Text = \"&Guardar\";\n        btnCancelar.DialogResult = DialogResult.Cancel;\n        btnCancelar.Location = new Point(335, 250);\n        btnCancelar.Name = \"btnCancelar\";\n        btnCancelar.Size = new Size(85, 30);\n        btnCancelar.TabIndex = 13;\n        btnCancelar.Text = \"Cancelar\";\n\n        AcceptButton = btnGuardar;\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        CancelButton = btnCancelar;\n        ClientSize = new Size(440, 300);\n        Controls.AddRange(new Control[] { lblCodigo, txtCodigo, lblNombre, txtNombre, lblCategoria, cboCategoria,\n            lblPrecio, nudPrecio, lblExistencia, nudExistencia, lblVencimiento, dtpVencimiento, btnGuardar, btnCancelar });\n        FormBorderStyle = FormBorderStyle.FixedDialog;\n        MaximizeBox = false;\n        MinimizeBox = false;\n        Name = \"FrmProducto\";\n        ShowInTaskbar = false;\n        StartPosition = FormStartPosition.CenterParent;\n        Text = \"Producto\";\n        ((System.ComponentModel.ISupportInitialize)errores).EndInit();\n        ((System.ComponentModel.ISupportInitialize)nudPrecio).EndInit();\n        ((System.ComponentModel.ISupportInitialize)nudExistencia).EndInit();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n}\n"}, "Forms/FrmPrincipal.cs": {"lang": "cs", "src": "using System.Globalization;\nusing System.Text;\nusing Microsoft.Data.Sqlite;\nusing AgroStock.E02.Data;\nusing AgroStock.E02.Models;\n\nnamespace AgroStock.E02.Forms;\n\n// Ventana principal de AgroStock v2. La interfaz es la misma de v1; lo que cambia es de dónde salen los datos.\npublic partial class FrmPrincipal : Form\n{\n    // CAMBIO v1 -> v2: la BindingList<Producto> en memoria se reemplaza por el repositorio (la base de datos).\n    private readonly ProductoRepository repo = new();\n\n    // BindingSource: intermediario entre la lista de datos y la cuadrícula. Conoce el elemento actual (Current).\n    private readonly BindingSource fuente = new();\n\n    public FrmPrincipal()\n    {\n        InitializeComponent();\n        ConfigurarCuadricula();\n        SuscribirEventos();\n        // El reloj muestra la hora desde el primer instante, sin esperar el primer Tick del temporizador.\n        ActualizarReloj();\n    }\n\n    // ---------------------------------------------------------------- configuración inicial\n\n    private void ConfigurarCuadricula()\n    {\n        dgvProductos.AutoGenerateColumns = false;\n        // La cuadrícula se enlaza UNA vez al BindingSource; después solo se cambia el DataSource de este.\n        dgvProductos.DataSource = fuente;\n\n        dgvProductos.Columns.Add(NuevaColumna(\"Código\", nameof(Producto.Codigo), 110));\n        dgvProductos.Columns.Add(NuevaColumna(\"Nombre\", nameof(Producto.Nombre), 220));\n        dgvProductos.Columns.Add(NuevaColumna(\"Categoría\", nameof(Producto.Categoria), 120));\n        dgvProductos.Columns.Add(NuevaColumna(\"Precio (C$)\", nameof(Producto.Precio), 100));\n        dgvProductos.Columns.Add(NuevaColumna(\"Existencia\", nameof(Producto.Existencia), 90));\n        dgvProductos.Columns.Add(NuevaColumna(\"Vencimiento\", nameof(Producto.Vencimiento), 110));\n        dgvProductos.Columns[3].DefaultCellStyle.Format = \"N2\";\n        dgvProductos.Columns[5].DefaultCellStyle.Format = \"dd/MM/yyyy\";\n        dgvProductos.Columns[1].AutoSizeMode = DataGridViewAutoSizeColumnMode.Fill;\n    }\n\n    private static DataGridViewTextBoxColumn NuevaColumna(string titulo, string propiedad, int ancho) => new()\n    {\n        Name = \"col\" + propiedad,\n        HeaderText = titulo,\n        DataPropertyName = propiedad,\n        Width = ancho\n    };\n\n    private void SuscribirEventos()\n    {\n        // Load: la primera lectura de la base ocurre cuando la ventana va a mostrarse.\n        Load += (_, _) => Cargar();\n\n        // La misma acción desde el menú, la barra y el teclado (como en v1).\n        mnuNuevo.Click += (_, _) => Nuevo();\n        tsbNuevo.Click += (_, _) => Nuevo();\n        mnuEditarProducto.Click += (_, _) => Editar();\n        tsbEditar.Click += (_, _) => Editar();\n        mnuEliminar.Click += (_, _) => Eliminar();\n        tsbEliminar.Click += (_, _) => Eliminar();\n\n        // NUEVO en v2: movimientos e importación.\n        mnuMovimiento.Click += (_, _) => RegistrarMovimiento();\n        tsbMovimiento.Click += (_, _) => RegistrarMovimiento();\n        mnuImportar.Click += (_, _) => Importar();\n\n        // Como en v1: Exportar, Acerca de y el reloj (tmrReloj dispara Tick cada segundo).\n        mnuExportar.Click += (_, _) => ExportarCsv();\n        mnuAcercaDe.Click += (_, _) => MostrarAcercaDe();\n        tmrReloj.Tick += (_, _) => ActualizarReloj();\n\n        mnuSalir.Click += (_, _) => Close();\n        dgvProductos.CellDoubleClick += (_, e) => { if (e.RowIndex >= 0) Editar(); };\n\n        // La búsqueda ahora la hace la base con LIKE, no un filtro en memoria. Cada tecla repite la consulta.\n        txtBuscar.TextChanged += (_, _) => Cargar();\n        FormClosing += FrmPrincipal_FormClosing;\n    }\n\n    // ---------------------------------------------------------------- Read\n\n    // Vuelve a leer los productos de la base y los muestra. Se llama al abrir y después de cada cambio.\n    private void Cargar()\n    {\n        try\n        {\n            fuente.DataSource = repo.Listar(txtBuscar.Text.Trim());\n            tslTotal.Text = $\"Productos: {fuente.Count}\";\n        }\n        catch (SqliteException ex)\n        {\n            MessageBox.Show(this, \"No se pudo leer la base de datos:\\n\" + ex.Message, \"AgroStock\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n\n    // ---------------------------------------------------------------- Create, Update, Delete\n\n    private void Nuevo()\n    {\n        var p = new Producto();\n        using var dlg = new FrmProducto(p, repo.Categorias());\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n        Ejecutar(() => repo.Insertar(p), p.Codigo);\n    }\n\n    private void Editar()\n    {\n        // fuente.Current es el objeto de la fila seleccionada; \"as\" lo convierte o deja null si no hay fila.\n        if (fuente.Current is not Producto p)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        using var dlg = new FrmProducto(p, repo.Categorias());\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n        Ejecutar(() => repo.Actualizar(p), p.Codigo);\n    }\n\n    private void Eliminar()\n    {\n        if (fuente.Current is not Producto p)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        var r = MessageBox.Show(this, $\"¿Eliminar «{p.Nombre}»?\", \"Confirmar eliminación\",\n            MessageBoxButtons.YesNo, MessageBoxIcon.Question, MessageBoxDefaultButton.Button2);\n        if (r == DialogResult.Yes) Ejecutar(() => repo.Eliminar(p.Id), p.Codigo);\n    }\n\n    // Un solo lugar para ejecutar una operación de escritura y traducir los errores de SQLite a mensajes claros.\n    private void Ejecutar(Action operacion, string codigo)\n    {\n        try\n        {\n            operacion();\n        }\n        // 2067 = SQLITE_CONSTRAINT_UNIQUE: ya existe otro producto con ese código.\n        catch (SqliteException ex) when (ex.SqliteExtendedErrorCode == 2067)\n        {\n            MessageBox.Show(this, $\"El código {codigo} ya existe.\", \"No se guardó\",\n                MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        }\n        // 787 = SQLITE_CONSTRAINT_FOREIGNKEY: el producto tiene movimientos y no puede eliminarse.\n        catch (SqliteException ex) when (ex.SqliteExtendedErrorCode == 787)\n        {\n            MessageBox.Show(this, \"No se puede eliminar: el producto tiene movimientos registrados.\", \"No se eliminó\",\n                MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        }\n        // Cualquier otro error de la base: se muestra el mensaje y el programa sigue vivo.\n        catch (SqliteException ex)\n        {\n            MessageBox.Show(this, \"Error de base de datos:\\n\" + ex.Message, \"AgroStock\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n        finally\n        {\n            // Pase lo que pase se relee la base: la cuadrícula siempre muestra lo que realmente está guardado.\n            Cargar();\n        }\n    }\n\n    // ---------------------------------------------------------------- movimientos e importación\n\n    private void RegistrarMovimiento()\n    {\n        if (fuente.Current is not Producto p)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        using var dlg = new FrmMovimiento(repo, p);\n        if (dlg.ShowDialog(this) == DialogResult.OK) Cargar();\n    }\n\n    private void Importar()\n    {\n        using var dlg = new FrmImportar(repo);\n        dlg.ShowDialog(this);\n        // La importación pudo agregar productos: se relee la base.\n        Cargar();\n    }\n\n    // ---------------------------------------------------------------- exportar, acerca de y reloj (como en v1)\n\n    // Guarda en un CSV lo que hay en la BASE DE DATOS (en v1 salía de la lista en memoria).\n    private void ExportarCsv()\n    {\n        using var dlg = new SaveFileDialog\n        {\n            Filter = \"Archivo CSV (*.csv)|*.csv\",\n            FileName = \"inventario.csv\",\n            Title = \"Exportar inventario\"\n        };\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n\n        try\n        {\n            // StringBuilder arma todo el texto en memoria y después se escribe el archivo de una sola vez.\n            var sb = new StringBuilder();\n            // Cabecera: separador punto y coma, el mismo que usa la importación.\n            sb.AppendLine(\"Codigo;Nombre;Categoria;Precio;Existencia;Vencimiento\");\n            // CAMBIO v1 -> v2: se recorre lo que devuelve el repositorio, no una lista guardada en el formulario.\n            foreach (var p in repo.Listar())\n            {\n                sb.AppendLine(string.Join(\";\",\n                    Csv(p.Codigo),\n                    Csv(p.Nombre),\n                    Csv(p.Categoria),\n                    // InvariantCulture: punto decimal siempre, sin importar el idioma de Windows.\n                    p.Precio.ToString(\"0.00\", CultureInfo.InvariantCulture),\n                    p.Existencia.ToString(CultureInfo.InvariantCulture),\n                    // Vencimiento puede ser null: el producto que no vence deja el campo vacío.\n                    p.Vencimiento?.ToString(\"yyyy-MM-dd\", CultureInfo.InvariantCulture) ?? \"\"));\n            }\n            // UTF8Encoding(true) agrega la marca BOM: así Excel muestra bien las tildes.\n            File.WriteAllText(dlg.FileName, sb.ToString(), new UTF8Encoding(true));\n            MessageBox.Show(this, \"Inventario exportado a:\\n\" + dlg.FileName, \"Exportar\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n        // Archivo abierto en Excel, carpeta sin permiso, disco lleno...: se avisa y el programa sigue vivo.\n        catch (IOException ex)\n        {\n            MessageBox.Show(this, \"No se pudo guardar el archivo:\\n\" + ex.Message, \"Exportar\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n\n    // Un texto con comillas, punto y coma o saltos de línea no rompe el CSV si va entre comillas y duplica las internas.\n    private static string Csv(string texto) => \"\\\"\" + texto.Replace(\"\\\"\", \"\\\"\\\"\") + \"\\\"\";\n\n    private void MostrarAcercaDe()\n    {\n        MessageBox.Show(this, \"AgroStock v2\\nEncuentro 2: Bases de datos e hilos\\nUNAN-Managua, CUR Matagalpa\",\n            \"Acerca de AgroStock\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n\n    private void ActualizarReloj()\n    {\n        tslReloj.Text = DateTime.Now.ToString(\"dd/MM/yyyy HH:mm:ss\");\n    }\n\n    private void AvisarSeleccion()\n    {\n        MessageBox.Show(this, \"Seleccione primero un producto de la lista.\", \"AgroStock\",\n            MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n\n    // ---------------------------------------------------------------- cierre de la ventana\n\n    private void FrmPrincipal_FormClosing(object? sender, FormClosingEventArgs e)\n    {\n        if (e.CloseReason != CloseReason.UserClosing) return;\n        var r = MessageBox.Show(this, \"¿Desea salir de AgroStock?\", \"Salir\",\n            MessageBoxButtons.YesNo, MessageBoxIcon.Question);\n        if (r == DialogResult.No) e.Cancel = true;\n    }\n}\n"}, "Forms/FrmPrincipal.Designer.cs": {"lang": "cs", "src": "#nullable enable\n// Archivo generado por el diseñador de Visual Studio. Se regenera solo al editar el formulario: no lo modifique a mano.\n// \"#nullable enable\" (primera línea) evita la advertencia CS8669 en el campo components.\nnamespace AgroStock.E02.Forms;\n\npartial class FrmPrincipal\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    // Menú\n    private MenuStrip menuPrincipal = null!;\n    private ToolStripMenuItem mnuArchivo = null!;\n    private ToolStripMenuItem mnuNuevo = null!;\n    private ToolStripMenuItem mnuImportar = null!;        // NUEVO en v2\n    private ToolStripMenuItem mnuExportar = null!;\n    private ToolStripSeparator sepArchivo = null!;\n    private ToolStripMenuItem mnuSalir = null!;\n    private ToolStripMenuItem mnuEditar = null!;\n    private ToolStripMenuItem mnuEditarProducto = null!;\n ;\n        tsbEliminar = new ToolStripButton();\n        tsbMovimiento = new ToolStripButton();\n        sepBarra = new ToolStripSeparator();\n        lblBuscar = new ToolStripLabel();\n        txtBuscar = new ToolStripTextBox();\n        barraEstado = new StatusStrip();\n        tslTotal = new ToolStripStatusLabel();\n        tslReloj = new ToolStripStatusLabel();\n        dgvProductos = new DataGridView();\n        tmrReloj = new System.Windows.Forms.Timer(components);\n        menuPrincipal.SuspendLayout();\n        barraHerramientas.SuspendLayout();\n        barraEstado.SuspendLayout();\n        ((System.ComponentModel.ISupportInitialize)dgvProductos).BeginInit();\n        SuspendLayout();\n\n        // menuPrincipal\n        menuPrincipal.Items.AddRange(new ToolStripItem[] { mnuArchivo, mnuEditar, mnuAyuda });\n        menuPrincipal.Name = \"menuPrincipal\";\n\n        // Archivo: Nuevo, Importar (NUEVO), Exportar, separador, Salir\n        mnuArchivo.DropDownItems.AddRange(new ToolStripItem[] { mnuNuevo, mnuImportar, mnuExportar, sepArchivo, mnuSalir });\n        mnuArchivo.Name = \"mnuArchivo\";\n        mnuArchivo.Text = \"&Archivo\";\n        mnuNuevo.Name = \"mnuNuevo\";\n        mnuNuevo.ShortcutKeys = Keys.Control | Keys.N;\n        mnuNuevo.Text = \"&Nuevo producto...\";\n        mnuImportar.Name = \"mnuImportar\";\n        mnuImportar.ShortcutKeys = Keys.Control | Keys.I;\n        mnuImportar.Text = \"&Importar desde CSV...\";\n        mnuExportar.Name = \"mnuExportar\";\n        mnuExportar.Text = \"&Exportar a CSV...\";\n        sepArchivo.Name = \"sepArchivo\";\n        mnuSalir.Name = \"mnuSalir\";\n        mnuSalir.Text = \"&Salir\";\n\n        // Editar: Editar, Eliminar, Registrar movimiento (NUEVO)\n        mnuEditar.DropDownItems.AddRange(new ToolStripItem[] { mnuEditarProducto, mnuEliminar, mnuMovimiento });\n        mnuEditar.Name = \"mnuEditar\";\n        mnuEditar.Text = \"&Editar\";\n        mnuEditarProducto.Name = \"mnuEditarProducto\";\n        mnuEditarProducto.ShortcutKeys = Keys.Control | Keys.E;\n        mnuEditarProducto.Text = \"&Editar producto...\";\n        mnuEliminar.Name = \"mnuEliminar\";\n        mnuEliminar.ShortcutKeys = Keys.Control | Keys.Delete;\n        mnuEliminar.Text = \"E&liminar producto\";\n        mnuMovimiento.Name = \"mnuMovimiento\";\n        mnuMovimiento.ShortcutKeys = Keys.Control | Keys.M;\n        mnuMovimiento.Text = \"Registrar &movimiento...\";\n\n        // Ayuda\n        mnuAyuda.DropDownItems.Add(mnuAcercaDe);\n        mnuAyuda.Name = \"mnuAyuda\";\n        mnuAyuda.Text = \"A&yuda\";\n        mnuAcercaDe.Name = \"mnuAcercaDe\";\n        mnuAcercaDe.Text = \"&Acerca de AgroStock...\";\n\n        // barraHerramientas: botones de texto, separador y cuadro de búsqueda\n        barraHerramientas.Items.AddRange(new ToolStripItem[] { tsbNuevo, tsbEditar, tsbEliminar, tsbMovimiento, sepBarra, lblBuscar, txtBuscar });\n        barraHerramientas.Name = \"barraHerramientas\";\n        tsbNuevo.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbNuevo.Name = \"tsbNuevo\";\n        tsbNuevo.Text = \"Nuevo\";\n        tsbNuevo.ToolTipText = \"Nuevo producto (Ctrl+N)\";\n        tsbEditar.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbEditar.Name = \"tsbEditar\";\n        tsbEditar.Text = \"Editar\";\n        tsbEditar.ToolTipText = \"Editar el producto seleccionado (Ctrl+E)\";\n        tsbEliminar.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbEliminar.Name = \"tsbEliminar\";\n        tsbEliminar.Text = \"Eliminar\";\n        tsbEliminar.ToolTipText = \"Eliminar el producto seleccionado\";\n        tsbMovimiento.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbMovimiento.Name = \"tsbMovimiento\";\n        tsbMovimiento.Text = \"Movimiento\";\n        tsbMovimiento.ToolTipText = \"Registrar entrada o salida (Ctrl+M)\";\n        sepBarra.Name = \"sepBarra\";\n        lblBuscar.Name = \"lblBuscar\";\n        lblBuscar.Text = \"Busc
