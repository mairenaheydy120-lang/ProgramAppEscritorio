<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Guía AgroStock v1 · Programación de Aplicaciones de Escritorio</title>
<meta name="description" content="Guía paso a paso para construir AgroStock v1 en C# con Windows Forms: 8 pasos, 7 simuladores interactivos y ejercitación del Encuentro 1.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
/* ---------- visor de código ---------- */
.viewer{border-radius:10px;overflow:hidden;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--code-bar);min-width:0}
.v-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--code-bar);padding:8px 10px;color:var(--code-bar-fg)}
.v-tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.v-tabs button{background:transparent;border:1px solid transparent;color:var(--code-bar-fg);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:var(--font-mono);font-size:.8rem}
.v-tabs button[aria-selected="true"]{background:var(--code-bg);color:var(--code-fg);border-color:#2f4a3b}
.v-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #2f4a3b;border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--code-bar-fg);padding:3px 10px;cursor:pointer;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.v-copy{background:transparent;border:1px solid #2f4a3b;color:var(--code-bar-fg);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:.82rem}
.v-copy:hover{background:#243a2e}
.v-info{padding:6px 12px;font-size:.78rem;color:var(--code-ln);background:var(--code-bg);border-bottom:1px solid var(--code-bar)}
.v-body{max-height:460px;overflow:auto;padding:8px 0}
.v-body pre{margin:0;font-family:var(--font-mono);font-size:.8rem;line-height:1.6;width:max-content;min-width:100%}
.ln{display:flex;padding-right:16px}
.ln .no{flex:0 0 3.2em;text-align:right;padding-right:12px;color:var(--code-ln);user-select:none}
.ln.flash{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--code-k)}
/* ---------- ventana tipo Windows ---------- */
.win{background:var(--w-face);color:var(--w-text);border:1px solid #6d6d6d;box-shadow:0 8px 24px var(--w-shadow);position:relative;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.35;min-width:0;max-width:100%;overflow:hidden}
.win *{color-scheme:light}
.win-t{background:var(--w-title);display:flex;align-items:center;height:30px;border-bottom:1px solid #d6d6d6;font-size:12px;padding-left:8px;gap:8px;user-select:none}
.win-t .ic{width:14px;height:14px;background:var(--accent);border-radius:3px;flex:0 0 auto}
.win-t .tt2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-t .wb{display:flex;height:100%}
.win-t .wb span,.win-t .wb button{width:40px;height:100%;border:0;background:transparent;display:grid;place-items:center;font-size:12px;color:#222;cursor:default}
.win-t .wb button.x{cursor:pointer}.win-t .wb button.x:hover{background:#E81123;color:#fff}
.w-menu{display:flex;background:var(--w-white);border-bottom:1px solid #e5e5e5;height:24px;align-items:stretch;position:relative}
.w-menu>button{background:transparent;border:0;padding:0 9px;cursor:default;font-size:13px;color:var(--w-text)}
.w-menu>button:hover,.w-menu>button[aria-expanded="true"]{background:#CCE8FF}
.w-drop{position:absolute;top:24px;z-index:20;background:var(--w-white);border:1px solid #ccc;box-shadow:2px 3px 8px rgba(0,0,0,.25);min-width:230px;padding:2px}
.w-drop button{display:flex;justify-content:space-between;gap:24px;width:100%;background:transparent;border:0;padding:4px 22px 4px 26px;text-align:left;font-size:13px;color:var(--w-text);cursor:default}
.w-drop button:hover{background:#CCE8FF}
.w-drop hr{border:0;border-top:1px solid #ddd;margin:3px 2px}
.w-drop .sk{color:var(--w-mute);font-size:12px}
.w-tool{display:flex;gap:2px;padding:2px 4px;align-items:center;background:var(--w-face);border-bottom:1px solid #d8d8d8;height:30px;flex-wrap:nowrap;overflow:hidden}
.w-tool button{border:1px solid transparent;background:transparent;padding:2px 9px;font-size:13px;cursor:default;color:var(--w-text);border-radius:2px}
.w-tool button:hover{background:#E5F3FF;border-color:#CCE8FF}
.w-tool .sep{width:1px;height:20px;background:#bbb;margin:0 4px}
.w-tool label{font-size:13px;margin-left:4px}
.w-tool input{height:22px;width:130px;border:1px solid #7a7a7a;background:#fff;padding:0 4px;font-size:13px;color:var(--w-text);min-width:0}
.w-status{display:flex;justify-content:space-between;gap:10px;background:#007ACC;color:#fff;font-size:12px;padding:2px 10px;height:22px;align-items:center}
.w-status *{color:#fff}
.w-body{padding:10px 12px}
.w-grid{background:#fff;overflow:auto;border-top:1px solid #aaa}
.w-grid table{border-collapse:collapse;font-size:13px;width:100%;color:var(--w-text)}
.w-grid th{background:#f0f0f0;font-weight:400;text-align:left;border:1px solid #dcdcdc;padding:3px 8px;white-space:nowrap;position:sticky;top:0}
.w-grid td{padding:3px 8px;border-bottom:1px solid #eee;border-right:1px solid #f0f0f0;white-space:nowrap}
.w-grid tr.sel td{background:var(--w-sel);color:var(--w-sel-fg)}
.w-grid td.r,.w-grid th.r{text-align:right}
.w-btn{background:#E1E1E1;border:1px solid #ADADAD;padding:3px 14px;min-width:78px;font-size:13px;color:var(--w-text);cursor:default;border-radius:2px}
.w-btn:hover{background:#E5F1FB;border-color:#0078D7}
.w-btn.def{border:2px solid #0078D7;padding:2px 13px}
.w-btn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.w-in{height:23px;border:1px solid #7a7a7a;background:#fff;padding:0 4px;font-size:13px;width:100%;min-width:0;color:var(--w-text)}
.w-in:disabled{background:#f0f0f0;color:#777}
.w-field{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 8px;align-items:center;margin-bottom:8px;font-size:13px}
.w-field label u{text-decoration:underline}
.w-err{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#E81123;color:#fff!important;font-size:11px;font-weight:700;cursor:help;margin-left:6px;flex:0 0 auto}
.w-cell{display:flex;align-items:center;min-width:0}
.w-ov{position:absolute;inset:30px 0 0 0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:30;padding:8px}
.w-ov.full{inset:0}
.w-dlg{background:var(--w-face);border:1px solid #555;box-shadow:0 6px 22px rgba(0,0,0,.45);width:min(100%,430px);max-height:100%;overflow:auto}
.w-dlg .w-t{height:28px}
.w-msg{display:flex;gap:14px;padding:18px 16px;background:#fff;font-size:13px;align-items:flex-start}
.w-msg .mi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;font-size:18px}
.w-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;background:var(--w-face)}
.w-nores{position:absolute;inset:0;background:rgba(255,255,255,.55);display:grid;place-items:center;z-index:25;color:#111;font-size:13px;text-align:center;padding:12px}
.closed{padding:40px 16px;text-align:center;background:var(--w-face);color:#333;font-size:14px}

/* ---------- explorador de soluciones ---------- */
.se{background:var(--w-white);border:1px solid var(--w-border);color:var(--w-text);padding:8px 6px;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:260px;overflow:auto}
.se ul{list-style:none;margin:0;padding-left:16px}
.se>ul{padding-left:2px}
.se li{padding:2px 4px;border-radius:3px;display:flex;flex-direction:column}
.se .it{display:flex;gap:6px;align-items:center;padding:1px 4px;border-radius:3px}
.se .it.new{background:#CCE8FF;animation:pop .9s ease-out 1}
.se .it.gone{text-decoration:line-through;color:#999}
.se .ico{width:14px;display:inline-block;text-align:center;font-size:12px}
@keyframes pop{from{background:#7CC4FF}to{background:#CCE8FF}}
@media (prefers-reduced-motion:reduce){.se .it.new{animation:none}.prog-bar i{transition:none}}

/* ---------- extensiones: comparaciones, ejercitación y BOA ---------- */
:root{--w-low:#FFB35C;--w-icon-warn:#B86E00}
.stage.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.w-grid tr.low:not(.sel) td{background:var(--w-low)}
.sbtn.ghost[aria-pressed="true"]{background:var(--accent-soft)}
.tlp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px;font-size:13px}
.tlp .w-in{width:100%}
.flp{display:flex;flex-wrap:wrap;gap:6px 10px;padding:8px;font-size:13px}
.flp.nowrap{flex-wrap:nowrap;overflow:hidden}
.flp>span{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}
.flp .w-in{width:72px}
.ex-lv{display:flex;flex-direction:column;gap:12px}
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.ex-big{display:grid;gap:18px}
.boa-sel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px}
.boa-obs{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px}
.boa-in{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;width:100%;max-width:340px}
.tbl td.wrap{white-space:normal;min-width:150px}
.tbx{display:flex;flex-wrap:wrap;gap:6px}
.tbx button{touch-action:none;font-family:var(--font-mono);font-size:.78rem}
.cv-wrap{overflow:hidden;border:1px dashed var(--line);border-radius:8px;padding:4px;background:var(--bg);min-width:0}
.cv-wrap [data-id]{touch-action:none;cursor:move}
.cv-sel{outline:2px solid var(--w-sel);outline-offset:1px}
.cv-h{position:absolute;width:9px;height:9px;background:var(--w-sel);right:-5px;bottom:-5px;cursor:nwse-resize;touch-action:none}
.cv-ghost{position:fixed;pointer-events:none;z-index:100;opacity:.85;padding:3px 10px}
.tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted);margin-top:6px}
.pp td{vertical-align:middle}
.pp input[type=number]{width:70px}
@media (max-width:980px){.stage.three{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.ex-grid{grid-template-columns:minmax(0,1fr)}}
.nav a{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:.88rem;white-space:nowrap;text-decoration:none;color:inherit}
</style>

<script>
const FILES = {"AgroStock.E01.csproj": {"lang": "xml", "src": "<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n    <!-- WinExe = aplicación con ventanas: al ejecutarla no se abre una consola negra detrás. -->\n    <OutputType>WinExe<\/OutputType>\n    <!-- Versión de .NET para Windows con la que se compila el proyecto. -->\n    <TargetFramework>net8.0-windows<\/TargetFramework>\n    <!-- Activa las advertencias de nulos: string? admite null y string no. -->\n    <Nullable>enable<\/Nullable>\n    <!-- Agrega automáticamente los using más comunes (System, System.IO, System.Linq...). -->\n    <ImplicitUsings>enable<\/ImplicitUsings>\n    <!-- Incluye Windows Forms: formularios, controles y los using System.Windows.Forms y System.Drawing. -->\n    <UseWindowsForms>true<\/UseWindowsForms>\n  <\/PropertyGroup>\n\n<\/Project>\n"}, "Program.cs": {"lang": "cs", "src": "// El espacio de nombres agrupa las clases del proyecto. Coincide con el nombre: AgroStock.E01.\nnamespace AgroStock.E01;\n\n// internal: la clase solo se usa dentro de este proyecto. static: nunca se crean objetos de ella.\ninternal static class Program\n{\n    // [STAThread]: la interfaz gráfica corre en un único hilo (el hilo de la interfaz). Windows lo exige.\n    [STAThread]\n    // Main es el punto de entrada: el sistema operativo empieza a ejecutar el programa aquí.\n    private static void Main()\n    {\n        // Prepara estilos visuales, escala para pantallas de alta resolución y fuente por defecto.\n        ApplicationConfiguration.Initialize();\n        // Crea el formulario principal, lo muestra e inicia el bucle de mensajes.\n        // La línea no termina hasta que se cierra FrmPrincipal.\n        Application.Run(new Forms.FrmPrincipal());\n    }\n}\n"}, "Models/Producto.cs": {"lang": "cs", "src": "// Las clases del dominio (los datos del negocio) van en la carpeta Models.\nnamespace AgroStock.E01.Models;\n\n// Un Producto representa una fila del inventario del agroservicio de doña Martha.\n// public: los formularios (otra carpeta) necesitan verla.\npublic class Producto\n{\n    // Código corto y único, por ejemplo FERT-1846. El valor inicial \"\" evita que sea null.\n    public string Codigo { get; set; } = \"\";\n\n    // Nombre que ve el cliente, por ejemplo \"Fórmula 18-46-0 (quintal)\".\n    public string Nombre { get; set; } = \"\";\n\n    // Categoría elegida de una lista cerrada (Fertilizantes, Semillas...).\n    public string Categoria { get; set; } = \"\";\n\n    // decimal es el tipo correcto para dinero: no pierde centavos como double.\n    public decimal Precio { get; set; }\n\n    // int: unidades en bodega. Siempre es un número entero.\n    public int Existencia { get; set; }\n\n    // DateTime? (con ?): admite null porque no todo producto vence, como las herramientas.\n    public DateTime? Vencimiento { get; set; }\n}\n"}, "Forms/FrmProducto.Designer.cs": {"lang": "cs", "src": "// Este archivo lo genera Visual Studio cuando usted arrastra controles en el diseñador.\n// No lo escriba a mano: cada cambio visual se convierte en estas líneas.\nnamespace AgroStock.E01.Forms;\n\n// partial: la clase FrmProducto está repartida en dos archivos (este y FrmProducto.cs).\npartial class FrmProducto\n{\n    // Contenedor de componentes no visuales (como ErrorProvider) para liberarlos al cerrar.\n    private System.ComponentModel.IContainer? components = null;\n\n    // Se ejecuta al cerrar el formulario y libera los recursos de Windows que usa.\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && (components != null))\n        {\n            components.Dispose();\n        }\n        base.Dispose(disposing);\n    }\n\n    // InitializeComponent crea cada control y le asigna sus propiedades.\n    private void InitializeComponent()\n    {\n        // 1) Se crean los objetos. Todavía no están dentro del formulario.\n        components = new System.ComponentModel.Container();\n        errores = new ErrorProvider(components);\n        lblCodigo = new Label();\n        txtCodigo = new TextBox();\n        lblNombre = new Label();\n        txtNombre = new TextBox();\n        lblCategoria = new Label();\n        cboCategoria = new ComboBox();\n        lblPrecio = new Label();\n        nudPrecio = new NumericUpDown();\n        lblExistencia = new Label();\n        nudExistencia = new NumericUpDown();\n        lblVencimiento = new Label();\n        dtpVencimiento = new DateTimePicker();\n        btnGuardar = new Button();\n        btnCancelar = new Button();\n        // 2) Se avisa a los controles que se les van a cambiar muchas propiedades seguidas.\n        ((System.ComponentModel.ISupportInitialize)errores).BeginInit();\n        ((System.ComponentModel.ISupportInitialize)nudPrecio).BeginInit();\n        ((System.ComponentModel.ISupportInitialize)nudExistencia).BeginInit();\n        // SuspendLayout detiene el redibujado para que el formulario no parpadee mientras se arma.\n        SuspendLayout();\n\n        // ----- lblCodigo -----\n        // AutoSize: la etiqueta ajusta su tamaño al texto.\n        lblCodigo.AutoSize = true;\n        // Location: posición (x, y) en píxeles dentro del formulario.\n        lblCodigo.Location = new Point(20, 23);\n        // Name: el nombre con el que se usa el control en el código.\n        lblCodigo.Name = \"lblCodigo\";\n        // TabIndex: orden en que el foco avanza con la tecla Tab.\n        lblCodigo.TabIndex = 0;\n        // El & subraya la C: Alt+C lleva el foco al cuadro de texto que sigue en el orden de tabulación.\n        lblCodigo.Text = \"&Código:\";\n\n        // ----- txtCodigo -----\n        txtCodigo.Location = new Point(140, 20);\n        // MaxLength: máximo de caracteres que admite el cuadro.\n        txtCodigo.MaxLength = 15;\n        txtCodigo.Name = \"txtCodigo\";\n        // Size: ancho y alto del control.\n        txtCodigo.Size = new Size(250, 23);\n        txtCodigo.TabIndex = 1;\n\n        // ----- lblNombre y txtNombre -----\n        lblNombre.AutoSize = true;\n        lblNombre.Location = new Point(20, 68);\n        lblNombre.Name = \"lblNombre\";\n        lblNombre.TabIndex = 2;\n        lblNombre.Text = \"&Nombre:\";\n        txtNombre.Location = new Point(140, 65);\n        txtNombre.MaxLength = 60;\n        txtNombre.Name = \"txtNombre\";\n        txtNombre.Size = new Size(250, 23);\n        txtNombre.TabIndex = 3;\n\n        // ----- lblCategoria y cboCategoria -----\n        lblCategoria.AutoSize = true;\n        lblCategoria.Location = new Point(20, 113);\n        lblCategoria.Name = \"lblCategoria\";\n        lblCategoria.TabIndex = 4;\n        lblCategoria.Text = \"C&ategoría:\";\n        // DropDownList: solo se puede elegir de la lista, no escribir. Evita categorías mal escritas.\n        cboCategoria.DropDownStyle = ComboBoxStyle.DropDownList;\n        cboCategoria.FormattingEnabled = true;\n        cboCategoria.Location = new Point(140, 110);\n        cboCategoria.Name = \"cboCategoria\";\n        cboCategoria.Size = new Size(250, 23);\n        cboCategoria.TabIndex = 5;\n\n        // ----- lblPrecio y nudPrecio -----\n        lblPrecio.AutoSize = true;\n        lblPrecio.Location = new Point(20, 158);\n        lblPrecio.Name = \"lblPrecio\";\n        lblPrecio.TabIndex = 6;\n        lblPrecio.Text = \"&Precio (C$):\";\n        // DecimalPlaces: cuántos decimales muestra el control. 2 = centavos.\n        nudPrecio.DecimalPlaces = 2;\n        nudPrecio.Location = new Point(140, 155);\n        // Maximum: el valor más alto permitido. Minimum es 0 por defecto.\n        nudPrecio.Maximum = 100000m;\n        nudPrecio.Name = \"nudPrecio\";\n        nudPrecio.Size = new Size(120, 23);\n        nudPrecio.TabIndex = 7;\n        // ThousandsSeparator: muestra 1,250.00 en lugar de 1250.00.\n        nudPrecio.ThousandsSeparator = true;\n\n        // ----- lblExistencia y nudExistencia -----\n        lblExistencia.AutoSize = true;\n        lblExistencia.Location = new Point(20, 203);\n        lblExistencia.Name = \"lblExistencia\";\n        lblExistencia.TabIndex = 8;\n        lblExistencia.Text = \"E&xistencia:\";\n        nudExistencia.Location = new Point(140, 200);\n        nudExistencia.Maximum = 100000m;\n        nudExistencia.Name = \"nudExistencia\";\n        nudExistencia.Size = new Size(120, 23);\n        nudExistencia.TabIndex = 9;\n        nudExistencia.ThousandsSeparator = true;\n\n        // ----- lblVencimiento y dtpVencimiento -----\n        lblVencimiento.AutoSize = true;\n        lblVencimiento.Location = new Point(20, 248);\n        lblVencimiento.Name = \"lblVencimiento\";\n        lblVencimiento.TabIndex = 10;\n        lblVencimiento.Text = \"&Vencimiento:\";\n        // Format Short: muestra solo la fecha (dd/MM/yyyy), sin hora.\n        dtpVencimiento.Format = DateTimePickerFormat.Short;\n        dtpVencimiento.Location = new Point(140, 245);\n        dtpVencimiento.Name = \"dtpVencimiento\";\n        dtpVencimiento.Size = new Size(120, 23);\n        // ShowCheckBox: agrega una casilla. Sin marcar significa \"este producto no vence\" (null).\n        dtpVencimiento.ShowCheckBox = true;\n        dtpVencimiento.Checked = false;\n        dtpVencimiento.TabIndex = 11;\n\n        // ----- btnGuardar -----\n        btnGuardar.Location = new Point(210, 300);\n        btnGuardar.Name = \"btnGuardar\";\n        btnGuardar.Size = new Size(90, 30);\n        btnGuardar.TabIndex = 12;\n        btnGuardar.Text = \"&Guardar\";\n        // UseVisualStyleBackColor: usa el aspecto moderno de Windows para el botón.\n        btnGuardar.UseVisualStyleBackColor = true;\n\n        // ----- btnCancelar -----\n        btnCancelar.Location = new Point(310, 300);\n        btnCancelar.Name = \"btnCancelar\";\n        btnCancelar.Size = new Size(90, 30);\n        btnCancelar.TabIndex = 13;\n        btnCancelar.Text = \"Cancelar\";\n        // DialogResult = Cancel: al pulsarlo, el formulario se cierra solo y ShowDialog devuelve Cancel.\n        btnCancelar.DialogResult = DialogResult.Cancel;\n        btnCancelar.UseVisualStyleBackColor = true;\n\n        // ----- El formulario FrmProducto -----\n        // AutoScaleMode.Font: el tamaño se ajusta si el usuario cambia la fuente o la escala de Windows.\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        // AcceptButton: la tecla Enter equivale a pulsar Guardar.\n        AcceptButton = btnGuardar;\n        // CancelButton: la tecla Esc equivale a pulsar Cancelar.\n        CancelButton = btnCancelar;\n        // ClientSize: tamaño del área interior (sin el borde ni la barra de título).\n        ClientSize = new Size(420, 345);\n        // Controls.Add mete cada control dentro del formulario. Sin esto no se vería.\n        Controls.Add(lblCodigo);\n        Controls.Add(txtCodigo);\n        Controls.Add(lblNombre);\n        Controls.Add(txtNombre);\n        Controls.Add(lblCategoria);\n        Controls.Add(cboCategoria);\n        Controls.Add(lblPrecio);\n        Controls.Add(nudPrecio);\n        Controls.Add(lblExistencia);\n        Controls.Add(nudExistencia);\n        Controls.Add(lblVencimiento);\n        Controls.Add(dtpVencimiento);\n        Controls.Add(btnGuardar);\n        Controls.Add(btnCancelar);\n        // FixedDialog: ventana de tamaño fijo, como un cuadro de diálogo. Sin maximizar ni minimizar.\n        FormBorderStyle = FormBorderStyle.FixedDialog;\n        MaximizeBox = false;\n        MinimizeBox = false;\n        Name = \"FrmProducto\";\n        // CenterParent: aparece centrado sobre la ventana que la abrió.\n        StartPosition = FormStartPosition.CenterParent;\n        Text = \"Producto\";\n        // 3) Se termina la configuración y se dibuja todo de una vez.\n        ((System.ComponentModel.ISupportInitialize)errores).EndInit();\n        ((System.ComponentModel.ISupportInitialize)nudPrecio).EndInit();\n        ((System.ComponentModel.ISupportInitialize)nudExistencia).EndInit();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n\n    // Campos: un campo privado por cada control, con el mismo Name que se usó arriba.\n    // Gracias a ellos el código de FrmProducto.cs puede escribir txtNombre.Text, nudPrecio.Value, etc.\n    private ErrorProvider errores = null!;\n    private Label lblCodigo = null!;\n    private TextBox txtCodigo = null!;\n    private Label lblNombre = null!;\n    private TextBox txtNombre = null!;\n    private Label lblCategoria = null!;\n    private ComboBox cboCategoria = null!;\n    private Label lblPrecio = null!;\n    private NumericUpDown nudPrecio = null!;\n    private Label lblExistencia = null!;\n    private NumericUpDown nudExistencia = null!;\n    private Label lblVencimiento = null!;\n    private DateTimePicker dtpVencimiento = null!;\n    private Button btnGuardar = null!;\n    private Button btnCancelar = null!;\n}\n"}, "Forms/FrmProducto.cs": {"lang": "cs", "src": "// using trae los espacios de nombres cuyas clases vamos a usar. Aquí, la clase Producto.\nusing AgroStock.E01.Models;\n\nnamespace AgroStock.E01.Forms;\n\n// Formulario modal para capturar o editar un producto.\n// Hereda de Form: ya sabe dibujarse, moverse y cerrarse. Nosotros agregamos la lógica.\npublic partial class FrmProducto : Form\n{\n    // Producto con el que trabaja el diálogo. Quien abre el formulario lo recibe de vuelta ya lleno.\n    // { get; } = solo lectura desde afuera: se asigna una vez en el constructor.\n    public Producto Producto { get; }\n\n    // Constructor: recibe el producto a editar (uno vacío si es nuevo).\n    public FrmProducto(Producto producto)\n    {\n        // Crea los controles definidos en FrmProducto.Designer.cs. Siempre va primero.\n        InitializeComponent();\n        // Guarda el producto recibido en la propiedad.\n        Producto = producto;\n\n        // Suscripción de eventos con +=: \"cuando ocurra X, ejecuta este método\".\n        // Load ocurre justo antes de mostrar el formulario por primera vez.\n        Load += FrmProducto_Load;\n        // KeyPress ocurre cada vez que se pulsa una tecla dentro del cuadro de código.\n        txtCodigo.KeyPress += TxtCodigo_KeyPress;\n        // Click ocurre al pulsar el botón Guardar.\n        btnGuardar.Click += BtnGuardar_Click;\n    }\n\n    // Manejador del evento Load: prepara los controles con los datos del producto.\n    // sender = quién lanzó el evento; e = datos del evento. Todo manejador recibe estos dos parámetros.\n    private void FrmProducto_Load(object? sender, EventArgs e)\n    {\n        // Llena la lista desplegable con las categorías permitidas.\n        cboCategoria.Items.AddRange(new object[] { \"Fertilizantes\", \"Semillas\", \"Herbicidas\", \"Herramientas\" });\n\n        // Copia los datos del producto a los controles. Si es nuevo, quedan vacíos o en cero.\n        Text = Producto.Codigo.Length == 0 ? \"Nuevo producto\" : \"Editar producto\";\n        txtCodigo.Text = Producto.Codigo;\n        txtNombre.Text = Producto.Nombre;\n        // SelectedItem busca el texto en la lista. Si no existe, no selecciona nada (-1).\n        cboCategoria.SelectedItem = Producto.Categoria;\n        nudPrecio.Value = Producto.Precio;\n        nudExistencia.Value = Producto.Existencia;\n\n        // Vencimiento puede ser null: si tiene valor se marca la casilla, si no, se deja sin marcar.\n        if (Producto.Vencimiento.HasValue)\n        {\n            dtpVencimiento.Value = Producto.Vencimiento.Value;\n            dtpVencimiento.Checked = true;\n        }\n    }\n\n    // Manejador de KeyPress: filtra lo que el usuario puede escribir en el código.\n    private void TxtCodigo_KeyPress(object? sender, KeyPressEventArgs e)\n    {\n        // Las teclas de control (Retroceso, Supr...) siempre se permiten.\n        if (char.IsControl(e.KeyChar)) return;\n\n        // Solo letras, dígitos y guion. Cualquier otra tecla se descarta.\n        if (!char.IsLetterOrDigit(e.KeyChar) && e.KeyChar != '-')\n        {\n            // Handled = true significa \"este evento ya se atendió\": la tecla nunca llega al cuadro.\n            e.Handled = true;\n            return;\n        }\n\n        // Si la tecla es válida, se convierte a mayúscula antes de llegar al cuadro.\n        e.KeyChar = char.ToUpperInvariant(e.KeyChar);\n    }\n\n    // Manejador del botón Guardar: valida los datos y, si todo está bien, cierra el diálogo.\n    private void BtnGuardar_Click(object? sender, EventArgs e)\n    {\n        // Borra los íconos de error de la vez anterior.\n        errores.Clear();\n        // Empezamos suponiendo que todo es válido; cada regla incumplida lo cambia a false.\n        bool valido = true;\n\n        // Trim() quita espacios al inicio y al final. Length cuenta los caracteres que quedan.\n        if (txtCodigo.Text.Trim().Length < 3)\n        {\n            // SetError muestra un ícono rojo junto al control con el mensaje al pasar el ratón.\n            errores.SetError(txtCodigo, \"Escriba al menos 3 caracteres.\");\n            valido = false;\n        }\n        if (txtNombre.Text.Trim().Length < 3)\n        {\n            errores.SetError(txtNombre, \"Escriba al menos 3 caracteres.\");\n            valido = false;\n        }\n        // SelectedIndex es -1 cuando no se ha elegido ninguna categoría.\n        if (cboCategoria.SelectedIndex < 0)\n        {\n            errores.SetError(cboCategoria, \"Elija una categoría.\");\n            valido = false;\n        }\n        // Es el caso de doña Martha: olvidar el precio. Un precio de 0 no es válido.\n        if (nudPrecio.Value <= 0)\n        {\n            errores.SetError(nudPrecio, \"El precio debe ser mayor que cero.\");\n            valido = false;\n        }\n\n        // Si algo falló, se sale sin cerrar: el diálogo sigue abierto para corregir.\n        if (!valido) return;\n\n        // Todo es válido: recién ahora se copian los datos al producto.\n        Producto.Codigo = txtCodigo.Text.Trim();\n        Producto.Nombre = txtNombre.Text.Trim();\n        // SelectedItem es object?; el signo ! indica que sabemos que no es null (ya se validó).\n        Producto.Categoria = (string)cboCategoria.SelectedItem!;\n        Producto.Precio = nudPrecio.Value;\n        // Value es decimal; Existencia es int, por eso la conversión (int).\n        Producto.Existencia = (int)nudExistencia.Value;\n        // Si la casilla está marcada se guarda la fecha; si no, null (no vence).\n        Producto.Vencimiento = dtpVencimiento.Checked ? dtpVencimiento.Value.Date : null;\n\n        // OK cierra el formulario modal y hace que ShowDialog devuelva DialogResult.OK.\n        DialogResult = DialogResult.OK;\n    }\n}\n"}, "Forms/FrmPrincipal.Designer.cs": {"lang": "cs", "src": "// Archivo generado por el diseñador de Visual Studio para la ventana principal.\n// Aquí viven el menú, la barra de herramientas, la cuadrícula y la barra de estado.\nnamespace AgroStock.E01.Forms;\n\npartial class FrmPrincipal\n{\n    private System.ComponentModel.IContainer? components = null;\n\n    protected override void Dispose(bool disposing)\n    {\n        if (disposing && (components != null))\n        {\n            components.Dispose();\n        }\n        base.Dispose(disposing);\n    }\n\n    private void InitializeComponent()\n    {\n        // 1) Se crean todos los objetos.\n        components = new System.ComponentModel.Container();\n        menuPrincipal = new MenuStrip();\n        mnuArchivo = new ToolStripMenuItem();\n        mnuNuevo = new ToolStripMenuItem();\n        mnuExportar = new ToolStripMenuItem();\n        sepArchivo = new ToolStripSeparator();\n        mnuSalir = new ToolStripMenuItem();\n        mnuEditar = new ToolStripMenuItem();\n        mnuEditarProducto = new ToolStripMenuItem();\n        mnuEliminar = new ToolStripMenuItem();\n        mnuAyuda = new ToolStripMenuItem();\n        mnuAcercaDe = new ToolStripMenuItem();\n        barraHerramientas = new ToolStrip();\n        tsbNuevo = new ToolStripButton();\n        tsbEditar = new ToolStripButton();\n        tsbEliminar = new ToolStripButton();\n        sepBarra = new ToolStripSeparator();\n        lblBuscar = new ToolStripLabel();\n        txtBuscar = new ToolStripTextBox();\n        barraEstado = new StatusStrip();\n        tslTotal = new ToolStripStatusLabel();\n        tslReloj = new ToolStripStatusLabel();\n        dgvProductos = new DataGridView();\n        // Timer de Windows Forms: se escribe completo porque System.Threading también tiene un Timer.\n        tmrReloj = new System.Windows.Forms.Timer(components);\n        // 2) Se pausa el diseño mientras se configuran los controles.\n        menuPrincipal.SuspendLayout();\n        barraHerramientas.SuspendLayout();\n        barraEstado.SuspendLayout();\n        ((System.ComponentModel.ISupportInitialize)dgvProductos).BeginInit();\n        SuspendLayout();\n\n        // ----- menuPrincipal (MenuStrip): la barra de menús de arriba -----\n        // Items.AddRange agrega los menús de primer nivel, en este orden de izquierda a derecha.\n        menuPrincipal.Items.AddRange(new ToolStripItem[] { mnuArchivo, mnuEditar, mnuAyuda });\n        menuPrincipal.Location = new Point(0, 0);\n        menuPrincipal.Name = \"menuPrincipal\";\n        menuPrincipal.TabIndex = 0;\n\n        // ----- mnuArchivo -----\n        // DropDownItems: los elementos que aparecen al abrir el menú Archivo.\n        mnuArchivo.DropDownItems.AddRange(new ToolStripItem[] { mnuNuevo, mnuExportar, sepArchivo, mnuSalir });\n        mnuArchivo.Name = \"mnuArchivo\";\n        // &Archivo: la A queda subrayada y Alt+A abre el menú.\n        mnuArchivo.Text = \"&Archivo\";\n\n        // ShortcutKeys: atajo de teclado global. Keys.Control | Keys.N significa Ctrl+N.\n        mnuNuevo.ShortcutKeys = Keys.Control | Keys.N;\n        mnuNuevo.Name = \"mnuNuevo\";\n        mnuNuevo.Text = \"&Nuevo producto\";\n\n        mnuExportar.ShortcutKeys = Keys.Control | Keys.Shift | Keys.E;\n        mnuExportar.Name = \"mnuExportar\";\n        // Los tres puntos avisan que se abrirá un cuadro de diálogo antes de actuar.\n        mnuExportar.Text = \"&Exportar a CSV...\";\n\n        // ToolStripSeparator: la línea que separa grupos de opciones dentro del menú.\n        sepArchivo.Name = \"sepArchivo\";\n\n        mnuSalir.Name = \"mnuSalir\";\n        // ShortcutKeyDisplayString solo muestra el texto del atajo; Alt+F4 ya lo maneja Windows.\n        mnuSalir.ShortcutKeyDisplayString = \"Alt+F4\";\n        mnuSalir.Text = \"&Salir\";\n\n        // ----- mnuEditar -----\n        mnuEditar.DropDownItems.AddRange(new ToolStripItem[] { mnuEditarProducto, mnuEliminar });\n        mnuEditar.Name = \"mnuEditar\";\n        mnuEditar.Text = \"&Editar\";\n\n        mnuEditarProducto.ShortcutKeys = Keys.Control | Keys.E;\n        mnuEditarProducto.Name = \"mnuEditarProducto\";\n        mnuEditarProducto.Text = \"&Editar producto\";\n\n        // Se usa Ctrl+D y no la tecla Supr: Supr se necesita para borrar texto en el cuadro de búsqueda.\n        mnuEliminar.ShortcutKeys = Keys.Control | Keys.D;\n        mnuEliminar.Name = \"mnuEliminar\";\n        mnuEliminar.Text = \"E&liminar producto\";\n\n        // ----- mnuAyuda -----\n        mnuAyuda.DropDownItems.AddRange(new ToolStripItem[] { mnuAcercaDe });\n        mnuAyuda.Name = \"mnuAyuda\";\n        mnuAyuda.Text = \"A&yuda\";\n        mnuAcercaDe.Name = \"mnuAcercaDe\";\n        mnuAcercaDe.Text = \"&Acerca de AgroStock\";\n\n        // ----- barraHerramientas (ToolStrip): acceso rápido a lo más usado -----\n        barraHerramientas.Items.AddRange(new ToolStripItem[] { tsbNuevo, tsbEditar, tsbEliminar, sepBarra, lblBuscar, txtBuscar });\n        barraHerramientas.Location = new Point(0, 24);\n        barraHerramientas.Name = \"barraHerramientas\";\n        barraHerramientas.TabIndex = 1;\n\n        // DisplayStyle.Text: el botón muestra solo texto (no usamos íconos en este encuentro).\n        tsbNuevo.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbNuevo.Name = \"tsbNuevo\";\n        tsbNuevo.Text = \"Nuevo\";\n        // ToolTipText: el globo de ayuda que aparece al dejar el ratón sobre el botón.\n        tsbNuevo.ToolTipText = \"Nuevo producto (Ctrl+N)\";\n\n        tsbEditar.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbEditar.Name = \"tsbEditar\";\n        tsbEditar.Text = \"Editar\";\n        tsbEditar.ToolTipText = \"Editar producto (Ctrl+E)\";\n\n        tsbEliminar.DisplayStyle = ToolStripItemDisplayStyle.Text;\n        tsbEliminar.Name = \"tsbEliminar\";\n        tsbEliminar.Text = \"Eliminar\";\n        tsbEliminar.ToolTipText = \"Eliminar producto (Ctrl+D)\";\n\n        sepBarra.Name = \"sepBarra\";\n\n        lblBuscar.Name = \"lblBuscar\";\n        lblBuscar.Text = \"Buscar:\";\n\n        // ToolStripTextBox: un cuadro de texto dentro de la barra. Filtra la cuadrícula al escribir.\n        txtBuscar.Name = \"txtBuscar\";\n        txtBuscar.Size = new Size(180, 25);\n        txtBuscar.ToolTipText = \"Escriba parte del código o del nombre\";\n\n        // ----- barraEstado (StatusStrip): informa sin interrumpir -----\n        barraEstado.Items.AddRange(new ToolStripItem[] { tslTotal, tslReloj });\n        // Dock = Bottom: pegada al borde inferior, ocupando todo el ancho.\n        barraEstado.Dock = DockStyle.Bottom;\n        barraEstado.Name = \"barraEstado\";\n        barraEstado.TabIndex = 2;\n\n        // Spring = true: esta etiqueta se estira y empuja el reloj hacia la derecha.\n        tslTotal.Name = \"tslTotal\";\n        tslTotal.Spring = true;\n        tslTotal.TextAlign = ContentAlignment.MiddleLeft;\n        tslTotal.Text = \"Productos: 0\";\n\n        tslReloj.Name = \"tslReloj\";\n        tslReloj.Text = \"00/00/0000 00:00:00\";\n\n        // ----- dgvProductos (DataGridView): la cuadrícula con la lista -----\n        // Las columnas no se definen aquí: las crea ConfigurarCuadricula() en FrmPrincipal.cs.\n        // El usuario no puede agregar ni borrar filas directamente en la cuadrícula.\n        dgvProductos.AllowUserToAddRows = false;\n        dgvProductos.AllowUserToDeleteRows = false;\n        // ReadOnly: las celdas no se editan a mano; para eso está el formulario de producto.\n        dgvProductos.ReadOnly = true;\n        // FullRowSelect: al hacer clic se selecciona la fila completa.\n        dgvProductos.SelectionMode = DataGridViewSelectionMode.FullRowSelect;\n        // MultiSelect = false: una sola fila a la vez.\n        dgvProductos.MultiSelect = false;\n        dgvProductos.RowHeadersVisible = false;\n        dgvProductos.BackgroundColor = SystemColors.Window;\n        // Dock = Fill: ocupa todo el espacio que dejan el menú, la barra de herramientas y la barra de estado.\n        dgvProductos.Dock = DockStyle.Fill;\n        dgvProductos.Name = \"dgvProductos\";\n        dgvProductos.TabIndex = 3;\n\n        // ----- tmrReloj (Timer) -----\n        // Interval en milisegundos: 1000 = el evento Tick ocurre cada segundo.\n        tmrReloj.Interval = 1000;\n        tmrReloj.Enabled = true;\n\n        // ----- El formulario FrmPrincipal -----\n        AutoScaleDimensions = new SizeF(7F, 15F);\n        AutoScaleMode = AutoScaleMode.Font;\n        ClientSize = new Size(900, 520);\n        // El orden de Controls.Add importa con Dock: primero el que llena (Fill) y al final el menú.\n        Controls.Add(dgvProductos);\n        Controls.Add(barraEstado);\n        Controls.Add(barraHerramientas);\n        Controls.Add(menuPrincipal);\n        // MainMenuStrip: indica cuál es el menú principal de la ventana (activa Alt y las teclas de acceso).\n        MainMenuStrip = menuPrincipal;\n        // MinimumSize: la ventana no se puede achicar más que esto.\n        MinimumSize = new Size(640, 360);\n        Name = \"FrmPrincipal\";\n        StartPosition = FormStartPosition.CenterScreen;\n        Text = \"AgroStock v1 - Inventario del agroservicio\";\n        // 3) Se reanuda el diseño y se dibuja todo.\n        menuPrincipal.ResumeLayout(false);\n        menuPrincipal.PerformLayout();\n        barraHerramientas.ResumeLayout(false);\n        barraHerramientas.PerformLayout();\n        barraEstado.ResumeLayout(false);\n        barraEstado.PerformLayout();\n        ((System.ComponentModel.ISupportInitialize)dgvProductos).EndInit();\n        ResumeLayout(false);\n        PerformLayout();\n    }\n\n    // Un campo privado por cada control y componente.\n    private MenuStrip menuPrincipal = null!;\n    private ToolStripMenuItem mnuArchivo = null!;\n    private ToolStripMenuItem mnuNuevo = null!;\n    private ToolStripMenuItem mnuExportar = null!;\n    private ToolStripSeparator sepArchivo = null!;\n    private ToolStripMenuItem mnuSalir = null!;\n    private ToolStripMenuItem mnuEditar = null!;\n    private ToolStripMenuItem mnuEditarProducto = null!;\n    private ToolStripMenuItem mnuEliminar = null!;\n    private ToolStripMenuItem mnuAyuda = null!;\n    private ToolStripMenuItem mnuAcercaDe = null!;\n    private ToolStrip barraHerramientas = null!;\n    private ToolStripButton tsbNuevo = null!;\n    private ToolStripButton tsbEditar = null!;\n    private ToolStripButton tsbEliminar = null!;\n    private ToolStripSeparator sepBarra = null!;\n    private ToolStripLabel lblBuscar = null!;\n    private ToolStripTextBox txtBuscar = null!;\n    private StatusStrip barraEstado = null!;\n    private ToolStripStatusLabel tslTotal = null!;\n    private ToolStripStatusLabel tslReloj = null!;\n    private DataGridView dgvProductos = null!;\n    private System.Windows.Forms.Timer tmrReloj = null!;\n}\n"}, "Forms/FrmPrincipal.cs": {"lang": "cs", "src": "// BindingList<T> vive en System.ComponentModel; CultureInfo en System.Globalization; StringBuilder en System.Text.\nusing System.ComponentModel;\nusing System.Globalization;\nusing System.Text;\nusing AgroStock.E01.Models;\n\nnamespace AgroStock.E01.Forms;\n\n// Ventana principal de AgroStock v1: menú, barra de herramientas, cuadrícula y barra de estado.\npublic partial class FrmPrincipal : Form\n{\n    // BindingList<Producto>: una lista que AVISA a los controles enlazados cuando se agrega o elimina algo.\n    // readonly: la variable apunta siempre a la misma lista; lo que cambia es su contenido.\n    private readonly BindingList<Producto> productos = new();\n\n    // Constructor: se ejecuta una vez al crear la ventana (en Program.cs con new Forms.FrmPrincipal()).\n    public FrmPrincipal()\n    {\n        // Crea los controles del diseñador. Siempre es la primera línea.\n        InitializeComponent();\n        // Cada paso importante está en un método con nombre claro para que el constructor se lea como un índice.\n        ConfigurarCuadricula();\n        SuscribirEventos();\n        CargarDatosIniciales();\n        // Muestra la lista en la cuadrícula y escribe el total en la barra de estado.\n        AplicarFiltro();\n        // Pone la hora de inmediato, sin esperar el primer segundo del temporizador.\n        ActualizarReloj();\n    }\n\n    // ---------------------------------------------------------------- configuración inicial\n\n    // Define las columnas de la cuadrícula y a qué propiedad de Producto corresponde cada una.\n    private void ConfigurarCuadricula()\n    {\n        // false: no crear columnas automáticamente; las definimos nosotros para controlar títulos y formatos.\n        dgvProductos.AutoGenerateColumns = false;\n\n        // DataPropertyName enlaza la columna con una propiedad de Producto.\n        // nameof(...) escribe el nombre de la propiedad como texto y evita errores de tipeo.\n        dgvProductos.Columns.Add(NuevaColumna(\"Código\", nameof(Producto.Codigo), 110));\n        dgvProductos.Columns.Add(NuevaColumna(\"Nombre\", nameof(Producto.Nombre), 220));\n        dgvProductos.Columns.Add(NuevaColumna(\"Categoría\", nameof(Producto.Categoria), 120));\n        dgvProductos.Columns.Add(NuevaColumna(\"Precio (C$)\", nameof(Producto.Precio), 100));\n        dgvProductos.Columns.Add(NuevaColumna(\"Existencia\", nameof(Producto.Existencia), 90));\n        dgvProductos.Columns.Add(NuevaColumna(\"Vencimiento\", nameof(Producto.Vencimiento), 110));\n\n        // Formato de las celdas: N2 = miles y dos decimales; dd/MM/yyyy = día/mes/año.\n        dgvProductos.Columns[3].DefaultCellStyle.Format = \"N2\";\n        dgvProductos.Columns[3].DefaultCellStyle.Alignment = DataGridViewContentAlignment.MiddleRight;\n        dgvProductos.Columns[4].DefaultCellStyle.Alignment = DataGridViewContentAlignment.MiddleRight;\n        dgvProductos.Columns[5].DefaultCellStyle.Format = \"dd/MM/yyyy\";\n        // Fill: la columna Nombre usa todo el ancho sobrante al cambiar el tamaño de la ventana.\n        dgvProductos.Columns[1].AutoSizeMode = DataGridViewAutoSizeColumnMode.Fill;\n    }\n\n    // Método auxiliar: crea una columna de texto. static porque no usa nada del formulario.\n    private static DataGridViewTextBoxColumn NuevaColumna(string titulo, string propiedad, int ancho)\n    {\n        // new() con un inicializador: asigna propiedades al crear el objeto.\n        return new DataGridViewTextBoxColumn\n        {\n            Name = \"col\" + propiedad,\n            HeaderText = titulo,\n            DataPropertyName = propiedad,\n            Width = ancho\n        };\n    }\n\n    // Conecta cada evento con el método que debe ejecutarse (suscripción con +=).\n    private void SuscribirEventos()\n    {\n        // La misma acción puede dispararse desde el menú, la barra y el teclado: todos llaman al mismo método.\n        // (_, _) => ... es una expresión lambda: un método corto sin nombre que ignora sender y e.\n        mnuNuevo.Click += (_, _) => NuevoProducto();\n        tsbNuevo.Click += (_, _) => NuevoProducto();\n        mnuEditarProducto.Click += (_, _) => EditarProducto();\n        tsbEditar.Click += (_, _) => EditarProducto();\n        mnuEliminar.Click += (_, _) => EliminarProducto();\n        tsbEliminar.Click += (_, _) => EliminarProducto();\n        mnuExportar.Click += (_, _) => ExportarCsv();\n        // Close() cierra la ventana y dispara antes el evento FormClosing.\n        mnuSalir.Click += (_, _) => Close();\n        mnuAcercaDe.Click += (_, _) => MostrarAcercaDe();\n\n        // Doble clic en una celda abre el producto para editarlo. RowIndex -1 es el encabezado de columnas.\n        dgvProductos.CellDoubleClick += (_, e) =>\n        {\n            if (e.RowIndex >= 0) EditarProducto();\n        };\n        // TextChanged se dispara con cada letra escrita: la búsqueda filtra mientras se escribe.\n        txtBuscar.TextChanged += (_, _) => AplicarFiltro();\n        // Tick ocurre cada segundo (Interval = 1000): actualiza el reloj.\n        tmrReloj.Tick += (_, _) => ActualizarReloj();\n        // FormClosing ocurre antes de cerrar y permite cancelar el cierre.\n        FormClosing += FrmPrincipal_FormClosing;\n    }\n\n    // Agrega tres productos de ejemplo para que la cuadrícula no empiece vacía.\n    private void CargarDatosIniciales()\n    {\n        // Add agrega al final de la lista. La lista avisa a la cuadrícula, que dibuja la nueva fila.\n        productos.Add(new Producto\n        {\n            Codigo = \"FERT-1846\", Nombre = \"Fórmula 18-46-0 (quintal)\", Categoria = \"Fertilizantes\",\n            Precio = 1250.00m, Existencia = 24, Vencimiento = null\n        });\n        productos.Add(new Producto\n        {\n            Codigo = \"SEM-FRIJ01\", Nombre = \"Semilla de frijol rojo (libra)\", Categoria = \"Semillas\",\n            Precio = 32.50m, Existencia = 150, Vencimiento = new DateTime(2027, 3, 31)\n        });\n        productos.Add(new Producto\n        {\n            Codigo = \"HERB-GLI1\", Nombre = \"Glifosato (litro)\", Categoria = \"Herbicidas\",\n            Precio = 180.00m, Existencia = 8, Vencimiento = new DateTime(2027, 8, 15)\n        });\n    }\n\n    // ---------------------------------------------------------------- acciones del usuario\n\n    // Abre el formulario modal vacío; si el usuario pulsa Guardar, agrega el producto a la lista.\n    private void NuevoProducto()\n    {\n        // Producto vacío: es el \"molde\" que el diálogo llenará.\n        var p = new Producto();\n        // using var libera el formulario al terminar el método (los diálogos modales no se liberan solos).\n        using var dlg = new FrmProducto(p);\n        // ShowDialog es modal: el código se detiene aquí hasta que el diálogo se cierra.\n        // Devuelve OK si se guardó y Cancel si se canceló. 'this' hace que se centre sobre esta ventana.\n        if (dlg.ShowDialog(this) == DialogResult.OK)\n        {\n            productos.Add(p);\n            RefrescarLista();\n        }\n    }\n\n    // Abre el diálogo con el producto seleccionado para modificarlo.\n    private void EditarProducto()\n    {\n        var p = ProductoSeleccionado();\n        // is null: no hay fila seleccionada. Se avisa y se sale del método.\n        if (p is null)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        using var dlg = new FrmProducto(p);\n        // El diálogo solo cambia p si el usuario guarda con datos válidos.\n        if (dlg.ShowDialog(this) == DialogResult.OK)\n        {\n            RefrescarLista();\n        }\n    }\n\n    // Pide confirmación y elimina el producto seleccionado.\n    private void EliminarProducto()\n    {\n        var p = ProductoSeleccionado();\n        if (p is null)\n        {\n            AvisarSeleccion();\n            return;\n        }\n        // MessageBox.Show devuelve el botón que pulsó el usuario.\n        // YesNo: botones Sí y No. Question: ícono de pregunta. Button2: \"No\" queda marcado por defecto (más seguro).\n        var r = MessageBox.Show(this, $\"¿Eliminar «{p.Nombre}»?\", \"Confirmar eliminación\",\n            MessageBoxButtons.YesNo, MessageBoxIcon.Question, MessageBoxDefaultButton.Button2);\n        if (r == DialogResult.Yes)\n        {\n            productos.Remove(p);\n            RefrescarLista();\n        }\n    }\n\n    // Guarda el inventario en un archivo CSV que se abre con Excel.\n    private void ExportarCsv()\n    {\n        // SaveFileDialog: la ventana estándar \"Guardar como\". Filter define los tipos de archivo que ofrece.\n        using var dlg = new SaveFileDialog\n        {\n            Title = \"Exportar inventario\",\n            Filter = \"Archivo CSV (*.csv)|*.csv\",\n            FileName = \"inventario.csv\"\n        };\n        // Si el usuario cancela, se sale sin hacer nada.\n        if (dlg.ShowDialog(this) != DialogResult.OK) return;\n\n        // StringBuilder arma un texto largo línea por línea de forma eficiente.\n        var sb = new StringBuilder();\n        // El punto y coma como separador es el que Excel en español espera.\n        sb.AppendLine(\"Codigo;Nombre;Categoria;Precio;Existencia;Vencimiento\");\n        // foreach recorre todos los productos de la lista, no solo los que muestra el filtro.\n        foreach (var p in productos)\n        {\n            sb.AppendLine(string.Join(';', new[]\n            {\n                Csv(p.Codigo), Csv(p.Nombre), Csv(p.Categoria),\n                // InvariantCulture: el decimal siempre usa punto, sin importar el idioma de Windows.\n                p.Precio.ToString(\"F2\", CultureInfo.InvariantCulture),\n                p.Existencia.ToString(),\n                // ?. y ?? : si Vencimiento es null se escribe texto vacío.\n                p.Vencimiento?.ToString(\"yyyy-MM-dd\") ?? \"\"\n            }));\n        }\n\n        // try/catch: si el archivo está abierto en Excel o no hay permiso, se muestra un mensaje en lugar de cerrarse el programa.\n        try\n        {\n            // UTF8Encoding(true) agrega la marca que Excel necesita para mostrar bien las tildes.\n            File.WriteAllText(dlg.FileName, sb.ToString(), new UTF8Encoding(true));\n            MessageBox.Show(this, \"Inventario exportado correctamente.\", \"Exportar\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n        catch (IOException ex)\n        {\n            MessageBox.Show(this, \"No se pudo guardar el archivo:\\n\" + ex.Message, \"Exportar\",\n                MessageBoxButtons.OK, MessageBoxIcon.Error);\n        }\n    }\n\n    // Encierra el texto entre comillas y duplica las comillas internas, como exige el formato CSV.\n    private static string Csv(string texto) => \"\\\"\" + texto.Replace(\"\\\"\", \"\\\"\\\"\") + \"\\\"\";\n\n    // Cuadro de información sencillo, sin decisiones: solo el botón Aceptar.\n    private void MostrarAcercaDe()\n    {\n        MessageBox.Show(this, \"AgroStock v1\\nEncuentro 1: Aplicaciones de interfaz gráfica\\nUNAN-Managua, CUR Matagalpa\",\n            \"Acerca de AgroStock\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n\n    // Mensaje reutilizado por Editar y Eliminar cuando no hay fila seleccionada.\n    private void AvisarSeleccion()\n    {\n        MessageBox.Show(this, \"Seleccione primero un producto de la lista.\", \"AgroStock\",\n            MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n\n    // ---------------------------------------------------------------- lista, filtro y barra de estado\n\n    // Devuelve el Producto de la fila actual, o null si no hay ninguna.\n    private Producto? ProductoSeleccionado()\n    {\n        // CurrentRow?. : si no hay fila actual, el resultado completo es null.\n        // DataBoundItem es el objeto enlazado a esa fila; \"as Producto\" lo convierte a su tipo.\n        return dgvProductos.CurrentRow?.DataBoundItem as Producto;\n    }\n\n    // Muestra en la cuadrícula toda la lista o solo los productos que coinciden con el texto de búsqueda.\n    private void AplicarFiltro()\n    {\n        var texto = txtBuscar.Text.Trim();\n        if (texto.Length == 0)\n        {\n            // Sin filtro: la cuadrícula se enlaza directamente a la lista y recibe todos los avisos de cambios.\n            dgvProductos.DataSource = productos;\n        }\n        else\n        {\n            // Con filtro: Where (LINQ) selecciona los que cumplen la condición; OrdinalIgnoreCase ignora mayúsculas.\n            var coincidencias = productos.Where(p =>\n                p.Codigo.Contains(texto, StringComparison.OrdinalIgnoreCase) ||\n                p.Nombre.Contains(texto, StringComparison.OrdinalIgnoreCase));\n            dgvProductos.DataSource = new BindingList<Producto>(coincidencias.ToList());\n        }\n        ActualizarTotal();\n    }\n\n    // Vuelve a dibujar la cuadrícula después de agregar, editar o eliminar.\n    private void RefrescarLista()\n    {\n        if (txtBuscar.Text.Trim().Length == 0)\n        {\n            // ResetBindings avisa a la cuadrícula que todo pudo cambiar y debe redibujar sus filas.\n            productos.ResetBindings();\n            ActualizarTotal();\n        }\n        else\n        {\n            // Con filtro activo hay que volver a calcular qué filas mostrar.\n            AplicarFiltro();\n        }\n    }\n\n    // Escribe en la barra de estado cuántos productos se ven del total.\n    private void ActualizarTotal()\n    {\n        // $\"...\" es interpolación de texto: lo que va entre llaves se reemplaza por su valor.\n        tslTotal.Text = $\"Productos: {dgvProductos.RowCount} de {productos.Count}\";\n    }\n\n    // Escribe la fecha y la hora actuales en la barra de estado.\n    private void ActualizarReloj()\n    {\n        tslReloj.Text = DateTime.Now.ToString(\"dd/MM/yyyy HH:mm:ss\");\n    }\n\n    // ---------------------------------------------------------------- cierre de la ventana\n\n    // Se ejecuta antes de cerrar. Si se pone e.Cancel = true, la ventana no se cierra.\n    private void FrmPrincipal_FormClosing(object? sender, FormClosingEventArgs e)\n    {\n        // Solo se pregunta cuando el usuario cierra la ventana (botón X o Alt+F4), no cuando Windows se apaga.\n        if (e.CloseReason != CloseReason.UserClosing) return;\n\n        var r = MessageBox.Show(this, \"¿Desea salir de AgroStock?\", \"Salir\",\n            MessageBoxButtons.YesNo, MessageBoxIcon.Question);\n        // Si responde No, se cancela el cierre y la ventana sigue abierta.\n        if (r == DialogResult.No) e.Cancel = true;\n    }\n}\n"}};
/* ===== progreso ===== */
const progress = store.get('progress', {});
function updateProgress() {
  const boxes = $$('.check input');
  const done = boxes.filter(b => b.checked).length;
  const pct = boxes.length ? Math.round(done / boxes.length * 100) : 0;
  $('#progbar').style.width = pct + '%';
  $('#progtxt').textContent = `${done} de ${boxes.length} comprobaciones`;
}

/* ================= Simulador 1: Explorador de soluciones ================= */
function simExplorer(host) {
  const ACTIONS = [
    { t: 'Crear el proyecto', d: 'Crear un proyecto nuevo → Aplicación de Windows Forms (C#) → nombre AgroStock.E01 → .NET 8.0 → Crear.',
      run: t => { t.children = [file('AgroStock.E01.csproj'), file('Form1.cs', [file('Form1.Designer.cs'), file('Form1.resx')]), file('Program.cs')]; } },
    { t: 'Crear la carpeta Models', d: 'Clic derecho sobre el proyecto → Agregar → Nueva carpeta → escriba Models.', run: t => t.children.push(dir('Models')) },
    { t: 'Crear la carpeta Forms', d: 'Clic derecho sobre el proyecto → Agregar → Nueva carpeta → escriba Forms.', run: t => t.children.push(dir('Forms')) },
    { t: 'Agregar el formulario FrmPrincipal', d: 'Clic derecho sobre Forms → Agregar → Formulario (Windows Forms) → nombre FrmPrincipal.cs.',
      run: t => find(t, 'Forms').children.push(file('FrmPrincipal.cs', [file('FrmPrincipal.Designer.cs'), file('FrmPrincipal.resx')])) },
    { t: 'Agregar el formulario FrmProducto', d: 'Clic derecho sobre Forms → Agregar → Formulario (Windows Forms) → nombre FrmProducto.cs.',
      run: t => find(t, 'Forms').children.push(file('FrmProducto.cs', [file('FrmProducto.Designer.cs'), file('FrmProducto.resx')])) },
    { t: 'Agregar la clase Producto', d: 'Clic derecho sobre Models → Agregar → Clase → nombre Producto.cs.', run: t => find(t, 'Models').children.push(file('Producto.cs')) },
    { t: 'Eliminar Form1.cs', d: 'Clic derecho sobre Form1.cs → Eliminar. Ya no se usará: la ventana principal ahora es FrmPrincipal.',
      run: t => { t.children = t.children.filter(c => c.name !== 'Form1.cs'); } },
  ];
  function file(name, children) { return { name, children: children || [], isFile: true, fresh: true }; }
  function dir(name) { return { name, children: [], fresh: true }; }
  function find(n, name) { if (n.name === name) return n; for (const c of n.children) { const r = find(c, name); if (r) return r; } return null; }
  let step = 0, tree;
  const reset = () => { tree = { name: 'AgroStock.E01', children: [], root: true, fresh: true }; step = 0; verBox.replaceChildren(); render(); };

  const seBox = h('div', { class: 'se', role: 'tree', 'aria-label': 'Explorador de soluciones simulado' });
  const status = h('div', { class: 'panel' });
  const card = h('div', { class: 'panel' });
  const verBox = h('div', { 'aria-live': 'polite' });
  function drawNode(n) {
    const ico = n.isFile ? (n.name.endsWith('.cs') ? 'C#' : n.name.endsWith('.csproj') ? '⚙' : '▤') : '▸';
    return h('li', null, h('div', { class: 'it' + (n.fresh ? ' new' : '') }, h('span', { class: 'ico' }, ico), n.name),
      n.children.length ? h('ul', null, n.children.map(drawNode)) : null);
  }
  function render() {
    seBox.replaceChildren(h('ul', null, step === 0 ? h('li', null, h('span', { style: 'color:#777' }, 'Todavía no hay proyecto.')) : drawNode(tree)));
    const done = step >= ACTIONS.length;
    card.replaceChildren(
      h('h4', null, done ? 'Estructura completa' : `Acción ${step + 1} de ${ACTIONS.length}: ${ACTIONS[step].t}`),
      h('p', { style: 'margin:0 0 10px;font-size:.93rem' }, done ? 'La estructura coincide con el mapa del proyecto. Visual Studio agregó un archivo .resx por cada formulario; no se edita.' : ACTIONS[step].d),
      h('div', { class: 'row' },
        h('button', { class: 'sbtn', disabled: done, onclick: advance }, 'Hacer esta acción'),
        h('button', { class: 'sbtn ghost', onclick: verify }, 'Verificar'), h('button', { class: 'sbtn ghost', onclick: reset }, 'Reiniciar')));
    status.replaceChildren(h('h4', null, 'Compilación'),
      step === 0 ? h('span', { class: 'pill' }, 'Sin proyecto')
        : step >= 7 ? h('span', { class: 'pill bad' }, 'Error CS0246: no se encontró el tipo «Form1» (Program.cs)')
          : h('span', { class: 'pill ok' }, 'Compila: Form1 todavía existe'),
      step >= 7 ? h('p', { style: 'margin:8px 0 0;font-size:.9rem;color:var(--muted)' }, 'Es lo esperado: Program.cs aún llama a Form1. Se corrige en el paso 2.') : null);
  }
  // Compara el árbol con el «Mapa del proyecto» (los .resx no cuentan: no se editan).
  const EXPECT = ['AgroStock.E01.csproj', 'Program.cs', 'Models/Producto.cs', 'Forms/FrmPrincipal.cs', 'Forms/FrmPrincipal.Designer.cs', 'Forms/FrmProducto.cs', 'Forms/FrmProducto.Designer.cs'];
  function verify() {
    if (step === 0) return verBox.replaceChildren(h('div', { class: 'note' }, 'Todavía no hay proyecto: haga primero las acciones.'));
    const have = [];
    (function walk(n, dir) {
      if (n.isFile) { if (!n.name.endsWith('.resx')) have.push(dir + n.name); n.children.forEach(c => walk(c, dir)); }
      else n.children.forEach(c => walk(c, n.root ? '' : dir + n.name + '/'));
    })(tree, '');
    const miss = EXPECT.filter(x => !have.includes(x)), extra = have.filter(x => !EXPECT.includes(x));
    if (!miss.length && !extra.length) {
      [1, 2, 3].forEach(j => { const cb = document.getElementById('c-crear-' + j); if (cb && !cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change')); } });
      verBox.replaceChildren(h('div', { class: 'panel' }, h('span', { class: 'pill ok' }, `Coincide con el mapa: ${EXPECT.length} de ${EXPECT.length} archivos`), h('p', { style: 'margin:8px 0 0;font-size:.9rem;color:var(--muted)' }, 'Se marcaron las comprobaciones de estructura y su avance quedó guardado en la barra superior.')));
    } else verBox.replaceChildren(h('div', { class: 'panel' }, h('span', { class: 'pill bad' }, `Aún no coincide: ${EXPECT.length - miss.length} de ${EXPECT.length} archivos`),
      h('ul', { style: 'margin:8px 0 0;padding-left:1.2em;font-size:.9rem' }, miss.map(x => h('li', null, 'Falta ', h('code', null, x))), extra.map(x => h('li', null, 'Sobra ', h('code', null, x))))));
  }
  function advance() {
    $$('.fresh', seBox);
    (function clearFresh(n) { n.fresh = false; n.children.forEach(clearFresh); })(tree);
    ACTIONS[step].run(tree); step++; verBox.replaceChildren(); render();
  }
  reset();
  host.append(h('div', { class: 'stage two' }, h('div', null, h('div', { class: 'row', style: 'margin-bottom:6px' }, h('b', null, 'Explorador de soluciones')), seBox), h('div', { style: 'display:flex;flex-direction:column;gap:12px;min-width:0' }, card, status, verBox)));
}

/* ================= Simulador 2: Bucle de mensajes ================= */
function simMessageLoop(host, viewer) {
  const queue = [];
  let busyUntil = 0, auto = false, timer = null, busyTotal = 0, crashed = false;
  const log = makeLog(null, 'Forms/FrmProducto.cs');
  const qBox = h('div', { class: 'logbox' });
  const state = h('div', { class: 'panel' }), boom = h('div', { class: 'panel', hidden: true });
  const win = h('div', { class: 'win', style: 'max-width:420px' });
  const txt = h('input', { class: 'w-in', 'aria-label': 'Cuadro de texto txtCodigo', placeholder: 'Escriba aquí (txtCodigo)' });
  const btnG = h('button', { class: 'w-btn', onclick: () => post({ ev: 'Click', src: 'btnGuardar', handler: 'BtnGuardar_Click', snippet: 'private void BtnGuardar_Click', dur: 0 }) }, 'Guardar');
  const btnS = h('button', { class: 'w-btn', onclick: () => post({ ev: 'Click', src: 'btnProcesar', handler: 'Procesar (tarda 3 s)', snippet: '', dur: 3000 }) }, 'Acción lenta');
  const btnT = h('button', { class: 'w-btn', onclick: () => post({ ev: 'Tick', src: 'tmrReloj', handler: 'ActualizarReloj', snippet: '', dur: 0 }) }, 'Tick del temporizador');
  txt.addEventListener('keypress', e => { if (e.key.length === 1) post({ ev: 'KeyPress', src: 'txtCodigo', handler: 'TxtCodigo_KeyPress', snippet: 'private void TxtCodigo_KeyPress', dur: 0, key: e.key }); });
  const overlay = h('div', { class: 'w-nores', hidden: true }, h('div', null, h('b', null, 'FrmPrincipal (No responde)'), h('br'), 'El hilo de la interfaz está ocupado; los clics se acumulan en la cola.'));
  const btnX = h('button', { class: 'w-btn', onclick: () => post({ ev: 'Click', src: 'btnProvocar', handler: 'BtnProvocar_Click', snippet: '', dur: 0, boom: true }) }, 'Provocar excepción');
  const live = [winBar('FrmPrincipal'), h('div', { class: 'w-body', style: 'display:flex;flex-direction:column;gap:8px' }, txt, h('div', { class: 'row' }, btnG, btnS, btnT, btnX)), overlay];
  win.append(...live);
  const THROW = 'throw new InvalidOperationException("Prueba del bucle de mensajes");';
  function reopen() { crashed = false; boom.hidden = true; win.replaceChildren(...live); log.push('Inicio', 'Application.Run(new Forms.FrmPrincipal()) vuelve a ejecutarse', ''); draw(); }
  function crash() {
    log.push('Click', 'de btnProvocar → se despacha BtnProvocar_Click()', '');
    log.push('Excepción', `${THROW}  → nadie la captura dentro de Application.Run`, '');
    queue.length = 0; crashed = true; busyUntil = 0;
    win.replaceChildren(winBar('FrmPrincipal (cerrada)'), h('div', { class: 'closed' },
      h('p', { style: 'margin:0 0 6px' }, h('b', null, 'La ventana se cerró de golpe.')),
      h('p', { style: 'margin:0 0 12px' }, 'El bucle despacha el mensaje y llama al manejador, pero no tiene try/catch: la excepción sube, Application.Run termina y los mensajes que quedaban en la cola se pierden.'),
      h('button', { class: 'w-btn def', onclick: reopen }, 'Volver a abrir')));
    boom.hidden = false;
    boom.replaceChildren(h('h4', null, 'Línea que lanza la excepción'),
      h('div', { class: 'codebox' }, h('div', null, 'private void BtnProvocar_Click(object? sender, EventArgs e)'), h('div', null, '{'), h('div', { class: 'chg' }, '    ' + THROW), h('div', null, '}')),
      h('p', { class: 'sim-desc', style: 'margin:8px 0 0' }, 'En Visual Studio (F5) el depurador se detiene en esa línea. Al ejecutar sin depurador, Windows Forms muestra primero «Excepción no controlada» (Continuar / Salir); si elige Salir, el programa termina. Solución: validar antes de lanzar, o try/catch dentro del manejador.'));
    draw();
  }

  function post(m) {
    queue.push(m); draw();
    if (auto) schedule();
  }
  function draw() {
    qBox.replaceChildren(...(queue.length ? queue.map((m, i) => h('div', { class: 'it' }, h('span', { class: 'ev' }, `${i + 1}. ${m.ev}`), h('span', null, `${m.src}${m.key ? ' · tecla «' + m.key + '»' : ''}`))) : [h('div', { class: 'empty' }, 'La cola está vacía.')]));
    const busy = Date.now() < busyUntil;
    overlay.hidden = !busy;
    state.replaceChildren(h('h4', null, 'Estado del bucle'),
      busy ? h('span', { class: 'pill bad' }, 'Ocupado: ejecutando un manejador lento') : queue.length ? h('span', { class: 'pill warn' }, `Hay ${queue.length} mensaje(s) esperando`) : h('span', { class: 'pill ok' }, 'Esperando mensajes (sin gastar procesador)'));
  }
  function step() {
    if (crashed || Date.now() < busyUntil || !queue.length) return;
    const m = queue.shift();
    if (m.boom) return crash();
    log.push(m.ev, `de ${m.src} → se despacha y ejecuta ${m.handler}()${m.key ? ' con e.KeyChar = \'' + m.key + '\'' : ''}`, m.snippet);
    if (m.dur) { busyUntil = Date.now() + m.dur; setTimeout(() => { draw(); if (auto) schedule(); }, m.dur + 20); }
    draw();
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(() => { step(); if (auto && queue.length) schedule(); }, 650); }
  const autoChk = h('input', { type: 'checkbox', id: 'sim2-auto', onchange: e => { auto = e.target.checked; if (auto) schedule(); } });
  host.append(h('div', { class: 'stage two' },
    h('div', { style: 'display:flex;flex-direction:column;gap:10px;min-width:0' }, win,
      h('p', { class: 'sim-desc' }, 'Pulse botones o escriba en el cuadro. Cada acción entra a la cola; el bucle las atiende de una en una.')),
    h('div', { style: 'display:flex;flex-direction:column;gap:10px;min-width:0' },
      h('div', { class: 'panel' }, h('h4', null, 'Dentro de Application.Run'), h('div', { class: 'codebox' }, 'mientras (la ventana siga abierta)\n{\n    mensaje = cola.Siguiente();   // espera si está vacía\n    despachar(mensaje);           // llama al manejador\n}')),
      state, h('div', { class: 'panel' }, h('h4', null, 'Cola de mensajes'), qBox),
      h('div', { class: 'row' }, h('button', { class: 'sbtn', onclick: step }, 'Atender el siguiente'), h('label', { class: 'row', for: 'sim2-auto', style: 'gap:6px;font-size:.92rem' }, autoChk, 'Automático')),
      boom, h('div', { class: 'panel' }, h('h4', null, 'Manejadores ejecutados'), log.box))));
  draw();
}

  host.append(h('div', { style: COL }, h('div', { class: 'win', style: 'max-width:340px' }, winBar('Existencias'), h('div', { class: 'w-body', style: 'display:flex;flex-direction:column;gap:8px' }, lbl, h('div', { class: 'row', style: 'justify-content:center' }, minus, plus))), pill,
    solution('private int cantidad;   // btnMenos.Enabled = false desde el diseñador\n\nprivate void BtnMas_Click(object? sender, EventArgs e) => Mostrar(cantidad + 1);\nprivate void BtnMenos_Click(object? sender, EventArgs e) => Mostrar(cantidad - 1);\n\nprivate void Mostrar(int nuevo)\n{\n    cantidad = nuevo;\n    lblCantidad.Text = cantidad.ToString();\n    btnMenos.Enabled = cantidad > 0;\n}')));
}

function exCalc(host) {
  const PRECIO = 1250, mk = (id, v, step) => h('input', { class: 'w-in', id, type: 'number', min: 0, max: 1000, step, value: v, inputmode: 'decimal' });
  const area = mk('ex21a', '2', '0.5'), dosis = mk('ex21d', '2', '0.25'), tot = h('b'), cos = h('b'), pill = h('span', { class: 'pill' });
  let k = 0;
  const calc = ev => {
    const a = Math.max(0, parseFloat(area.value) || 0), d = Math.max(0, parseFloat(dosis.value) || 0);
    tot.textContent = fmtN2(a * d) + ' qq'; cos.textContent = 'C$ ' + fmtN2(a * d * PRECIO);
    pill.className = 'pill ' + (ev ? 'ok' : ''); pill.textContent = ev ? `ValueChanged #${++k} de ${ev}` : 'Valores iniciales';
  };
  area.addEventListener('input', () => calc('nudArea')); dosis.addEventListener('input', () => calc('nudDosis')); calc();
  const row = (l, c, id) => h('div', { class: 'w-field', style: 'grid-template-columns:120px minmax(0,1fr)' }, h('label', { for: id }, l), c);
  host.append(h('div', { style: COL }, h('div', { class: 'win', style: 'max-width:380px' }, winBar('Calculadora de fertilizante'), h('div', { class: 'w-body' },
    row('Área (manzanas):', area, 'ex21a'), row('Dosis (qq/mz):', dosis, 'ex21d'), row('Precio por qq:', h('span', null, 'C$ ' + fmtN2(PRECIO) + ' (fijo)')), row('Total:', tot), row('Costo:', cos))), pill,
    solution('private const decimal PrecioQuintal = 1250m;\n\n// nudArea.ValueChanged += Calcular;  nudDosis.ValueChanged += Calcular;\nprivate void Calcular(object? sender, EventArgs e)\n{\n    decimal total = nudArea.Value * nudDosis.Value;\n    lblTotal.Text = $"{total:N2} qq";\n    lblCosto.Text = $"C$ {total * PrecioQuintal:N2}";\n}')));
}

function exSalir(host) {
  let open = null, closed = false;
  const log = makeLog(null, 'Forms/FrmPrincipal.cs');
  const win = h('div', { class: 'win', style: 'max-width:380px;min-height:210px' }), menu = h('div', { class: 'w-menu', role: 'menubar' });
  const body = h('div', { class: 'w-body', style: 'min-height:120px;font-size:13px' }, 'Calculadora de fertilizante. Pruebe Archivo → Salir, la X de la ventana o el apagado de Windows.');
  const app = h('div', null, menu, body);
  const MN = [['Archivo', 0, [['Salir', () => { log.push('Click', 'mnuSalir → Close()', ''); tryClose('UserClosing'); }]]],
    ['Ayuda', 56, [['Acerca de', () => { log.push('Click', 'mnuAcercaDe → MessageBox.Show(...)', ''); winMsg(win, app, { text: 'Calculadora de fertilizante\nEncuentro 1', caption: 'Acerca de' }); }]]]];
  function drawMenu() {
    menu.replaceChildren(...MN.map(([t, , items]) => h('button', { 'aria-haspopup': 'true', 'aria-expanded': String(open === t), onclick: ev => { ev.stopPropagation(); open = open === t ? null : t; drawMenu(); } }, t)),
      ...MN.filter(m => m[0] === open).map(([, left, items]) => h('div', { class: 'w-drop', role: 'menu', style: `left:${left}px` }, items.map(([t, fn]) => h('button', { role: 'menuitem', onclick: ev => { ev.stopPropagation(); open = null; drawMenu(); fn(); } }, t)))));
  }
  function shut() { closed = true; draw(); }
  function tryClose(reason) {
    log.push('FormClosing', `se dispara antes de cerrar; e.CloseReason = ${reason}`, '');
    if (reason !== 'UserClosing') { log.push('FormClosing', 'CloseReason distinto de UserClosing → return: no pregunta y la ventana se cierra', ''); return shut(); }
    winMsg(win, app, { text: '¿Desea salir de la calculadora?', caption: 'Salir', icon: 'q', buttons: ['Sí', 'No'], def: 0, cb: b => {
      if (b === 'No') log.push('FormClosing', 'r == DialogResult.No → e.Cancel = true: la ventana sigue abierta', '');
      else { log.push('Application', 'Application.Run termina: el programa se cierra', ''); shut(); } } });
  }
  function draw() {
    if (closed) return win.replaceChildren(winBar('Calculadora (cerrada)'), h('div', { class: 'closed' }, h('p', { style: 'margin:0 0 12px' }, 'La ventana se cerró.'), h('button', { class: 'w-btn def', onclick: () => { closed = false; log.clear(); draw(); } }, 'Volver a abrir')));
    drawMenu(); win.replaceChildren(winBar('Calculadora de fertilizante', () => { log.push('Click', 'botón X → Close()', ''); tryClose('UserClosing'); }), app);
  }
  document.addEventListener('click', () => { if (open) { open = null; drawMenu(); } });
  draw();
  host.append(h('div', { style: COL }, win, h('div', { class: 'row' }, h('button', { class: 'sbtn ghost sm', onclick: () => { if (!closed) tryClose('WindowsShutDown'); } }, 'Simular apagado de Windows')),
    h('div', { class: 'panel' }, h('h4', null, 'Eventos'), log.box),
    solution('mnuSalir.Click += (_, _) => Close();\nmnuAcercaDe.Click += (_, _) => MessageBox.Show(this, "Calculadora de fertilizante", "Acerca de", MessageBoxButtons.OK, MessageBoxIcon.Information);\nFormClosing += (_, e) =>\n{\n    if (e.CloseReason != CloseReason.UserClosing) return;\n    var r = MessageBox.Show(this, "¿Desea salir?", "Salir", MessageBoxButtons.YesNo, MessageBoxIcon.Question);\n    if (r == DialogResult.No) e.Cancel = true;\n};')));
}

function goStep(id) { const el = document.getElementById('paso-' + id) || document.getElementById(id); if (el) el.scrollIntoView({ behavior: RM() ? 'auto' : 'smooth', block: 'start' }); }

function renderSteps() {
  const nav = $('#nav');
  const wrap = $('#steps');
  STEPS.forEach((s, i) => {
    nav.append(h('button', { 'data-id': s.id, onclick: () => goStep(s.id) }, `${i + 1}. ${s.nav}`));
    const sec = h('section', { class: 'step', id: 'paso-' + s.id, 'aria-labelledby': 'h-' + s.id });
    sec.append(h('div', { class: 'step-h' }, h('span', { class: 'num' }, `Paso ${i + 1} de ${STEPS.length}`), h('h2', { id: 'h-' + s.id }, s.title), h('p', { class: 'goal' }, s.goal)));
    sec.append(h('div', null, h('h3', { class: 'block-h' }, 'En Visual Studio'), h('ol', { class: 'how' }, s.how.map(t => h('li', { html: t })))));
    if (s.table === 'controles') {
      sec.append(h('div', null, h('h3', { class: 'block-h' }, 'Controles de FrmProducto (Opción A)'), h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, ['Control', 'Name', 'Propiedades que debe cambiar'].map(t => h('th', null, t)))),
        h('tbody', null, [
          ['Label ×6', 'lblCodigo, lblNombre, lblCategoria, lblPrecio, lblExistencia, lblVencimiento', 'Text con & antes de la letra de acceso (&Código:, &Nombre:...)'],
          ['TextBox', 'txtCodigo', 'MaxLength = 15'], ['TextBox', 'txtNombre', 'MaxLength = 60'],
          ['ComboBox', 'cboCategoria', 'DropDownStyle = DropDownList'],
          ['NumericUpDown', 'nudPrecio', 'DecimalPlaces = 2, Maximum = 100000, ThousandsSeparator = True'],
          ['NumericUpDown', 'nudExistencia', 'Maximum = 100000, ThousandsSeparator = True'],
          ['DateTimePicker', 'dtpVencimiento', 'Format = Short, ShowCheckBox = True'],
          ['Button', 'btnGuardar', 'Text = &Guardar'], ['Button', 'btnCancelar', 'Text = Cancelar, DialogResult = Cancel'],
          ['ErrorProvider', 'errores', 'Se arrastra a la bandeja de componentes'],
          ['Form', 'FrmProducto', 'AcceptButton = btnGuardar, CancelButton = btnCancelar, FormBorderStyle = FixedDialog, MaximizeBox y MinimizeBox = False, StartPosition = CenterParent']
        ].map(r => h('tr', null, h('td', null, r[0]), h('td', { class: 'mono' }, r[1]), h('td', null, r[2]))))))));
    }
    if (s.files) { const v = makeViewer(s.files); stepViewers[s.id] = v; sec.append(h('div', null, h('h3', { class: 'block-h' }, s.files.length > 1 ? 'Código de este paso' : 'Código de este paso'), v.root)); }
    if (s.after) sec.append(h('div', { html: s.after }));
    if (s.sim) {
      const host = h('div');
      sec.append(h('div', { class: 'sim' }, h('div', { class: 'sim-h' }, h('span', { class: 'tagsim' }, 'Simulador'), h('h3', null, s.simTitle)), h('p', { class: 'sim-desc' }, s.simDesc), host));
      lazy(host, () => SIMS[s.sim](host, stepViewers[s.id]));
    }
    if (s.sim2) {
      const host2 = h('div');
      sec.append(h('div', { class: 'sim' }, h('div', { class: 'sim-h' }, h('span', { class: 'tagsim' }, 'Simulador'), h('h3', null, s.sim2Title)), h('p', { class: 'sim-desc' }, s.sim2Desc), host2));
      lazy(host2, () => SIMS[s.sim2](host2, stepViewers[s.id]));
    }
    if (s.errors) sec.append(renderErrors(s));
    const cs = progress[s.id] || [];
    sec.append(h('div', { class: 'check' }, h('h3', { class: 'block-h' }, 'Compruebe antes de seguir'), h('ul', null, s.check.map((t, j) => {
      const id = `c-${s.id}-${j}`;
      return h('li', null, h('label', { for: id }, h('input', { type: 'checkbox', id, checked: !!cs[j], onchange: e => { const arr = progress[s.id] || []; arr[j] = e.target.checked; progress[s.id] = arr; store.set('progress', progress); updateProgress(); } }), h('span', null, t)));
    }))));
    if (s.next) sec.append(h('div', { class: 'tip' }, h('b', null, 'Después del encuentro. '), 'Complete los niveles de la ejercitación: agregue un ContextMenuStrip a la cuadrícula con Editar y Eliminar, y coloree en naranja las filas con existencia menor que 10 con el evento CellFormatting. Entregue el proyecto sin las carpetas bin y obj, o el enlace del repositorio, en el aula virtual.', ' ', h('button', { class: 'sbtn ghost sm', onclick: () => goStep('ejercitacion') }, 'Ir a la ejercitación'), ' ', h('button', { class: 'sbtn ghost sm', onclick: () => goStep('boa') }, 'Ir a la BOA')));

  const io = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting) { $$('#nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === en.target.id.replace(/^paso-/, '')))); } }); }, { rootMargin: '-35% 0px -60% 0px' });
  $$('.step').forEach(s => io.observe(s));
}
